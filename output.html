    // Fetch leaderboard data from Virtius API and render custom table
    // gender parameter controls column visibility (women don't have Exec/SB)
    async function fetchAndRenderLeaderboard(sessionId, eventName, shortCode, gender = 'mens') {
      const contentEl = document.getElementById('leaderboard-content');
      if (!contentEl) return;

      try {
        // Ensure Firebase headshots/teams are loaded for school info enrichment
        await waitForHeadshots();

        const response = await fetch(`https://api.virti.us/session/${sessionId}/json`);
        if (!response.ok) throw new Error('Failed to fetch');
        const data = await response.json();

        // Build team logo, team name, and gymnast-to-team maps from teams data
        const teamLogos = {};
        const teamNames = {};  // Map tricode -> proper team name
        const gymnastToTeam = {};  // Map gymnast_id -> team info
        const gymnastNameToTeam = {};  // Map full_name -> team info (for AA which lacks gymnast_id)
        if (data.meet?.teams) {
          data.meet.teams.forEach((team, teamIdx) => {
            // Use team.name (not short_name) - that's where Virtius stores the team name
            const teamName = team.name || team.short_name || team.tricode || '';
            const teamLogo = team.logo || '';

            if (team.tricode && team.logo) {
              teamLogos[team.tricode] = team.logo;
            }
            if (team.name && team.logo) {
              teamLogos[team.name] = team.logo;
            }
            if (team.short_name && team.logo) {
              teamLogos[team.short_name] = team.logo;
            }
            // Map tricode/name to team name
            if (team.tricode) {
              teamNames[team.tricode] = teamName;
            }
            if (team.name) {
              teamNames[team.name] = teamName;
            }
            if (team.short_name) {
              teamNames[team.short_name] = teamName;
            }

            // Build gymnast -> team maps by scanning all events
            // AA results don't include gymnast_id, so we need name-based lookup too
            if (team.events) {
              team.events.forEach(event => {
                if (event.gymnasts) {
                  event.gymnasts.forEach(g => {
                    const teamInfo = { name: teamName, logo: teamLogo };
                    // ID-based map (for non-AA events)
                    if (g.gymnast_id && !gymnastToTeam[g.gymnast_id]) {
                      gymnastToTeam[g.gymnast_id] = teamInfo;
                    }
                    // Name-based map (for AA events which lack gymnast_id)
                    const fullName = g.full_name || `${g.first_name} ${g.last_name}`.trim();
                    if (fullName && !gymnastNameToTeam[fullName]) {
                      gymnastNameToTeam[fullName] = teamInfo;
                    }
                  });
                }
              });
            }
          });
        }
        // Check if this is All Around (AA doesn't have D/E scores)
        const isAllAround = eventName === 'All Around';
        const isWomens = gender === 'womens';

        // Find the event results
        let eventResults = data.meet?.event_results?.find(e => e.event_name === eventName);

        // For All Around: if API results are missing/incomplete, aggregate manually from individual events
        if (isAllAround && (!eventResults || !eventResults.gymnasts || eventResults.gymnasts.length < 5)) {
          console.log('AA event_results incomplete, aggregating from individual events...');

          // Define required events by gender (both full names and API short names)
          const mensEvents = ['Floor Exercise', 'Pommel Horse', 'Still Rings', 'Vault', 'Parallel Bars', 'High Bar',
                              'FLOOR', 'HORSE', 'RINGS', 'VAULT', 'PBARS', 'BAR'];
          const womensEvents = ['Vault', 'Uneven Bars', 'Balance Beam', 'Floor Exercise',
                                'VAULT', 'BARS', 'BEAM', 'FLOOR'];
          const requiredEvents = isWomens ? womensEvents : mensEvents;
          const requiredEventCount = isWomens ? 4 : 6;

          // Aggregate scores for each gymnast across all events
          const gymnastAA = {}; // Map: gymnast name -> { scores: {event: score}, teamInfo, total }

          if (data.meet?.teams) {
            data.meet.teams.forEach(team => {
              const teamName = team.name || team.short_name || team.tricode || '';
              const teamLogo = team.logo || '';

              if (team.events) {
                team.events.forEach(event => {
                  const rawEventName = event.event_name;
                  if (!requiredEvents.includes(rawEventName)) return;
                  // Normalize to uppercase for dedup (API may use 'VAULT' or 'Vault')
                  const eventName = rawEventName.toUpperCase();

                  if (event.gymnasts) {
                    event.gymnasts.forEach(g => {
                      const fullName = g.full_name || `${g.first_name || ''} ${g.last_name || ''}`.trim();
                      if (!fullName) return;

                      const score = parseFloat(g.final_score) || 0;
                      if (score <= 0) return; // Skip zero/missing scores

                      if (!gymnastAA[fullName]) {
                        // Event Finals enrichment: resolve apparatus flight names to real schools
                        let resolvedName = teamName;
                        let resolvedLogo = teamLogo;
                        if (!resolvedLogo || APPARATUS_FLIGHT_REGEX.test(resolvedName)) {
                          const schoolInfo = getSchoolInfoFromName(fullName);
                          if (schoolInfo) {
                            resolvedName = schoolInfo.schoolName;
                            resolvedLogo = getTeamLogoUrl(schoolInfo.schoolName, '') || schoolInfo.schoolLogo || resolvedLogo;
                          }
                        }
                        gymnastAA[fullName] = {
                          full_name: fullName,
                          first_name: g.first_name,
                          last_name: g.last_name,
                          gymnast_id: g.gymnast_id,
                          team_name: resolvedName,
                          team_logo: resolvedLogo,
                          scores: {},
                          eventCount: 0,
                          total: 0
                        };
                      }

                      // Only count each event once per gymnast
                      if (!gymnastAA[fullName].scores[eventName]) {
                        gymnastAA[fullName].scores[eventName] = score;
                        gymnastAA[fullName].eventCount++;
                        gymnastAA[fullName].total += score;
                      }
                    });
                  }
                });
              }
            });
          }

          // Filter to gymnasts who completed ALL required events
          const completeGymnasts = Object.values(gymnastAA)
            .filter(g => g.eventCount === requiredEventCount)
            .sort((a, b) => b.total - a.total); // Sort by total descending

          console.log(`Found ${completeGymnasts.length} gymnasts with complete AA (${requiredEventCount} events)`);

          if (completeGymnasts.length > 0) {
            // Assign places (handle ties)
            let currentPlace = 1;
            completeGymnasts.forEach((g, i) => {
              if (i > 0 && g.total < completeGymnasts[i-1].total) {
                currentPlace = i + 1;
              }
              g.place = currentPlace;
            });

            // Create synthetic event results structure
            eventResults = {
              event_name: 'All Around',
              gymnasts: completeGymnasts.map(g => ({
                full_name: g.full_name,
                first_name: g.first_name,
                last_name: g.last_name,
                gymnast_id: g.gymnast_id,
                team_name: g.team_name,
                final_score: g.total.toFixed(3),
                place: g.place,
                // Store team info for later lookup
                _teamLogo: g.team_logo,
                _aggregated: true
              }))
            };
          }
        }

        if (!eventResults || !eventResults.gymnasts || eventResults.gymnasts.length === 0) {
          const errorMsg = isAllAround
            ? 'No All Around results available yet. AA scores require completing all events.'
            : 'No results found for this event';
          contentEl.innerHTML = `<div class="leaderboard-error">${errorMsg}</div>`;
          return;
        }

        // Build a map of gymnast_id -> detailed scores from team data FIRST
        // (needed for tiebreaker sorting by execution score)
        // The event_results only has final_score, but team.events[].gymnasts[] has e_score and scores[].start
        const gymnastScores = {};
        if (data.meet?.teams) {
          data.meet.teams.forEach(team => {
            if (team.events) {
              team.events.forEach(event => {
                if (event.event_name === eventName && event.gymnasts) {
                  event.gymnasts.forEach(g => {
                    if (g.gymnast_id) {
                      // Get start value from the first score entry (judge scores)
                      const startValue = g.scores && g.scores.length > 0
                        ? parseFloat(g.scores[0].start) || 0
                        : 0;
                      const execValue = parseFloat(g.e_score) || 0;
                      const ndValue = parseFloat(g.neutral) || 0;
                      const bonusValue = parseFloat(g.bonus) || 0;
                      const finalScore = parseFloat(g.final_score) || 0;

                      // Validation: score = difficulty + execution - neutral + bonus
                      // (e_score already includes the 10.0 base)
                      const calculated = startValue + execValue - ndValue + bonusValue;
                      console.log(`${g.first_name} ${g.last_name}: D=${startValue} E=${execValue} ND=${ndValue} B=${bonusValue} | Calc=${calculated.toFixed(3)} Actual=${finalScore.toFixed(3)}`);

                      gymnastScores[g.gymnast_id] = {
                        start: startValue,
                        exec: execValue,
                        nd: ndValue,
                        bonus: bonusValue
                      };
                    }
                  });
                }
              });
            }
          });
        }
        console.log('Gymnast scores map:', gymnastScores);

        // Sort by place, then by execution score (higher exec wins tiebreaker), limit to top 10
        const gymnasts = eventResults.gymnasts
          .sort((a, b) => {
            const placeA = a.place || 999;
            const placeB = b.place || 999;
            if (placeA !== placeB) return placeA - placeB;
            // Tiebreaker: higher execution score comes first
            const execA = gymnastScores[a.gymnast_id]?.exec || 0;
            const execB = gymnastScores[b.gymnast_id]?.exec || 0;
            return execB - execA; // Descending (higher exec first)
          })
          .slice(0, 10);

        // Calculate diff from leader (scores are strings in API)
        const topScore = parseFloat(gymnasts[0]?.final_score) || 0;

        // Build table HTML - columns vary by gender and event type
        // Men's: #, Name, Team, Apparatus, Score, Diff., Exec., SB
        // Women's: #, Name, Team, Apparatus, Score, Diff. (no Exec or SB)
        // All Around: #, Name, Team, Score only (no Diff/Exec/SB - they don't apply to AA totals)

        let tableHtml = `
          <table class="leaderboard-table${isWomens ? ' leaderboard-womens' : ''}${isAllAround ? ' leaderboard-aa' : ''}">
            <thead>
              <tr>
                <th class="col-rank">#</th>
                <th class="col-name">Name</th>
                <th class="col-team">Team</th>
                ${isAllAround ? '' : '<th class="col-apparatus">Apparatus</th>'}
                <th class="col-score">Score</th>
                ${isAllAround || isWomens ? '' : '<th class="col-diff">Diff.</th>'}
                ${isWomens || isAllAround ? '' : '<th class="col-exec">Exec.</th>'}
                ${isWomens || isAllAround ? '' : '<th class="col-sb">SB</th>'}
              </tr>
            </thead>
            <tbody>
        `;

        // Check for ties - count how many gymnasts share each place
        const placeCounts = {};
        gymnasts.forEach(g => {
          const p = g.place || 999;
          placeCounts[p] = (placeCounts[p] || 0) + 1;
        });

        gymnasts.forEach((g, i) => {
          const score = parseFloat(g.final_score) || 0;
          const place = g.place || i + 1;
          const isTied = placeCounts[place] > 1;

          // Get detailed scores from the gymnastScores map (built from team data)
          const detailedScores = gymnastScores[g.gymnast_id] || {};
          const dScore = detailedScores.start || 0;
          const eScore = detailedScores.exec || 0;
          // Stick bonus is indicated by bonus > 0 in the API
          const hasStick = detailedScores.bonus > 0;

          // Rank display - plain number, with T superscript for ties
          const rankHtml = isTied ? `${place}<sup>T</sup>` : place;

          // Name with colored circle indicator for top 3
          const placeIndicator = place === 1 ? '<span class="place-indicator gold"></span>' :
                                 place === 2 ? '<span class="place-indicator silver"></span>' :
                                 place === 3 ? '<span class="place-indicator bronze"></span>' : '';

          // Team info lookup - try multiple strategies:
          // 1. aggregated AA data (has _teamLogo from manual aggregation)
          // 2. gymnast_id lookup (works for non-AA events)
          // 3. name lookup (works for AA events which lack gymnast_id)
          // 4. tricode lookup
          // 5. fall back to g.team_name (may be wrong for AA)
          const gymnastFullName = g.full_name || `${g.first_name || ''} ${g.last_name || ''}`.trim();
          const gymnastTeamInfo = gymnastToTeam[g.gymnast_id] || gymnastNameToTeam[gymnastFullName] || {};
          const teamKey = g.tricode || g.short_name || '';
          let logoUrl = g._teamLogo || gymnastTeamInfo.logo || teamLogos[teamKey] || '';
          let teamName = gymnastTeamInfo.name || teamNames[teamKey] || g.team_name || g.short_name || '';

          // Event Finals enrichment: if team name is an apparatus flight (e.g., "VT - A"),
          // look up the gymnast's real school from the Firebase headshots database
          if (!logoUrl || APPARATUS_FLIGHT_REGEX.test(teamName)) {
            const schoolInfo = getSchoolInfoFromName(gymnastFullName);
            if (schoolInfo) {
              teamName = schoolInfo.schoolName;
              logoUrl = getTeamLogoUrl(schoolInfo.schoolName, '') || schoolInfo.schoolLogo || logoUrl;
            }
          }

          const logoHtml = logoUrl ? `<img class="leaderboard-team-logo" src="${logoUrl}" alt="">` : '';

          // Stick bonus indicator
          const stickHtml = hasStick ? '<span class="stick-bonus">S</span>' : '';

          // Format difficulty - show 2 decimals, execution show 3 decimals
          const dScoreStr = dScore > 0 ? dScore.toFixed(2) : '-';
          const eScoreStr = eScore > 0 ? eScore.toFixed(3) : '-';

          tableHtml += `
            <tr>
              <td class="col-rank">${rankHtml}</td>
              <td class="col-name">${placeIndicator}${g.full_name || g.last_name || 'Unknown'}</td>
              <td class="col-team">${logoHtml}${teamName}</td>
              ${isAllAround ? '' : `<td class="col-apparatus"><span class="apparatus-badge">${shortCode}</span></td>`}
              <td class="col-score">${score.toFixed(3)}</td>
              ${isAllAround || isWomens ? '' : `<td class="col-diff">${dScoreStr}</td>`}
              ${isWomens || isAllAround ? '' : `<td class="col-exec">${eScoreStr}</td>`}
              ${isWomens || isAllAround ? '' : `<td class="col-sb">${stickHtml}</td>`}
            </tr>
          `;
        });

        tableHtml += '</tbody></table>';
        contentEl.innerHTML = tableHtml;

      } catch (error) {
        console.error('Leaderboard fetch error:', error);
        contentEl.innerHTML = '<div class="leaderboard-error">Error loading leaderboard</div>';
      }
    }

    // Fetch two Virtius sessions, merge AA scores, render combined leaderboard
    async function fetchAndRenderCombinedAALeaderboard(sessionId1, sessionId2, gender = 'womens') {
      const contentEl = document.getElementById('leaderboard-content');
      if (!contentEl) return;

      const isWomens = gender === 'womens';
      const requiredEventCount = isWomens ? 4 : 6;
      const mensEvents = ['Floor Exercise', 'Pommel Horse', 'Still Rings', 'Vault', 'Parallel Bars', 'High Bar',
                          'FLOOR', 'HORSE', 'RINGS', 'VAULT', 'PBARS', 'BAR'];
      const womensEvents = ['Vault', 'Uneven Bars', 'Balance Beam', 'Floor Exercise',
                            'VAULT', 'BARS', 'BEAM', 'FLOOR'];
      const requiredEvents = isWomens ? womensEvents : mensEvents;

      try {
        // Ensure Firebase headshots/teams are loaded for school info enrichment
        await waitForHeadshots();

        // Fetch both sessions in parallel
        const [resp1, resp2] = await Promise.all([
          fetch(`https://api.virti.us/session/${sessionId1}/json`),
          fetch(`https://api.virti.us/session/${sessionId2}/json`),
        ]);
        if (!resp1.ok) throw new Error(`Failed to fetch session 1 (${sessionId1})`);
        if (!resp2.ok) throw new Error(`Failed to fetch session 2 (${sessionId2})`);
        const [data1, data2] = await Promise.all([resp1.json(), resp2.json()]);

        // Aggregate AA scores from a single session's data
        function aggregateAAFromSession(data) {
          const gymnastAA = {};
          if (!data.meet?.teams) return gymnastAA;

          data.meet.teams.forEach(team => {
            const teamName = team.name || team.short_name || team.tricode || '';
            const teamLogo = team.logo || '';

            if (team.events) {
              team.events.forEach(event => {
                const rawEventName = event.event_name;
                if (!requiredEvents.includes(rawEventName)) return;
                const normEvent = rawEventName.toUpperCase();

                if (event.gymnasts) {
                  event.gymnasts.forEach(g => {
                    const fullName = g.full_name || `${g.first_name || ''} ${g.last_name || ''}`.trim();
                    if (!fullName) return;
                    const score = parseFloat(g.final_score) || 0;
                    if (score <= 0) return;

                    if (!gymnastAA[fullName]) {
                      // Event Finals enrichment: resolve apparatus flight names to real schools
                      let resolvedName = teamName;
                      let resolvedLogo = teamLogo;
                      if (!resolvedLogo || APPARATUS_FLIGHT_REGEX.test(resolvedName)) {
                        const schoolInfo = getSchoolInfoFromName(fullName);
                        if (schoolInfo) {
                          resolvedName = schoolInfo.schoolName;
                          resolvedLogo = getTeamLogoUrl(schoolInfo.schoolName, '') || schoolInfo.schoolLogo || resolvedLogo;
                        }
                      }
                      gymnastAA[fullName] = {
                        full_name: fullName,
                        team_name: resolvedName,
                        team_logo: resolvedLogo,
                        scores: {},
                        eventCount: 0,
                        total: 0
                      };
                    }
                    if (!gymnastAA[fullName].scores[normEvent]) {
                      gymnastAA[fullName].scores[normEvent] = score;
                      gymnastAA[fullName].eventCount++;
                      gymnastAA[fullName].total += score;
                    }
                  });
                }
              });
            }
          });
          return gymnastAA;
        }

        // Aggregate from both sessions
        const aa1 = aggregateAAFromSession(data1);
        const aa2 = aggregateAAFromSession(data2);

        // Merge: combine both maps, keeping entries separate (different sessions = different gymnasts)
        // If same gymnast appears in both (unlikely), keep the higher total
        const merged = { ...aa1 };
        for (const [name, entry] of Object.entries(aa2)) {
          if (!merged[name] || entry.total > merged[name].total) {
            merged[name] = entry;
          }
        }

        // Filter to gymnasts who completed all required events, sort descending
        const completeGymnasts = Object.values(merged)
          .filter(g => g.eventCount === requiredEventCount)
          .sort((a, b) => b.total - a.total);

        console.log(`Combined AA: ${Object.keys(aa1).length} gymnasts from session 1, ${Object.keys(aa2).length} from session 2, ${completeGymnasts.length} complete`);

        if (completeGymnasts.length === 0) {
          contentEl.innerHTML = '<div class="leaderboard-error">No All Around results available yet. AA scores require completing all events.</div>';
          return;
        }

        // Assign places with tie handling
        let currentPlace = 1;
        completeGymnasts.forEach((g, i) => {
          if (i > 0 && g.total < completeGymnasts[i - 1].total) {
            currentPlace = i + 1;
          }
          g.place = currentPlace;
        });

        // Limit to top 10
        const top = completeGymnasts.slice(0, 10);

        // Check for ties
        const placeCounts = {};
        top.forEach(g => { placeCounts[g.place] = (placeCounts[g.place] || 0) + 1; });

        // Build table — same AA format: #, Name, Team, Score
        let tableHtml = `
          <table class="leaderboard-table${isWomens ? ' leaderboard-womens' : ''} leaderboard-aa">
            <thead>
              <tr>
                <th class="col-rank">#</th>
                <th class="col-name">Name</th>
                <th class="col-team">Team</th>
                <th class="col-score">Score</th>
              </tr>
            </thead>
            <tbody>
        `;

        top.forEach((g, i) => {
          const isTied = placeCounts[g.place] > 1;
          const rankHtml = isTied ? `${g.place}<sup>T</sup>` : g.place;
          const placeIndicator = g.place === 1 ? '<span class="place-indicator gold"></span>' :
                                 g.place === 2 ? '<span class="place-indicator silver"></span>' :
                                 g.place === 3 ? '<span class="place-indicator bronze"></span>' : '';
          const logoHtml = g.team_logo ? `<img class="leaderboard-team-logo" src="${g.team_logo}" alt="">` : '';

          tableHtml += `
            <tr>
              <td class="col-rank">${rankHtml}</td>
              <td class="col-name">${placeIndicator}${g.full_name}</td>
              <td class="col-team">${logoHtml}${g.team_name}</td>
              <td class="col-score">${g.total.toFixed(3)}</td>
            </tr>
          `;
        });

        tableHtml += '</tbody></table>';
        contentEl.innerHTML = tableHtml;

      } catch (error) {
        console.error('Combined AA leaderboard fetch error:', error);
        contentEl.innerHTML = `<div class="leaderboard-error">Error loading combined leaderboard: ${error.message}</div>`;

      const rawFullName = `${firstName || ''} ${lastName || ''}`.trim();
      const normalized = normalizeNameUnified(rawFullName);
      const stripped = normalized.replace(/[^a-z\s]/g, '').replace(/\s+/g, ' ').trim();

      // Generate multiple lookup keys to maximize matching
      const lookupKeys = [
        // 1. Original lowercase (exact match)
        rawFullName.toLowerCase().replace(/\s+/g, ' ').trim(),
        // 2. Fully normalized (unified normalization)
        normalized,
        // 3. Stripped (only letters and spaces)
        stripped,
      ];

      // 4. Handle 3+ part names (e.g., "Benjamin Thurlow Lam")
      const parts = normalized.split(' ').filter(Boolean);
      if (parts.length >= 3) {
        // First + Last only (skip middle name)
        lookupKeys.push(`${parts[0]} ${parts[parts.length - 1]}`);
        // First + Middle initial + Last
        lookupKeys.push(`${parts[0]} ${parts[1][0]} ${parts[parts.length - 1]}`);
        // For 4+ parts, try first two + last
        if (parts.length >= 4) {
          lookupKeys.push(`${parts[0]} ${parts[1]} ${parts[parts.length - 1]}`);
        }
      }

      // 5. Handle case where firstName contains multiple parts
      const firstParts = (firstName || '').trim().split(/\s+/).filter(Boolean);
      if (firstParts.length >= 2 && lastName) {
        // Just first part of firstName + lastName
        lookupKeys.push(`${normalizeNameUnified(firstParts[0])} ${normalizeNameUnified(lastName)}`);
        // First part + initial + lastName
        lookupKeys.push(`${normalizeNameUnified(firstParts[0])} ${firstParts[1][0].toLowerCase()} ${normalizeNameUnified(lastName)}`);
      }

      // Remove duplicates and empty strings
      const uniqueKeys = [...new Set(lookupKeys.filter(Boolean))];

      // Try each key against Firebase headshots
      for (const key of uniqueKeys) {
        if (firebaseHeadshots[key]) {
          return firebaseHeadshots[key];
        }
      }

      // Try each key against static library
      for (const key of uniqueKeys) {
        if (ATHLETE_HEADSHOTS[key]) {
          return ATHLETE_HEADSHOTS[key];
        }
      }

      // Debug: log when no headshot found (only if not found after all attempts)
      console.log(`No headshot found for: "${rawFullName}" (tried keys: ${uniqueKeys.join(', ')})`);

      // Fall back to API headshot
      return apiHeadshot || '';
    }

    // Get the schedule key based on competition parameters
    // For 5+ teams (especially women's), returns null to force API-based event detection
    function getScheduleKey(numTeams, competitionFormat, gender = 'mens') {
      const genderPrefix = gender === 'womens' ? 'womens' : 'mens';

      if (numTeams === 2) {
        // Dual meet - check format
        if (competitionFormat === 'head-to-head') {
          return `${genderPrefix}-dual-headtohead`;
        } else if (competitionFormat === 'alternating') {
          return `${genderPrefix}-dual-alternating`;
        }
        return `${genderPrefix}-dual-headtohead`; // default
      } else if (numTeams === 3) {
        return `${genderPrefix}-tri`;
      } else if (numTeams === 4) {
        return `${genderPrefix}-quad`;
      } else if (numTeams >= 5) {
        // For 5+ team meets (womens-5, womens-6, womens-7, mens-5, mens-6),
        // return null to use API-based event detection via Virtius rotation field
        // No hardcoded schedules exist for these formats
        return null;
      }
      return `${genderPrefix}-dual-headtohead`; // fallback
    }

    // Get all events active in a rotation with their team assignments
    // Returns array of { eventName, teamOrders: number[] }
    function getEventsInRotation(rotation, numTeams, competitionFormat, gender = 'mens') {
      const scheduleKey = getScheduleKey(numTeams, competitionFormat, gender);
      const schedule = ROTATION_SCHEDULES[scheduleKey];

      if (!schedule || !schedule.schedule[rotation]) {
        // Fallback: all events with no specific assignment
        const events = gender === 'womens'
          ? ['VAULT', 'BARS', 'BEAM', 'FLOOR']
          : ['FLOOR', 'HORSE', 'RINGS', 'VAULT', 'PBARS', 'BAR'];
        return events.map(e => ({ eventName: e, teamOrders: [0] }));
      }

      const rotationSchedule = schedule.schedule[rotation];
      const events = [];

      for (const [eventName, teamValue] of Object.entries(rotationSchedule)) {
        if (teamValue !== null) {
          const teamOrders = Array.isArray(teamValue) ? teamValue : [teamValue];
          events.push({ eventName, teamOrders });
        }
      }

      // Sort by event order
      const eventOrder = schedule.eventOrder || [];
      events.sort((a, b) => eventOrder.indexOf(a.eventName) - eventOrder.indexOf(b.eventName));

      return events;
    }

    // Calculate which event a team is on for a given rotation
    // Returns the event name (API format like 'FLOOR', 'HORSE', etc.)
    // - Head-to-head: Both teams compete on the SAME apparatus (Floor, then PH, etc.)
    // - Alternating: Teams start on different events and swap every rotation
    // - Multi-team (tri/quad): Different teams on different events each rotation
    function getTeamEventForRotation(teamOrder, rotation, numTeams, competitionFormat, gender = 'mens') {
      // teamOrder is 0-indexed (0 = home/team1, 1 = away/team2, etc.), rotation is 1-indexed
      const scheduleKey = getScheduleKey(numTeams, competitionFormat, gender);
      const schedule = ROTATION_SCHEDULES[scheduleKey];

      if (!schedule || !schedule.schedule[rotation]) {
        // Fallback to legacy behavior for men's events
        if (competitionFormat === 'head-to-head') {
          return MENS_EVENTS_ORDER[(rotation - 1) % 6];
        }
        // Alternating fallback
        const pairIndex = Math.floor((rotation - 1) / 2);
        const isSecondInPair = (rotation - 1) % 2 === 1;
        const baseEvent = pairIndex * 2;
        const eventIndex = teamOrder === 0
          ? (isSecondInPair ? baseEvent + 1 : baseEvent)
          : (isSecondInPair ? baseEvent : baseEvent + 1);
        return MENS_EVENTS_ORDER[eventIndex];
      }

      // Look up which event this team is on from the schedule
      const rotationSchedule = schedule.schedule[rotation];

      for (const [eventName, teamValue] of Object.entries(rotationSchedule)) {
        if (teamValue !== null) {
          if (Array.isArray(teamValue)) {
            // Head-to-head: array of team orders
            if (teamValue.includes(teamOrder)) {
              return eventName;
            }
          } else if (teamValue === teamOrder) {
            // Single team on this event
            return eventName;
          }
        }
      }

      // Team has a bye this rotation (no event)
      return null;
    }

    // For 5+ team meets, detect event from API data instead of hardcoded schedule
    // Uses the Virtius API 'rotation' field on each event to determine the correct mapping
    function detectEventFromApiData(team, rotation, gender) {
      // Virtius API includes a 'rotation' field on each event indicating which rotation it was scored in
      // This is the most reliable way to determine team-event assignments
      const rot = parseInt(rotation, 10);
      const eventForRotation = (team.events || []).find(e => parseInt(e.rotation, 10) === rot);
      if (eventForRotation) {
        return eventForRotation.event_name;
      }

      // Fallback: If no event has the requested rotation, the team may have a bye
      // or the rotation hasn't happened yet - return null to indicate no data
      return null;
    }

    // Calculate meet-wide apparatus rankings (top 3 scores per apparatus across all teams)
    // Returns: { 'VAULT': [ { name: 'K. Tatum', score: 9.525, team: 'West Chester' }, ... ], ... }
    function calculateApparatusRankings(teams) {
      const rankings = {};

      // Collect all scores for each apparatus across all teams
      teams.forEach(team => {
        if (!team.events) return;

        team.events.forEach(event => {
          const eventName = event.event_name;
          if (!rankings[eventName]) {
            rankings[eventName] = [];
          }

          if (event.gymnasts) {
            event.gymnasts.forEach(g => {
              const score = parseFloat(g.final_score) || 0;
              if (score > 0) {
                const name = `${g.first_name?.charAt(0) || ''}. ${g.last_name || ''}`;
                const fullName = `${g.first_name || ''} ${g.last_name || ''}`.trim();
                rankings[eventName].push({
                  name,
                  fullName,
                  score,
                  team: team.name || team.tricode,
                  gymnastId: g.gymnast_id
                });
              }
            });
          }
        });
      });

      // Sort each apparatus by score (descending) and keep top 3
      for (const eventName of Object.keys(rankings)) {
        rankings[eventName] = rankings[eventName]
          .sort((a, b) => b.score - a.score)
          .slice(0, 3)
          .map((entry, idx) => ({ ...entry, rank: idx + 1 }));
      }

      return rankings;
    }

    // Render dual meet layout (2 teams side-by-side with center divider)
    function renderDualMeetSummary(contentEl, rotationData, rotation) {
      const team1 = rotationData[0];
      const team2 = rotationData[1];

      // Calculate score differences for each lineup position
      const maxAthletes = Math.max(team1.gymnasts.length, team2.gymnasts.length);

      // Build left team column
      const leftColumn = buildTeamColumn(team1, 'left', maxAthletes);
      const rightColumn = buildTeamColumn(team2, 'right', maxAthletes);

      // Build center divider with visual diff bars
      let centerHtml = `<div class="center-divider"><div class="center-header"><div class="rotation-badge">R${rotation}</div></div>`;
      for (let i = 0; i < maxAthletes; i++) {
        const score1 = team1.gymnasts[i] ? parseFloat(team1.gymnasts[i].final_score) || 0 : 0;
        const score2 = team2.gymnasts[i] ? parseFloat(team2.gymnasts[i].final_score) || 0 : 0;
        const diff = score1 - score2;
        const diffStr = (score1 === 0 && score2 === 0) ? '--' : diff.toFixed(3);

        // Calculate bar width (max diff around 2.0 points maps to 50% width)
        const barWidth = Math.min(Math.abs(diff) * 25, 50);
        let barClass = 'tie';
        if (diff > 0.001) barClass = 'left';
        else if (diff < -0.001) barClass = 'right';

        centerHtml += `
          <div class="diff-row">
            <div class="diff-value">${diffStr}</div>
            <div class="diff-bar">
              <div class="diff-bar-fill ${barClass}" style="width: ${barWidth}%;"></div>
            </div>
          </div>
        `;
      }
      centerHtml += '</div>';

      // Calculate event total difference
      const eventDiff = team1.eventScore - team2.eventScore;
      const eventDiffStr = eventDiff.toFixed(3);
      const eventBarWidth = Math.min(Math.abs(eventDiff) * 5, 50);
      let eventBarClass = 'tie';
      if (eventDiff > 0.001) eventBarClass = 'left';
      else if (eventDiff < -0.001) eventBarClass = 'right';

      // Build footer with event totals and icons
      const footerHtml = `
        <div class="event-summary-footer">
          <div class="footer-team left">
            <div class="event-abbr">${team1.eventShortCode}</div>
            ${EVENT_ICONS[team1.eventShortCode] || ''}
            <div class="event-label">Event Total</div>
            <div class="event-total">${team1.eventScore > 0 ? team1.eventScore.toFixed(3) : '—'}</div>
          </div>
          <div class="footer-center">
            <div class="footer-diff">${eventDiffStr}</div>
            <div class="footer-diff-bar">
              <div class="footer-diff-fill ${eventBarClass}" style="width: ${eventBarWidth}%;"></div>
            </div>
          </div>
          <div class="footer-team right">
            <div class="event-abbr">${team2.eventShortCode}</div>
            ${EVENT_ICONS[team2.eventShortCode] || ''}
            <div class="event-label">Event Total</div>
            <div class="event-total">${team2.eventScore > 0 ? team2.eventScore.toFixed(3) : '—'}</div>
          </div>
        </div>
      `;

      contentEl.innerHTML = `
        <div class="event-summary-dual">
          ${leftColumn}
          ${centerHtml}
          ${rightColumn}
        </div>
        ${footerHtml}
      `;
    }

    // Build a team column for dual meet layout
    function buildTeamColumn(teamData, side, maxAthletes) {
      const { team, gymnasts, totalScore, eventShortCode } = teamData;

      let athletesHtml = '';
      for (let i = 0; i < maxAthletes; i++) {
        const g = gymnasts[i];
        if (g) {
          const score = parseFloat(g.final_score) || 0;
          // Get start value from scores array
          const startValue = g.scores && g.scores.length > 0 ? parseFloat(g.scores[0].start) || 0 : 0;
          const name = `${g.first_name?.charAt(0) || ''}. ${g.last_name || ''}`;
          // Look up headshot from library first, fall back to API headshot
          const photoUrl = getAthleteHeadshot(g.first_name, g.last_name, g.headshot);

          athletesHtml += `
            <div class="athlete-row">
              <div class="athlete-order">${i + 1}</div>
              ${renderAthletePhoto(photoUrl)}
              <div class="athlete-name">${name}</div>
              <div class="athlete-score-block">

            </div>
          `;
        } else {
          athletesHtml += `<div class="athlete-row"></div>`;

      return `
        <div class="team-column ${side}">
          <div class="team-header ${side}">
            ${logoUrl ? `<img class="team-logo" src="${logoUrl}" alt="">` : ''}

    // Generic render function that works for all V5-V19 layouts
    // Each layout uses different CSS class and may have unique HTML structure
    function renderGenericLayout(contentEl, data, numTeams, layoutVersion, isApparatus = false, eventDisplayName = '') {
      const maxAthletes = Math.min(Math.max(...data.map(t => t.gymnasts.length)), 10);

      let columnsHtml = '';
      data.forEach((teamData, teamIndex) => {
        const { team, gymnasts, eventScore, totalScore } = teamData;

        const logoUrl = getTeamLogoUrl(team.name, team.logo);

        for (let i = 0; i < maxAthletes; i++) {
          const g = gymnasts[i];
          const score = g ? parseFloat(g.final_score) || 0 : 0;
          const name = g ? `${g.first_name?.charAt(0) || ''}. ${g.last_name || ''}` : '—';
          const emptyClass = g ? '' : ' empty';
          const scoreDisplay = score > 0 ? score.toFixed(3) : '—';

          // Different HTML structures based on layout version
          switch(layoutVersion) {
            case 'v7': // Progress bar layout
              const barWidth = score > 0 ? ((score / 10) * 100) : 0;
              athletesHtml += `
                <div class="athlete-row${emptyClass}">
                  <div class="athlete-info">
                    <div class="athlete-name">${name}</div>

                  </div>
                  <div class="score-bar"><div class="score-bar-fill" style="width: ${barWidth}%;"></div></div>

              break;
            case 'v10': // Score focus (centered, score above name)
              athletesHtml += `
                <div class="athlete-row${emptyClass}">
                  <div class="athlete-score">${scoreDisplay}</div>
                  <div class="athlete-name">${name}</div>
                </div>
              `;
              break;
            case 'v11': // Two-line with info div
              athletesHtml += `
                <div class="athlete-row${emptyClass}">
                  <div class="athlete-order">${i + 1}</div>
                  <div class="athlete-info">
                    <div class="athlete-name">${name}</div>
                  </div>
                  <div class="athlete-score">${scoreDisplay}</div>
                </div>

              break;
            case 'v17': // Inline scores (name + score together, then spacer)
              athletesHtml += `
                <div class="athlete-row${emptyClass}">

        .map((t, idx) => ({ idx, score: t.totalScore || 0 }))

      function getAthleteApparatusRank(eventName, gymnastId, score) {
        const rankings = apparatusRankings[eventName] || [];

      // Wait for headshots to be loaded before rendering

      try {

        const data = await response.json();

        const teams = data.meet?.teams || [];
        if (teams.length === 0) {
          contentEl.innerHTML = '<div class="event-summary-error">No teams found</div>';
          return;

        // Sort teams by team_order

        const eventShortCode = EVENT_SHORT_CODES[eventName] || apparatus.toUpperCase();

        // Determine if this is a dual meet (2 teams) or multi-team (3+)
        const isDual = sortedTeams.length === 2;

    // Render dual meet apparatus layout (2 teams side-by-side, same event)
    function renderDualMeetSummaryApparatus(contentEl, apparatusData, eventDisplayName, eventShortCode) {
      const team1 = apparatusData[0];
      const team2 = apparatusData[1];

      // Calculate score differences for each lineup position
      const maxAthletes = Math.max(team1.gymnasts.length, team2.gymnasts.length);

      // Build left team column
      const leftColumn = buildTeamColumn(team1, 'left', maxAthletes);
      const rightColumn = buildTeamColumn(team2, 'right', maxAthletes);

      // Build center divider with event name and visual diff bars
      let centerHtml = `<div class="center-divider"><div class="center-header"><div class="rotation-badge">${eventShortCode}</div></div>`;
      for (let i = 0; i < maxAthletes; i++) {
        const score1 = team1.gymnasts[i] ? parseFloat(team1.gymnasts[i].final_score) || 0 : 0;
        const score2 = team2.gymnasts[i] ? parseFloat(team2.gymnasts[i].final_score) || 0 : 0;
        const diff = score1 - score2;
        const diffStr = (score1 === 0 && score2 === 0) ? '--' : diff.toFixed(3);

        // Calculate bar width (max diff around 2.0 points maps to 50% width)
        const barWidth = Math.min(Math.abs(diff) * 25, 50);
        let barClass = 'tie';
        if (diff > 0.001) barClass = 'left';
        else if (diff < -0.001) barClass = 'right';

        centerHtml += `
          <div class="diff-row">
            <div class="diff-value">${diffStr}</div>
            <div class="diff-bar">
              <div class="diff-bar-fill ${barClass}" style="width: ${barWidth}%;"></div>
            </div>
          </div>
        `;
      }
      centerHtml += '</div>';

      // Calculate event total difference
      const eventDiff = team1.eventScore - team2.eventScore;
      const eventDiffStr = eventDiff.toFixed(3);
      const eventBarWidth = Math.min(Math.abs(eventDiff) * 5, 50);
      let eventBarClass = 'tie';
      if (eventDiff > 0.001) eventBarClass = 'left';
      else if (eventDiff < -0.001) eventBarClass = 'right';

      // Build footer with event totals and icons (same event for both teams)
      const footerHtml = `
        <div class="event-summary-footer">
          <div class="footer-team left">
            <div class="event-abbr">${eventShortCode}</div>
            ${EVENT_ICONS[eventShortCode] || ''}
            <div class="event-label">Event Total</div>
            <div class="event-total">${team1.eventScore > 0 ? team1.eventScore.toFixed(3) : '—'}</div>
          </div>
          <div class="footer-center">
            <div class="footer-diff">${eventDiffStr}</div>
            <div class="footer-diff-bar">
              <div class="footer-diff-fill ${eventBarClass}" style="width: ${eventBarWidth}%;"></div>
            </div>
          </div>
          <div class="footer-team right">
            <div class="event-abbr">${eventShortCode}</div>
            ${EVENT_ICONS[eventShortCode] || ''}
            <div class="event-label">Event Total</div>
            <div class="event-total">${team2.eventScore > 0 ? team2.eventScore.toFixed(3) : '—'}</div>
          </div>
        </div>
      `;

      contentEl.innerHTML = `
        <div class="event-summary-dual">
          ${leftColumn}
          ${centerHtml}
          ${rightColumn}
        </div>
        ${footerHtml}
      `;
    }

    // Dual Dynamic V1 Layout - Scales to fit 1-9 athletes
    // Calculate dynamic sizes based on athlete count
    function getDynamicSizes(athleteCount) {
      // Base sizes for 6 athletes (matches Default V2)
      const base = {
        photoSize: 88,
        orderSize: 52,
        orderFont: 24,
        nameFont: 36,
        scoreFont: 44,
        startFont: 24,
        rowPadding: 12,
        rowGap: 16
      };

      // Scale factor: 6 athletes = 1.0, 9 athletes = 0.65
      const scale = athleteCount <= 6 ? 1.0 : Math.max(0.65, 1.0 - (athleteCount - 6) * 0.12);

      return {
        photoSize: Math.round(base.photoSize * scale),
        orderSize: Math.round(base.orderSize * scale),
        orderFont: Math.round(base.orderFont * scale),
        nameFont: Math.round(base.nameFont * scale),
        scoreFont: Math.round(base.scoreFont * scale),
        startFont: Math.round(base.startFont * scale),
        rowPadding: Math.round(base.rowPadding * scale),
        rowGap: Math.round(base.rowGap * scale)
      };
    }

    /**
     * Get apparatus display name from code
     * Maps apparatus codes (UB, BB, FX, etc.) to display names
     * @param {string} code - Apparatus code
     * @returns {string} Display name
     */
    function getApparatusDisplayName(code) {
      if (!code) return '';

      // Map short codes to API codes for lookup
      const shortToApi = {
        'FX': 'FLOOR',
        'PH': 'HORSE',
        'SR': 'RINGS',
        'VT': 'VAULT',
        'PB': 'PBARS',
        'HB': 'BAR',
        'UB': 'BARS',
        'BB': 'BEAM'
      };

      // Try direct lookup first (for API codes like FLOOR, BARS)
      if (EVENT_DISPLAY_NAMES[code.toUpperCase()]) {
        return EVENT_DISPLAY_NAMES[code.toUpperCase()];
      }

      // Try converting short code to API code
      const apiCode = shortToApi[code.toUpperCase()];
      if (apiCode && EVENT_DISPLAY_NAMES[apiCode]) {
        return EVENT_DISPLAY_NAMES[apiCode];
      }

      // Fallback to the original code
      return code;
    }

    /**
     * Format score for display
     * @param {number|null} score - The score value
     * @returns {string} Formatted score string
     */
    function formatClipScore(score) {
      if (score === null || score === undefined) {
        return '';
      }
      // Score of 0 is a real score (scratch/fall) - display as "0.000"
      return score.toFixed(3);
    }

    /**
     * Calculate score reveal time based on video duration
     * Formula: Math.max(duration - 5, duration * 0.6)
     * Short clips (< 3s): Show score immediately
     * @param {number} duration - Video duration in seconds
     * @returns {number} Time in seconds when score should appear
     */
    function calculateScoreRevealTime(duration) {
      if (duration < 3) {
        return 0; // Show score immediately for very short clips
      }
      return Math.max(duration - 5, duration * 0.6);
    }

     * @param {Object} data - Clip data containing athleteName, teamName, teamLogo, apparatus
     */
    function updateClipOverlay(data) {
      const { athleteName, teamName, teamLogo, apparatus, subtitle } = data;

      // Update athlete info
      clipAthleteNameEl.textContent = athleteName || '';
      clipApparatusEl.textContent = apparatus ? getApparatusDisplayName(apparatus) : (subtitle || '');
      clipTeamNameEl.textContent = teamName || '';

      // Update team logo
      if (teamLogo) {
        clipTeamLogoEl.src = teamLogo;
        clipTeamLogoEl.style.display = 'block';
      } else {
        clipTeamLogoEl.style.display = 'none';
      }

      // Reset score badge (will be shown by timeupdate handler)
      clipScoreBadgeEl.classList.remove('visible');
      clipScoreBadgeEl.textContent = '';

      // Hide replay badge (only shown for moment-replay)
      clipReplayBadgeEl.style.display = 'none';

      // Show the overlay
      clipOverlay.classList.add('visible');
    }

    /**
     * Handle video timeupdate event for score reveal
     * Shows the score badge when video reaches the reveal time
     */
    function handleClipTimeUpdate() {
      if (scoreRevealed || scoreRevealTime === null || currentClipScore === null) {
        return;
      }

      if (activeVideoElement.currentTime >= scoreRevealTime) {
        // Reveal the score
        scoreRevealed = true;
        clipScoreBadgeEl.textContent = formatClipScore(currentClipScore);
        clipScoreBadgeEl.classList.add('visible');
        console.log(`[clip] Score revealed: ${currentClipScore} at ${activeVideoElement.currentTime.toFixed(1)}s`);
      }
    }

    /**
     * Handle video loadedmetadata event to set up score reveal timing
     * Uses actual video duration, not API duration
     */
    function handleClipMetadataLoaded() {
      const actualDuration = activeVideoElement.duration;

      if (isNaN(actualDuration) || actualDuration <= 0) {
        console.error('[clip] Invalid video duration:', actualDuration);
        // Will be handled by error handling in Task 7
        return;
      }

      // Calculate when to show the score
      if (currentClipScore !== null) {
        scoreRevealTime = calculateScoreRevealTime(actualDuration);
        console.log(`[clip] Score reveal time set: ${scoreRevealTime.toFixed(1)}s (duration: ${actualDuration.toFixed(1)}s)`);

        // For very short clips, show score immediately
        if (scoreRevealTime === 0) {
          scoreRevealed = true;
          clipScoreBadgeEl.textContent = formatClipScore(currentClipScore);
          clipScoreBadgeEl.classList.add('visible');
        }
      }
    }

    /**
     * Handle clip playback for clip-playback and moment-replay graphics
     * @param {string} graphic - The graphic type ('clip-playback' or 'moment-replay')
     * @param {Object} data - The graphic data from Firebase
     */
    function handleClipPlayback(graphic, data) {
      console.log(`[clip-mode] handleClipPlayback called: ${graphic}`, data);

      const { draftId, clipUrl: rawClipUrl, score, nextClipUrl: rawNextClipUrl, nextClipDraftId, nextClipData } = data;

      // Route R2 URLs through coordinator proxy to avoid auth/CORS issues
      const clipUrl = proxyClipUrl(rawClipUrl);
      const nextClipUrl = proxyClipUrl(rawNextClipUrl);

      // Diagnostic logging: URL type and proxy status
      if (rawClipUrl) {
        const isPresigned = rawClipUrl.includes('X-Amz-Signature');
        console.log(`[clip] URL type: ${isPresigned ? 'presigned' : 'unsigned'}`);
        console.log(`[clip] Using proxy: ${clipUrl !== rawClipUrl ? 'yes' : 'no (passthrough)'}`);
        if (clipUrl !== rawClipUrl) {
          console.log(`[clip] Proxy URL: ${clipUrl.substring(0, 80)}...`);
        }
      }

      // Validate required fields
      if (!clipUrl) {
        console.error('[clip] No clipUrl provided');
        return;
      }

      // Check if this is a new clip or same clip (e.g., nextClipUrl update)
      const isSameClip = currentClipDraftId === draftId;

      if (isSameClip && graphic === 'clip-playback') {
        // Same clip, might be a nextClipUrl update - just update preload
        if (nextClipUrl && nextClipUrl !== preloadedClipUrl) {
          preloadClip(nextClipUrl, nextClipDraftId, nextClipData);
        }
        // Clear optimistic advance flag since coordinator confirmed the clip
        if (optimisticAdvanceActive) {
          console.log('[clip] Coordinator confirmed optimistic advance');
          optimisticAdvanceActive = false;
        }
        return;
      }

      // Check if we optimistically advanced to the wrong clip (coordinator correction)
      if (optimisticAdvanceActive && currentClipDraftId !== draftId) {
        console.log(`[clip] Coordinator correction: expected ${currentClipDraftId}, got ${draftId}`);
        handleCoordinatorCorrection(graphic, data);
        return;
      }

      // Clear optimistic flag - either we didn't optimistically advance, or coordinator confirmed
      optimisticAdvanceActive = false;

      // New clip - handle based on graphic type
      if (graphic === 'clip-playback') {
        // Reset state for new clip
        currentClipDraftId = draftId;
        scoreRevealed = false;
        scoreRevealTime = null;
        currentClipScore = (score !== undefined) ? score : null;

        // Update overlay with athlete info (suppress for WTW clips - they use their own lower-third)
        if (data.overlayStyle === 'who-to-watch') {
          clipOverlay.classList.remove('visible');
        } else {
          updateClipOverlay(data);
        }

        // Remove old event listeners
        activeVideoElement.removeEventListener('timeupdate', handleClipTimeUpdate);
        activeVideoElement.removeEventListener('loadedmetadata', handleClipMetadataLoaded);

        // Set up status listeners for ended/stalled/error detection (Task 7)
        setupClipStatusListeners(activeVideoElement);

        // Start initial load timeout (10s)
        startLoadTimeout(activeVideoElement, draftId);

        // Start clip playback
        startClip(clipUrl, { muted: false })
          .then(() => {
            console.log(`[clip] Clip started: ${draftId}`);

            // Add event listeners for score reveal
            activeVideoElement.addEventListener('timeupdate', handleClipTimeUpdate);
            activeVideoElement.addEventListener('loadedmetadata', handleClipMetadataLoaded);

            // If metadata already loaded, handle it now
            if (activeVideoElement.readyState >= 1) {
              handleClipMetadataLoaded();
            }
          })
          .catch(err => {
            console.error('[clip] Failed to start clip:', err);
            // Write error status to Firebase
            writeClipStatus(draftId, 'error', { errorMessage: err.message || 'Failed to start clip' });
          });

        // Preload next clip if available
        if (nextClipUrl) {
          preloadClip(nextClipUrl, nextClipDraftId, nextClipData);
        } else {
          // No next clip - clear preload state
          abortPreload();
        }

      } else if (graphic === 'moment-replay') {
        // Moment replay - seek to specific range, play at specified rate, muted by default
        const { seekStart = 0, seekEnd, playbackRate = 1, muted = true } = data;

        // Validate seek range
        if (seekEnd !== undefined && seekEnd <= seekStart) {
          console.error(`[clip] Invalid seek range: seekStart=${seekStart}, seekEnd=${seekEnd}`);
          return;
        }

        // Reset state for new replay
        currentClipDraftId = draftId;
        currentClipScore = null; // No score for replays
        scoreRevealTime = null;
        scoreRevealed = true; // Prevent score reveal logic from running

        // Update overlay with athlete info (suppress for WTW clips - they use their own lower-third)
        if (data.overlayStyle === 'who-to-watch') {
          clipOverlay.classList.remove('visible');
        } else {
          updateClipOverlay(data);
        }

        // Show replay badge (only for non-WTW clips)
        if (data.overlayStyle !== 'who-to-watch') {
          clipReplayBadgeEl.style.display = 'block';
        }

        // Track replay seek end for timeupdate handler
        let replaySeekEnd = seekEnd;

        // Handler to stop at seekEnd
        const handleReplayTimeUpdate = () => {
          if (replaySeekEnd !== undefined && activeVideoElement.currentTime >= replaySeekEnd) {
            console.log(`[clip] Moment replay reached seekEnd: ${replaySeekEnd}s`);
            activeVideoElement.removeEventListener('timeupdate', handleReplayTimeUpdate);
            activeVideoElement.removeEventListener('ended', handleReplayEnded);
            // Pause the video at the end point
            activeVideoElement.pause();
            // Handle replay ended (same as ended event)
            onReplayEnded();
          }
        };

        // Handler for video ended event (in case seekEnd not set or video ends naturally)
        const handleReplayEnded = () => {
          console.log(`[clip] Moment replay video ended`);
          activeVideoElement.removeEventListener('timeupdate', handleReplayTimeUpdate);
          activeVideoElement.removeEventListener('ended', handleReplayEnded);
          onReplayEnded();
        };

        // Common replay ended logic
        const onReplayEnded = () => {
          // Clear any stall/load timeouts
          clearClipTimeouts();

          // Check if heartbeat is stale - don't auto-advance if coordinator is down
          if (heartbeatStale) {
            console.log('[clip-status] Heartbeat stale - not auto-advancing after replay');
            if (currentClipDraftId) {
              writeClipStatus(currentClipDraftId, 'ended', {});
            }
            // Hide video elements and wait for coordinator
            hideAllVideos();
            return;
          }

          // Check if we have a preloaded clip ready for optimistic advance
          const canOptimisticAdvance = preloadedClipUrl &&
                                        preloadedClipDraftId &&
                                        preloadVideoElement.readyState >= 2;

          // Write ended status to Firebase
          if (currentClipDraftId) {
            const extraData = {};
            if (canOptimisticAdvance) {
              extraData.optimisticNextDraftId = preloadedClipDraftId;
            }
            writeClipStatus(currentClipDraftId, 'ended', extraData);
          }

          // If preloaded next clip is available, optimistically advance
          if (canOptimisticAdvance) {
            console.log('[clip] Moment replay ended, advancing to preloaded clip');
            performOptimisticAdvance();
          } else if (preloadedClipUrl) {
            console.log('[clip] Preloaded clip not ready yet, waiting for coordinator');
          }
        };

        // Remove old event listeners
        activeVideoElement.removeEventListener('timeupdate', handleClipTimeUpdate);
        activeVideoElement.removeEventListener('loadedmetadata', handleClipMetadataLoaded);

        // Set up stall detection listeners (for mid-playback buffering)
        setupClipStatusListeners(activeVideoElement);

        // Start initial load timeout (10s)
        startLoadTimeout(activeVideoElement, draftId);

        // Start replay playback with seek and rate
        startClip(clipUrl, {
          muted: muted,
          currentTime: seekStart,
          playbackRate: playbackRate
        })
          .then(() => {
            console.log(`[clip] Moment replay started: ${draftId} (seek: ${seekStart}-${seekEnd || 'end'}, rate: ${playbackRate}x, muted: ${muted})`);

            // Note: For moment replays, we use the custom handlers for seekEnd detection
            // but still rely on setupClipStatusListeners for stall detection
            // Add event listeners for seekEnd detection
            activeVideoElement.addEventListener('timeupdate', handleReplayTimeUpdate);
            activeVideoElement.addEventListener('ended', handleReplayEnded);

            // Update replaySeekEnd if we get more precise duration from metadata
            activeVideoElement.addEventListener('loadedmetadata', () => {
              const actualDuration = activeVideoElement.duration;
              // If no seekEnd specified, use video duration
              if (replaySeekEnd === undefined) {
                replaySeekEnd = actualDuration;
              }
              // If seekEnd exceeds duration, cap it
              if (replaySeekEnd > actualDuration) {
                console.warn(`[clip] seekEnd (${seekEnd}) exceeds duration (${actualDuration}), capping`);
                replaySeekEnd = actualDuration;
              }
            }, { once: true });
          })
          .catch(err => {
            console.error('[clip] Failed to start moment replay:', err);
            // Write error status to Firebase
            writeClipStatus(draftId, 'error', { errorMessage: err.message || 'Failed to start moment replay' });
          });

        // Preload next clip if available
        if (nextClipUrl) {
          preloadClip(nextClipUrl, nextClipDraftId, nextClipData);
        } else {
          // No next clip - clear preload state
          abortPreload();
        }
      }
    }

    /**
     * Stop and hide all clip playback elements
     * Called when switching away from clip-type graphics
     */
    function stopClipPlayback() {
      console.log(`[clip-mode] stopClipPlayback called`);

      // Remove event listeners
      activeVideoElement.removeEventListener('timeupdate', handleClipTimeUpdate);
      activeVideoElement.removeEventListener('loadedmetadata', handleClipMetadataLoaded);

      // Remove status listeners and clear timeouts (Task 7)
      removeClipStatusListeners(activeVideoElement);
      removeClipStatusListeners(preloadVideoElement);

      // Abort any pending preload and clear preload state
      abortPreload();

      // Clear optimistic advance state
      optimisticAdvanceActive = false;
      currentClipDraftId = null;

      // Hide all video elements
      hideAllVideos();

      // Hide iframe fallback
      if (usingIframeFallback) {
        clipIframeFallback.src = '';
        clipIframeFallback.classList.remove('clip-active');
        clipIframeFallback.classList.add('clip-preload');
        usingIframeFallback = false;
      }

      // Hide overlay
      clipOverlay.classList.remove('visible');

      // Reset score state
      scoreRevealed = false;
      scoreRevealTime = null;
      currentClipScore = null;
      clipScoreBadgeEl.classList.remove('visible');
      clipScoreBadgeEl.textContent = '';

      // Hide replay badge
      clipReplayBadgeEl.style.display = 'none';
    }
    // Note: Keyboard shortcuts (like 'b' for bold mode) work in OBS via Interact mode,
    // but not in regular browsers due to cross-origin iframe restrictions.
  </script>
  <script>
    // Viewport scaling: fit 1920x1080 graphic into any browser window
    // In OBS (1920x1080 viewport), scale = 1.0 (no change)
    function updateViewportScale() {
      const sx = window.innerWidth / 1920;
      const sy = window.innerHeight / 1080;
      const s = Math.min(sx, sy);
      document.body.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', updateViewportScale);
    updateViewportScale();
  </script>
</body>
</html>
