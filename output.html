<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Graphics Output</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="/overlays/theme-overrides.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      transform-origin: top left;
    }
    #output {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Animations */
    .graphic-container {
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Team Logos - Row Layout (2-4 teams) */
    .graphic-logos {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: var(--logos-logos-gap, 100px);
      background: transparent;
    }
    .graphic-logos .team-logo {
      width: var(--logos-logos-size, 250px);
      height: var(--logos-logos-size, 250px);
      object-fit: contain;
      background: var(--logos-logos-bg, #f4f4f5);
      border-radius: var(--logos-logos-border-radius, 24px);
      padding: var(--logos-logos-padding, 25px);
    }
    /* Team Logos - Grid Layout (5-6 teams) */
    .graphic-logos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: var(--logos-logos-grid-gap, 60px);
      padding: var(--logos-logos-grid-padding, 100px);
      place-items: center;
    }
    .graphic-logos-grid .team-logo {
      width: var(--logos-logos-grid-size, 200px);
      height: var(--logos-logos-grid-size, 200px);
      padding: var(--logos-logos-padding, 20px);
    }

    /* Event Info Bar */
    .graphic-event-bar {
      position: absolute;
      bottom: var(--event-bar-bar-bottom, 120px);
      left: var(--event-bar-bar-left, 100px);
      display: flex;
      flex-direction: row;
      animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-100px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .event-bar-logo {
      width: var(--event-bar-logo-container-width, 100px);
      height: var(--event-bar-logo-container-height, auto);
      background: var(--event-bar-logo-bg, #BFBFBF);
      display: var(--event-bar-show-logo, flex);
      align-items: center;
      justify-content: center;
      padding: var(--event-bar-logo-padding, 15px);
      border-radius: var(--event-bar-logo-radius, 0px);
    }
    .event-bar-logo img {
      width: var(--event-bar-logo-img-size, 70px);
      height: var(--event-bar-logo-img-size, 70px);
      object-fit: contain;
    }
    .event-bar-content {
      display: flex;
      flex-direction: column;
    }
    .event-bar-venue {
      background: #BFBFBF;
      padding: var(--event-bar-venue-padding-v, 10px) var(--event-bar-venue-padding-h, 40px);
      min-width: var(--event-bar-bar-min-width, 600px);
      height: var(--event-bar-venue-height, auto);
      font-size: var(--event-bar-venue-font-size, 36px);
      font-weight: 900;
      color: #000;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
    }
    .event-bar-details {
      background: #000;
      padding: var(--event-bar-details-padding-v, 10px) var(--event-bar-details-padding-h, 40px);
      height: var(--event-bar-details-height, auto);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .event-bar-name {
      font-size: var(--event-bar-name-font-size, 28px);
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }
    .event-bar-location {
      font-size: var(--event-bar-location-font-size, 24px);
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    /* Hosts Card */
    .graphic-hosts {
      position: absolute;
      bottom: 120px;
      left: 100px;
    }
    .hosts-header {
      background: #d4d4d8;
      padding: 16px 36px;
      min-width: 400px;
    }
    .hosts-title {
      font-size: 36px;
      font-weight: 800;
      color: #000;
    }
    .hosts-content {
      background: #000;
      padding: 20px 36px;
      min-width: 400px;
    }
    .hosts-name {
      font-size: 26px;
      font-weight: 600;
      color: #fff;
      line-height: 1.5;
    }

    /* Team Stats Card - top-anchored so header aligns with coaches card */
    .graphic-team-stats {
      position: absolute;
      top: 780px;
      left: 100px;
    }
    .stats-header {
      background: #d4d4d8;
      padding: 14px 30px;
      display: flex;
      align-items: center;
      gap: 20px;
      min-width: 480px;
    }
    .stats-team-name {
      font-size: 36px;
      font-weight: 800;
      color: #000;
      flex: 1;
      text-transform: uppercase;
    }
    .stats-logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }
    .stats-content {
      background: #000;
      padding: 16px 30px;
      display: flex;
      gap: 60px;
    }
    .stat-item { color: #fff; }
    .stat-label {
      font-size: 20px;
      font-weight: 500;
      opacity: 0.7;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* Coaches Card - top-anchored so header aligns with stats card */
    .graphic-coaches {
      position: absolute;
      top: 780px;
      left: 100px;
    }
    .coaches-header {
      background: #d4d4d8;
      padding: 14px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 480px;
    }
    .coaches-title {
      font-size: 36px;
      font-weight: 800;
      color: #000;
    }
    .coaches-logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }
    .coaches-content {
      background: #000;
      padding: 16px 30px;
      min-width: 480px;
    }
    .coach-name {
      font-size: 24px;
      font-weight: 500;
      color: #fff;
      line-height: 1.6;
    }

    /* Event Frame */
    .graphic-event-frame {
      position: absolute;
      top: 50px;
      left: 70px;
      right: 70px;
      bottom: 50px;
      display: flex;
      flex-direction: column;
    }
    .frame-header {
      background: #d4d4d8;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .frame-title {
      font-size: 42px;
      font-weight: 800;
      color: #000;
    }
    .frame-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }
    .frame-content {
      flex: 1;
      background: #000;
    }

    /* Virtius Leaderboard - uses event frame layout */
    .graphic-virtius-leaderboard {
      position: absolute;
      top: 50px;
      left: 70px;
      right: 70px;
      bottom: 50px;
      display: flex;
      flex-direction: column;
      font-variant-numeric: tabular-nums;
    }
    .graphic-virtius-leaderboard .frame-header {
      background: #d4d4d8;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .graphic-virtius-leaderboard .frame-title {
      font-size: 42px;
      font-weight: 800;
      color: #000;
    }
    .graphic-virtius-leaderboard .frame-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }
    .graphic-virtius-leaderboard .frame-content {
      flex: 1;
      background: #000;
      position: relative;
      overflow: hidden;
    }
    .graphic-virtius-leaderboard iframe {
      position: absolute;
      border: none;
      /* Crop and scale the iframe - larger scale = bigger text */
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      transform: scale(1.05);
      top: -155px;
      left: 0px;
    }

    /* Event Summary Styles - Rotation-based layout */
    .graphic-event-summary {
      position: absolute;
      top: 50px;
      left: 70px;
      right: 70px;
      bottom: 50px;
      display: flex;
      flex-direction: column;
      font-variant-numeric: tabular-nums;
    }
    .event-summary-header {
      background: #d4d4d8;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .event-summary-title {
      font-size: 42px;
      font-weight: 800;
      color: #000;
      font-style: italic;
    }
    .event-summary-header-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }
    .event-summary-content {
      flex: 1;
      background: #27272a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    /* Dual Meet Layout - 2 teams with center divider */
    .event-summary-dual {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    .event-summary-dual .team-column {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .event-summary-dual .team-header {
      display: flex;
      align-items: center;
      padding: 16px 24px;
      background: #27272a;
      gap: 16px;
    }
    .event-summary-dual .team-header.left {
      justify-content: flex-start;
    }
    .event-summary-dual .team-header.right {
      justify-content: flex-end;
      flex-direction: row-reverse;
    }
    .event-summary-dual .team-logo {
      width: 56px;
      height: 56px;
      object-fit: contain;
    }
    .event-summary-dual .team-name {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
    }
    .event-summary-dual .team-total {
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      margin-left: auto;
      font-variant-numeric: tabular-nums;
    }
    .event-summary-dual .team-header.right .team-total {
      margin-left: 0;
      margin-right: auto;
    }
    .event-summary-dual .athlete-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .event-summary-dual .athlete-row {
      display: flex;
      align-items: center;
      padding: 8px 20px;
      flex: 1;
    }
    .event-summary-dual .athlete-row:nth-child(odd) {
      background: #18181b;
    }
    .event-summary-dual .athlete-row:nth-child(even) {
      background: #27272a;
    }
    .event-summary-dual .athlete-order {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #52525b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .event-summary-dual .athlete-photo {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top;
      background: #3f3f46;
      flex-shrink: 0;
    }
    .event-summary-dual .athlete-name {
      flex: 1;
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
    }
    .event-summary-dual .athlete-score-block {
      display: flex;
      flex-direction: row;
      align-items: baseline;
      gap: 8px;
    }
    .event-summary-dual .athlete-score {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      min-width: 88px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .event-summary-dual .athlete-start {
      font-size: 14px;
      color: #a1a1aa;
      min-width: 42px;
      text-align: right;
    }
    /* Left side layout */
    .event-summary-dual .team-column.left .athlete-row {
      gap: 12px;
    }
    .event-summary-dual .team-column.left .athlete-order {
      order: 1;
    }
    .event-summary-dual .team-column.left .athlete-photo {
      order: 2;
    }
    .event-summary-dual .team-column.left .athlete-name {
      order: 3;
    }
    .event-summary-dual .team-column.left .athlete-score-block {
      order: 4;
    }
    /* Right side - reverse order for RTL layout */
    .event-summary-dual .team-column.right .athlete-row {
      flex-direction: row-reverse;
      gap: 12px;
    }
    .event-summary-dual .team-column.right .athlete-name {
      text-align: right;
    }
    .event-summary-dual .team-column.right .athlete-score-block {
      flex-direction: row-reverse;
    }
    .event-summary-dual .team-column.right .athlete-start {
      text-align: left;
    }
    .event-summary-dual .team-column.right .athlete-score {
      text-align: left;
    }

    /* Center divider with rotation info and score diff bars */
    .event-summary-dual .center-divider {
      width: 140px;
      background: #27272a;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .event-summary-dual .center-header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 88px;
    }
    .event-summary-dual .rotation-badge {
      font-size: 32px;
      font-weight: 800;
      color: #fff;
    }
    .event-summary-dual .diff-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      padding: 8px 12px;
      width: 100%;
    }
    .event-summary-dual .diff-row:nth-child(odd) {
      background: #18181b;
    }
    .event-summary-dual .diff-row:nth-child(even) {
      background: #27272a;
    }
    .event-summary-dual .diff-value {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }
    .event-summary-dual .diff-bar {
      width: 100%;
      height: 8px;
      background: #3f3f46;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .event-summary-dual .diff-bar-fill {
      position: absolute;
      top: 0;
      height: 100%;
      border-radius: 4px;
    }
    .event-summary-dual .diff-bar-fill.left {
      right: 50%;
      background: linear-gradient(to left, #eab308, #dc2626);
    }
    .event-summary-dual .diff-bar-fill.right {
      left: 50%;
      background: linear-gradient(to right, #eab308, #dc2626);
    }
    .event-summary-dual .diff-bar-fill.tie {
      left: 50%;
      width: 4px !important;
      transform: translateX(-50%);
      background: #a1a1aa;
    }
    .event-summary-dual .diff-indicator {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #27272a;
    }

    /* Footer with event totals and icons */
    .event-summary-footer {
      display: flex;
      background: #18181b;
      border-top: 2px solid #3f3f46;
      min-height: 80px;
      flex-shrink: 0;
    }
    .event-summary-footer .footer-team {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 16px 24px;
      gap: 16px;
    }
    .event-summary-footer .footer-team.right {
      flex-direction: row-reverse;
    }
    .event-summary-footer .event-abbr {
      font-size: 32px;
      font-weight: 800;
      color: #a1a1aa;
    }
    .event-summary-footer .event-icon {
      width: 40px;
      height: 40px;
      opacity: 0.6;
    }
    .event-summary-footer .event-label {
      font-size: 32px;
      font-weight: 600;
      color: #a1a1aa;
      text-transform: uppercase;
    }
    .event-summary-footer .event-total {
      font-size: 48px;
      font-weight: 800;
      color: #fff;
      margin-left: auto;
      font-variant-numeric: tabular-nums;
    }
    .event-summary-footer .footer-team.right .event-total {
      margin-left: 0;
    }
    .event-summary-footer .footer-team.right .event-label {
      margin-left: auto;
    }
    .event-summary-footer .footer-center {
      width: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .event-summary-footer .footer-diff {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }
    .event-summary-footer .footer-diff-bar {
      width: 80%;
      height: 6px;
      background: #3f3f46;
      border-radius: 3px;
      position: relative;
      overflow: hidden;
    }
    .event-summary-footer .footer-diff-fill {
      position: absolute;
      top: 0;
      height: 100%;
      border-radius: 3px;
    }
    .event-summary-footer .footer-diff-fill.left {
      right: 50%;
      background: linear-gradient(to left, #eab308, #dc2626);
    }
    .event-summary-footer .footer-diff-fill.right {
      left: 50%;
      background: linear-gradient(to right, #eab308, #dc2626);
    }

    /* ==========================================
       EVENT SUMMARY THEMES
       ========================================== */

    /* Theme 1: ESPN - Bold red/black sports broadcast style */
    .theme-espn .event-summary-dual {
      background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
    }
    .theme-espn .team-header {
      background: linear-gradient(90deg, #c41e3a 0%, #8b0000 100%);
      border-bottom: 3px solid #ffd700;
    }
    .theme-espn .team-header.right {
      background: linear-gradient(90deg, #8b0000 0%, #c41e3a 100%);
    }
    .theme-espn .team-name {
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .theme-espn .athlete-row:nth-child(odd) { background: #1a1a1a; }
    .theme-espn .athlete-row:nth-child(even) { background: #242424; }
    .theme-espn .center-divider { background: #c41e3a; }
    .theme-espn .rotation-badge { color: #ffd700; }
    .theme-espn .diff-bar { background: #333; }
    .theme-espn .diff-bar-fill.left { background: linear-gradient(to left, #ffd700, #c41e3a); }
    .theme-espn .diff-bar-fill.right { background: linear-gradient(to right, #ffd700, #c41e3a); }
    .theme-espn .event-summary-footer { background: #c41e3a; border-top: 3px solid #ffd700; }
    .theme-espn .event-summary-footer .event-total { color: #ffd700; }

    /* Theme 2: NBC Olympics - Gold/white elegant style */
    .theme-nbc .event-summary-dual {
      background: linear-gradient(180deg, #0a1628 0%, #051020 100%);
    }
    .theme-nbc .team-header {
      background: linear-gradient(90deg, #b8860b 0%, #daa520 50%, #b8860b 100%);
      border-bottom: 2px solid #fff;
    }
    .theme-nbc .team-name { color: #0a1628; font-weight: 800; }
    .theme-nbc .team-total { color: #0a1628; }
    .theme-nbc .athlete-row:nth-child(odd) { background: #0a1628; }
    .theme-nbc .athlete-row:nth-child(even) { background: #0f1f38; }
    .theme-nbc .athlete-score { color: #daa520; }
    .theme-nbc .center-divider { background: linear-gradient(180deg, #daa520 0%, #b8860b 100%); }
    .theme-nbc .rotation-badge { color: #0a1628; font-weight: 900; }
    .theme-nbc .diff-value { color: #0a1628; }
    .theme-nbc .diff-bar { background: rgba(10,22,40,0.5); }
    .theme-nbc .diff-bar-fill.left { background: linear-gradient(to left, #fff, #daa520); }
    .theme-nbc .diff-bar-fill.right { background: linear-gradient(to right, #fff, #daa520); }
    .theme-nbc .event-summary-footer { background: linear-gradient(90deg, #b8860b, #daa520, #b8860b); border-top: none; }
    .theme-nbc .event-summary-footer * { color: #0a1628; }

    /* Theme 3: Big Ten Network - Clean navy/white */
    .theme-btn .event-summary-dual {
      background: #041e42;
    }
    .theme-btn .team-header {
      background: #fff;
      border-bottom: 4px solid #041e42;
    }
    .theme-btn .team-name { color: #041e42; }
    .theme-btn .team-total { color: #041e42; }
    .theme-btn .athlete-row:nth-child(odd) { background: #041e42; }
    .theme-btn .athlete-row:nth-child(even) { background: #0a2d5c; }
    .theme-btn .athlete-order { background: #fff; color: #041e42; }
    .theme-btn .center-divider { background: #fff; }
    .theme-btn .rotation-badge { color: #041e42; }
    .theme-btn .diff-value { color: #041e42; }
    .theme-btn .diff-bar { background: #ccc; }
    .theme-btn .diff-bar-fill.left { background: linear-gradient(to left, #041e42, #0a2d5c); }
    .theme-btn .diff-bar-fill.right { background: linear-gradient(to right, #041e42, #0a2d5c); }
    .theme-btn .event-summary-footer { background: #fff; border-top: 4px solid #041e42; }
    .theme-btn .event-summary-footer * { color: #041e42; }

    /* Theme 4: Pac-12 Network - Gradient purple/blue */
    .theme-pac12 .event-summary-dual {
      background: linear-gradient(135deg, #1a0a2e 0%, #0f1a3d 100%);
    }
    .theme-pac12 .team-header {
      background: linear-gradient(90deg, #4a148c 0%, #1565c0 100%);
      border-bottom: 2px solid #00e5ff;

    /* ============================================================
       CLIP INTEGRATION - Video Elements & Background
       Dual video elements for seamless clip transitions with preloading
       ============================================================ */

    /* Animated background for breaks (mode=live only)
       Uses theme variables with fallback gradient
       8-second animation cycle with shifting background-position */
    #clipBackground {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: none;
      opacity: 0;
      transition: opacity 300ms ease-in-out;
      /* Animated gradient using theme variables with fallbacks */
      background: linear-gradient(
        135deg,
        var(--meet-header-bg, #1a1a2e) 0%,
        var(--meet-content-bg, #16213e) 50%,
        var(--meet-header-bg, #1a1a2e) 100%
      );
      background-size: 400% 400%;
      animation: clipBackgroundShift 8s ease-in-out infinite;
    }

    #clipBackground.visible {
      display: block;
      opacity: 1;
    }

    @keyframes clipBackgroundShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* Video elements for clip playback (mode=clip only) */
    #clipVideo,
    #clipVideoNext {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
    }

    /* Active clip - visible, playing */
    .clip-active {
      z-index: 2;
      opacity: 1;
      display: block;
      transition: opacity 300ms ease-in-out;
    }

    /* Preloading clip - hidden, loading next */
    .clip-preload {
      z-index: -1;
      opacity: 0;
      display: none;
    }

    /* During crossfade - both visible, opacity animating */
    .clip-crossfade-out {
      z-index: 2;
      display: block;
      opacity: 0;
      transition: opacity 300ms ease-in-out;
    }

    .clip-crossfade-in {
      z-index: 2;
      display: block;
      opacity: 1;
      transition: opacity 300ms ease-in-out;
    }

    /* Ensure output div stays above background but below video in clip mode */
    #output {
      position: relative;
      z-index: 1;
    }

    /* ============================================================
       CLIP PLAYBACK OVERLAY
       Athlete info panel + score reveal badge
       ============================================================ */

    /* Overlay container - on top of video */
    #clipOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      display: none;
    }

    #clipOverlay.visible {
      display: block;
    }

    /* Athlete info panel - top left
       Per-graphic overrides: --clip-overlay-panel-top, --clip-overlay-panel-left,
       --clip-overlay-panel-radius, --clip-overlay-header-bg */
    .clip-athlete-panel {
      position: absolute;
      top: var(--clip-overlay-panel-top, 60px);
      left: var(--clip-overlay-panel-left, 60px);
      display: flex;
      flex-direction: row;
      align-items: stretch;
      background: var(--clip-overlay-header-bg, var(--meet-header-bg, #1a1a2e));
      border-radius: var(--clip-overlay-panel-radius, 12px);
      overflow: hidden;

      animation: clipOverlaySlideIn var(--clip-overlay-slide-duration, 0.4s) cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes clipOverlaySlideIn {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Team logo section
       Per-graphic overrides: --clip-overlay-logo-width, --clip-overlay-logo-min-height,

    /* Score badge - appears during score reveal
       Per-graphic overrides: --clip-overlay-badge-top, --clip-overlay-badge-right,

    /* REPLAY badge - for moment replays only
       Per-graphic overrides: --clip-overlay-replay-bg, --clip-overlay-replay-padding-v,
       --clip-overlay-replay-padding-h, --clip-overlay-replay-radius, --clip-overlay-replay-font-size,
       --clip-overlay-replay-font-weight, --clip-overlay-replay-letter-spacing */
    .clip-replay-badge {

      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);

    /* ============================================================
       LIVE CAMERA RENDERER (mode=live only)
       Renders LIVE badge with optional apparatus label
       ============================================================ */
    .live-camera-badge {
      position: absolute;
      top: 60px;
      left: 60px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      animation: liveBadgeSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .live-camera-indicator {
      background: #dc2626;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 3px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-camera-dot {
      width: 12px;
      height: 12px;
      background: #ffffff;
      border-radius: 50%;
      animation: livePulse 1.5s ease-in-out infinite;
    }

    .live-camera-apparatus {
      background: var(--meet-header-bg, rgba(0, 0, 0, 0.75));
      color: var(--meet-header-text, #ffffff);
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 20px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    @keyframes liveBadgeSlideIn {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes livePulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.5;
        transform: scale(0.8);
      }
    }
  </style>
</head>
<body>
  <!-- Animated background for breaks (mode=live only) -->
  <div id="clipBackground"></div>

  <!-- Main output div for graphics renderers -->
  <div id="output"></div>

  <!-- Dual video elements for clip playback (mode=clip only) -->
  <video id="clipVideo" class="clip-preload" playsinline muted autoplay></video>
  <video id="clipVideoNext" class="clip-preload" playsinline muted autoplay></video>
  <!-- Iframe fallback for video formats not supported by <video> element -->
  <iframe id="clipIframeFallback" class="clip-preload" style="width:1920px;height:1080px;border:none;background:black;" allow="autoplay"></iframe>

  <!-- Clip playback overlay (mode=clip only) -->
  <div id="clipOverlay">
    <div class="clip-athlete-panel">
      <div class="clip-logo-section">
        <img id="clipTeamLogo" src="" alt="Team Logo">
      </div>
      <div class="clip-athlete-info">
        <div id="clipAthleteName" class="clip-athlete-name"></div>
        <div id="clipApparatus" class="clip-apparatus"></div>
        <div id="clipTeamName" class="clip-team-name"></div>
      </div>
    </div>
    <div id="clipScoreBadge" class="clip-score-badge"></div>
    <div id="clipReplayBadge" class="clip-replay-badge" style="display: none;">REPLAY</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="/overlays/theme-loader.js"></script>
  <script>
    // Get competition ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const competitionId = urlParams.get('comp');
    const hasGraphicParam = urlParams.has('graphic'); // Check if graphic param exists for preview mode

    // Mode parameter for clip integration (PRD Clip Integration)
    // 'live' (default): Renders existing graphics, LIVE badge, animated backgrounds. Clears on clip-type graphics.
    // 'clip': Renders video playback + overlay. Stops/hides video on non-clip graphics.
    // 'preview': Same as 'clip' but does NOT write to Firebase (for producer testing).
    // 'clip-preview': Shows clip overlay with sample data for Theme Editor preview. No video, no Firebase.
    const outputMode = urlParams.get('mode') || 'live';
    const isClipMode = outputMode === 'clip' || outputMode === 'preview';
    const isClipPreviewMode = outputMode === 'clip-preview';
    const shouldWriteToFirebase = outputMode === 'clip'; // preview mode skips Firebase writes

    console.log(`[output] Mode: ${outputMode}, isClipMode: ${isClipMode}, isClipPreviewMode: ${isClipPreviewMode}, shouldWriteToFirebase: ${shouldWriteToFirebase}`);

    // ============================================================
    // CLIP INTEGRATION - Video Element Management
    // Dual video elements for seamless clip transitions with preloading
    // ============================================================

    // Get video elements
    const clipVideo = document.getElementById('clipVideo');
    const clipVideoNext = document.getElementById('clipVideoNext');
    const clipIframeFallback = document.getElementById('clipIframeFallback');
    const clipBackground = document.getElementById('clipBackground');
    let usingIframeFallback = false;

    // Get overlay elements
    const clipOverlay = document.getElementById('clipOverlay');
    const clipTeamLogoEl = document.getElementById('clipTeamLogo');
    const clipAthleteNameEl = document.getElementById('clipAthleteName');
    const clipApparatusEl = document.getElementById('clipApparatus');
    const clipTeamNameEl = document.getElementById('clipTeamName');
    const clipScoreBadgeEl = document.getElementById('clipScoreBadge');
    const clipReplayBadgeEl = document.getElementById('clipReplayBadge');

    // Track which video is currently active (for swap mechanism)
    let activeVideoElement = clipVideo;
    let preloadVideoElement = clipVideoNext;

    // Listen for messages from iframe clip-player (fallback mode)
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'clipEnded' && usingIframeFallback && currentClipDraftId) {
        console.log('[clip] Iframe clip-player reported clip ended');
        writeClipStatus(currentClipDraftId, 'ended', {});
      } else if (event.data?.type === 'clipError' && usingIframeFallback && currentClipDraftId) {
        console.log('[clip] Iframe clip-player reported error:', event.data.message);
        writeClipStatus(currentClipDraftId, 'error', { errorMessage: event.data.message || 'Iframe playback error' });
      } else if (event.data?.type === 'measureHeights') {
        // Theme Editor requests pixel-perfect element heights via postMessage
        const selectors = event.data.selectors;
        const measurements = {};
        for (const [key, selector] of Object.entries(selectors || {})) {
          const el = document.querySelector(selector);
          if (el) {
            measurements[key] = Math.round(el.getBoundingClientRect().height);
          }
        }
        if (event.source) {
          event.source.postMessage({
            type: 'heightMeasurements',
            graphic: event.data.graphic,
            measurements: measurements,
          }, '*');
        }
      }
    });

    // Track current clip state
    let currentClipDraftId = null;
    let preloadedClipUrl = null;
    let preloadedClipDraftId = null;     // Draft ID of the preloaded clip (for optimistic advance)
    let preloadedClipData = null;        // Full data for preloaded clip (for overlay updates)
    let crossfadeInProgress = false;
    let optimisticAdvanceActive = false; // True when we auto-advanced without coordinator confirmation
    let preloadTimeoutId = null;         // Timer for 30s preload timeout

    // Track score reveal state
    let scoreRevealTime = null;  // Time (in seconds) when score should appear
    let scoreRevealed = false;   // Has score been revealed for current clip
    let currentClipScore = null; // Current clip's score (null = no badge, 0 = show "0.000", >0 = show score)

    // ============================================================
    // CLIP INTEGRATION - Firebase Write-Back (Task 7)
    // Write clip status (ended/stalled/error) to Firebase for coordinator
    // ============================================================

    // Stall detection state
    let stallTimeoutId = null;           // Timer ID for 8s stall timeout
    let loadTimeoutId = null;            // Timer ID for 10s initial load timeout
    const STALL_TIMEOUT_MS = 8000;       // 8 seconds before writing stalled status
    const LOAD_TIMEOUT_MS = 10000;       // 10 seconds for initial canplaythrough
    const PRELOAD_TIMEOUT_MS = 30000;    // 30 seconds for preload timeout
    const HEARTBEAT_STALE_MS = 30000;    // 30 seconds before heartbeat is stale
    const MAX_RETRY_COUNT = 3;           // Maximum retries for Firebase writes
    const RETRY_DELAYS = [1000, 2000, 4000]; // Exponential backoff delays

    /**
     * Rewrite R2 presigned URLs to route through the coordinator proxy.
     * This avoids CORS/auth issues where expired or unsigned URLs cause
     * Chrome to misreport "Format not supported" errors.
     * @param {string} url - The original clip URL
     * @returns {string} - The proxy URL (if R2) or original URL
     */
    function proxyClipUrl(url) {
      if (!url) return url;
      // Don't double-proxy
      if (url.includes('api.commentarygraphic.com/api/clip-proxy')) {
        return url;
      }
      // Only proxy R2 URLs
      if (url.includes('r2.cloudflarestorage.com')) {
        const proxyUrl = `https://api.commentarygraphic.com/api/clip-proxy?url=${encodeURIComponent(url)}`;
        console.log(`[clip] Using proxy: ${proxyUrl.substring(0, 80)}...`);
        return proxyUrl;
      }
      return url;  // Non-R2 URLs pass through unchanged
    }

    // Heartbeat monitoring state
    let lastHeartbeatTimestamp = null;   // Last received heartbeat timestamp
    let heartbeatStale = false;          // True if heartbeat > 30s old
    let heartbeatListenerActive = false; // Whether heartbeat listener is set up
    let heartbeatCheckInterval = null;   // Interval ID for periodic heartbeat checks

    /**
     * Start monitoring coordinator heartbeat
     * Heartbeat is at production/engineHeartbeat
     */
    function startHeartbeatMonitoring() {
      if (heartbeatListenerActive || !competitionId) return;

      console.log('[heartbeat] Starting heartbeat monitoring');
      heartbeatListenerActive = true;

      // Listen to engineHeartbeat path
      db.ref(`competitions/${competitionId}/production/engineHeartbeat`).on('value', (snapshot) => {
        const heartbeat = snapshot.val();
        if (heartbeat && heartbeat.timestamp) {
          lastHeartbeatTimestamp = heartbeat.timestamp;
          const wasStale = heartbeatStale;
          heartbeatStale = false;

          if (wasStale) {
            console.log('[heartbeat] Heartbeat recovered - auto-advance re-enabled');
          }
        }
      });

      // Periodically check if heartbeat is stale
      heartbeatCheckInterval = setInterval(() => {
        if (lastHeartbeatTimestamp) {
          const age = Date.now() - lastHeartbeatTimestamp;
          if (age > HEARTBEAT_STALE_MS && !heartbeatStale) {
            heartbeatStale = true;
            console.warn('[heartbeat] Coordinator heartbeat lost (>30s) - auto-advance suspended');
          }
        }
      }, 5000); // Check every 5 seconds
    }

    /**
     * Stop heartbeat monitoring
     */
    function stopHeartbeatMonitoring() {
      if (heartbeatCheckInterval) {
        clearInterval(heartbeatCheckInterval);
        heartbeatCheckInterval = null;
      }
      heartbeatListenerActive = false;
    }

    /**
     * Write clip status to Firebase at clipStatus/{draftId}
     * @param {string} draftId - The clip's draft ID
     * @param {string} status - Status: 'ended', 'stalled', 'error'
     * @param {Object} extraData - Additional data (e.g., optimisticNextDraftId, errorMessage)
     * @param {number} retryCount - Current retry attempt (for exponential backoff)
     * @returns {Promise<void>}
     */
    async function writeClipStatus(draftId, status, extraData = {}, retryCount = 0) {
      // Skip writes in preview mode
      if (!shouldWriteToFirebase) {
        console.log(`[clip-status] Preview mode - skipping write: ${status} for ${draftId}`);
        return;
      }

      if (!competitionId || !draftId) {
        console.error('[clip-status] Cannot write status: missing competitionId or draftId');
        return;
      }

      const statusPath = `competitions/${competitionId}/production/clipStatus/${draftId}`;
      const statusData = {
        status,
        draftId,
        timestamp: Date.now(),
        ...extraData
      };

      console.log(`[clip-status] Writing: ${status} for ${draftId}`, statusData);

      try {
        await db.ref(statusPath).set(statusData);
        console.log(`[clip-status] Successfully wrote: ${status} for ${draftId}`);
      } catch (error) {
        console.error(`[clip-status] Write failed (attempt ${retryCount + 1}):`, error);

        // Retry with exponential backoff
        if (retryCount < MAX_RETRY_COUNT) {
          const delay = RETRY_DELAYS[retryCount] || RETRY_DELAYS[RETRY_DELAYS.length - 1];
          console.log(`[clip-status] Retrying in ${delay}ms...`);
          await new Promise(resolve => setTimeout(resolve, delay));
          return writeClipStatus(draftId, status, extraData, retryCount + 1);
        } else {
          console.error(`[clip-status] Max retries exceeded for ${draftId}`);
        }
      }
    }

    /**
     * Clear all stall/load timeouts
     */
    function clearClipTimeouts() {
      if (stallTimeoutId) {
        clearTimeout(stallTimeoutId);
        stallTimeoutId = null;
      }
      if (loadTimeoutId) {
        clearTimeout(loadTimeoutId);
        loadTimeoutId = null;
      }
    }

    /**
     * Handle video 'waiting' event - start stall detection timer
     * Called when video playback stalls due to buffering
     */
    function handleVideoWaiting() {
      console.log('[clip-status] Video waiting (buffering)...');

      // Clear existing stall timeout if any
      if (stallTimeoutId) {
        clearTimeout(stallTimeoutId);
      }

      // Start 8s stall timeout
      stallTimeoutId = setTimeout(() => {
        console.log('[clip-status] Stall timeout reached (8s)');
        if (currentClipDraftId) {
          writeClipStatus(currentClipDraftId, 'stalled');
        }
        stallTimeoutId = null;
      }, STALL_TIMEOUT_MS);
    }

    /**
     * Handle video 'playing' event - cancel stall detection timer
     * Called when video resumes playback after buffering
     */
    function handleVideoPlaying() {
      console.log('[clip-status] Video playing (resumed)');

      // Cancel stall timeout if it was started
      if (stallTimeoutId) {
        clearTimeout(stallTimeoutId);
        stallTimeoutId = null;
        console.log('[clip-status] Stall timeout cancelled');
      }
    }

    /**
     * Handle video 'error' event - write error status
     * @param {Event} event - The error event
     */
    function handleVideoError(event) {
      const video = event.target;
      const mediaError = video.error;
      let errorMessage = 'Unknown error';

      if (mediaError) {
        switch (mediaError.code) {
          case MediaError.MEDIA_ERR_ABORTED:
            errorMessage = 'Playback aborted';
            break;
          case MediaError.MEDIA_ERR_NETWORK:
            errorMessage = 'Network error';
            break;
          case MediaError.MEDIA_ERR_DECODE:
            errorMessage = 'Decode error';
            break;
          case MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED:
            errorMessage = 'Format not supported';
            break;
        }
      }

      // Enhanced diagnostic logging for video errors
      const networkStateNames = ['NETWORK_EMPTY', 'NETWORK_IDLE', 'NETWORK_LOADING', 'NETWORK_NO_SOURCE'];
      const networkState = networkStateNames[video.networkState] || video.networkState;
      const srcPreview = video.src ? video.src.substring(0, 80) + '...' : '(no src)';

      console.error(`[clip-status] Video error: ${errorMessage}`);
      console.error(`[clip-status] MediaError code: ${mediaError ? mediaError.code : 'none'}, message: ${mediaError ? mediaError.message : 'none'}`);
      console.error(`[clip-status] Network state: ${networkState}`);
      console.error(`[clip-status] Source URL: ${srcPreview}`);

      // Clear timeouts since we're reporting an error
      clearClipTimeouts();

      if (currentClipDraftId) {
        writeClipStatus(currentClipDraftId, 'error', { errorMessage, networkState });
      }
    }

    /**
     * Handle video 'ended' event for clip-playback
     * Writes 'ended' status to Firebase and performs optimistic advance if available
     */
    function handleClipEnded() {
      console.log('[clip-status] Clip ended');

      // Clear any stall timeout
      clearClipTimeouts();

      // Check if heartbeat is stale - don't auto-advance if coordinator is down
      if (heartbeatStale) {
        console.log('[clip-status] Heartbeat stale - not auto-advancing');
        if (currentClipDraftId) {
          writeClipStatus(currentClipDraftId, 'ended', {});
        }
        // Hide video elements and wait for coordinator
        hideAllVideos();
        return;
      }

      // Check if we have a preloaded clip ready for optimistic advance
      const canOptimisticAdvance = preloadedClipUrl &&
                                    preloadedClipDraftId &&
                                    preloadVideoElement.readyState >= 2; // HAVE_CURRENT_DATA

      if (currentClipDraftId) {
        // Include optimisticNextDraftId if we have a preloaded clip
        const extraData = {};
        if (canOptimisticAdvance) {
          extraData.optimisticNextDraftId = preloadedClipDraftId;
        }
        writeClipStatus(currentClipDraftId, 'ended', extraData);
      }

      // Perform optimistic advance if preloaded clip is ready
      if (canOptimisticAdvance) {
        console.log(`[clip] Optimistic advance to preloaded clip: ${preloadedClipDraftId}`);
        performOptimisticAdvance();
      } else if (preloadedClipUrl) {
        // Preload started but not ready - wait for coordinator
        console.log('[clip] Preloaded clip not ready yet, waiting for coordinator');
      }
    }

    /**
     * Perform optimistic advance to the preloaded clip
     * Called when current clip ends and preloaded clip is ready
     */
    function performOptimisticAdvance() {
      if (!preloadedClipUrl || !preloadedClipDraftId) {
        console.error('[clip] Cannot optimistic advance: no preloaded clip');
        return;
      }

      optimisticAdvanceActive = true;
      const advancingToDraftId = preloadedClipDraftId;
      const advancingToData = preloadedClipData;

      // Swap video elements so preloaded becomes active
      swapVideoElements();

      // Hide the old video element (now preloadVideoElement) so it doesn't cover the new one
      setVideoPreload(preloadVideoElement, true);

      // Update state
      currentClipDraftId = advancingToDraftId;
      preloadedClipUrl = null;
      preloadedClipDraftId = null;
      preloadedClipData = null;

      // Clear preload timeout
      if (preloadTimeoutId) {
        clearTimeout(preloadTimeoutId);
        preloadTimeoutId = null;
      }

      // Reset score state for new clip
      scoreRevealed = false;
      scoreRevealTime = null;
      currentClipScore = advancingToData?.score ?? null;

      // Update overlay with new athlete info (suppress for WTW clips - they use their own lower-third)
      if (advancingToData) {
        if (advancingToData.overlayStyle === 'who-to-watch') {
          clipOverlay.classList.remove('visible');
        } else {
          updateClipOverlay(advancingToData);
        }
      }

      // Remove old event listeners from new active element
      activeVideoElement.removeEventListener('timeupdate', handleClipTimeUpdate);
      activeVideoElement.removeEventListener('loadedmetadata', handleClipMetadataLoaded);

      // Set up status listeners for new clip
      setupClipStatusListeners(activeVideoElement);

      // Set the new video active and play
      setVideoActive(activeVideoElement);
      activeVideoElement.play()
        .then(() => {
          console.log(`[clip] Optimistic advance playing: ${advancingToDraftId}`);

          // Add event listeners for score reveal
          activeVideoElement.addEventListener('timeupdate', handleClipTimeUpdate);
          activeVideoElement.addEventListener('loadedmetadata', handleClipMetadataLoaded);

          // If metadata already loaded, handle it now
          if (activeVideoElement.readyState >= 1) {
            handleClipMetadataLoaded();
          }

          // Preload next clip if we have the data
          if (advancingToData?.nextClipUrl) {
            preloadClipWithData(advancingToData.nextClipUrl, advancingToData.nextClipDraftId, advancingToData.nextClipData);
          }
        })
        .catch(err => {
          if (err.name === 'NotAllowedError') {
            console.warn('[clip] Autoplay blocked (optimistic), retrying muted');
            activeVideoElement.muted = true;
            activeVideoElement.play()
              .then(() => {
                console.log(`[clip] Optimistic advance playing (muted): ${advancingToDraftId}`);
                activeVideoElement.addEventListener('timeupdate', handleClipTimeUpdate);
                activeVideoElement.addEventListener('loadedmetadata', handleClipMetadataLoaded);
                if (activeVideoElement.readyState >= 1) handleClipMetadataLoaded();
                if (advancingToData?.nextClipUrl) {
                  preloadClipWithData(advancingToData.nextClipUrl, advancingToData.nextClipDraftId, advancingToData.nextClipData);
                }
              })
              .catch(err2 => {
                console.error('[clip] Optimistic advance failed even muted:', err2);
                optimisticAdvanceActive = false;
                writeClipStatus(advancingToDraftId, 'error', { errorMessage: err2.message });
              });
          } else {
            console.error('[clip] Optimistic advance failed to play:', err);
            optimisticAdvanceActive = false;
            writeClipStatus(advancingToDraftId, 'error', { errorMessage: err.message });
          }
        });
    }

    /**
     * Handle coordinator correction - we optimistically advanced to wrong clip
     * Fade out current (wrong) clip and load the correct one
     * @param {string} graphic - The graphic type from coordinator
     * @param {Object} data - The clip data from coordinator
     */
    function handleCoordinatorCorrection(graphic, data) {
      console.log(`[clip] Handling coordinator correction to: ${data.draftId}`);
      optimisticAdvanceActive = false;

      // Get the current (wrong) video element
      const wrongVideoEl = activeVideoElement;

      // Fade out audio over 300ms
      const fadeOutAudio = () => {
        return new Promise((resolve) => {
          const startVolume = wrongVideoEl.volume;
          const fadeSteps = 10;
          const stepDuration = 300 / fadeSteps;
          let currentStep = 0;

          const fadeInterval = setInterval(() => {
            currentStep++;
            wrongVideoEl.volume = startVolume * (1 - currentStep / fadeSteps);

            if (currentStep >= fadeSteps) {
              clearInterval(fadeInterval);
              wrongVideoEl.volume = 0;
              resolve();
            }
          }, stepDuration);
        });
      };

      // Start audio fade
      fadeOutAudio().then(() => {
        // Stop the wrong video
        wrongVideoEl.pause();
        wrongVideoEl.removeAttribute('src');
        wrongVideoEl.load();

        // Clear state and load correct clip
        currentClipDraftId = null;
        preloadedClipUrl = null;
        preloadedClipDraftId = null;
        preloadedClipData = null;

        // Load the correct clip through normal handleClipPlayback
        // Set a flag to prevent recursion detection
        optimisticAdvanceActive = false;
        handleClipPlayback(graphic, data);
      });
    }

    /**
     * Set up stall detection and error handling on a video element
     * @param {HTMLVideoElement} videoEl - The video element to monitor
     */
    function setupClipStatusListeners(videoEl) {
      // Remove any existing listeners first to avoid duplicates
      videoEl.removeEventListener('waiting', handleVideoWaiting);
      videoEl.removeEventListener('playing', handleVideoPlaying);
      videoEl.removeEventListener('error', handleVideoError);
      videoEl.removeEventListener('ended', handleClipEnded);

      // Add fresh listeners
      videoEl.addEventListener('waiting', handleVideoWaiting);
      videoEl.addEventListener('playing', handleVideoPlaying);
      videoEl.addEventListener('error', handleVideoError);
      videoEl.addEventListener('ended', handleClipEnded);

      console.log(`[clip-status] Status listeners attached to ${videoEl.id}`);
    }

    /**
     * Remove stall detection and error handling from a video element
     * @param {HTMLVideoElement} videoEl - The video element to clean up
     */
    function removeClipStatusListeners(videoEl) {
      videoEl.removeEventListener('waiting', handleVideoWaiting);
      videoEl.removeEventListener('playing', handleVideoPlaying);
      videoEl.removeEventListener('error', handleVideoError);
      videoEl.removeEventListener('ended', handleClipEnded);
      clearClipTimeouts();
      console.log(`[clip-status] Status listeners removed from ${videoEl.id}`);
    }

    /**
     * Start initial load timeout for a clip
     * If canplaythrough doesn't fire within 10s, write error status
     * @param {HTMLVideoElement} videoEl - The video element loading
     * @param {string} draftId - The clip's draft ID
     */
    function startLoadTimeout(videoEl, draftId) {
      // Clear existing load timeout
      if (loadTimeoutId) {
        clearTimeout(loadTimeoutId);
      }

      // Handler for successful load
      const onCanPlayThrough = () => {
        console.log('[clip-status] Video can play through - load successful');
        clearTimeout(loadTimeoutId);
        loadTimeoutId = null;
        videoEl.removeEventListener('canplaythrough', onCanPlayThrough);
      };

      videoEl.addEventListener('canplaythrough', onCanPlayThrough, { once: true });

      // Start 10s load timeout
      loadTimeoutId = setTimeout(() => {
        console.error('[clip-status] Load timeout reached (10s)');
        videoEl.removeEventListener('canplaythrough', onCanPlayThrough);

        // Check if video is still trying to load
        if (videoEl.readyState < 3) { // HAVE_FUTURE_DATA
          writeClipStatus(draftId, 'error', { errorMessage: 'Load timeout (10s)' });
        }
        loadTimeoutId = null;
      }, LOAD_TIMEOUT_MS);
    }

    /**
     * Swap video element roles (active <-> preload)
     * The two video elements swap CSS classes, not DOM position.
     * This enables seamless transitions with preloading.
     */
    function swapVideoElements() {
      const temp = activeVideoElement;
      activeVideoElement = preloadVideoElement;
      preloadVideoElement = temp;
      console.log(`[clip] Swapped video elements. Active: ${activeVideoElement.id}, Preload: ${preloadVideoElement.id}`);
    }

    /**
     * Set a video element to active state (visible, playing)
     * @param {HTMLVideoElement} videoEl - The video element to activate
     */
    function setVideoActive(videoEl) {
      videoEl.classList.remove('clip-preload', 'clip-crossfade-out', 'clip-crossfade-in');
      videoEl.classList.add('clip-active');
    }

    /**
     * Set a video element to preload state (hidden, ready to load next)
     * @param {HTMLVideoElement} videoEl - The video element to set to preload
     * @param {boolean} clearSrc - Whether to clear the src to free memory
     */
    function setVideoPreload(videoEl, clearSrc = true) {
      videoEl.classList.remove('clip-active', 'clip-crossfade-out', 'clip-crossfade-in');
      videoEl.classList.add('clip-preload');
      if (clearSrc) {
        videoEl.pause();
        videoEl.src = '';
        videoEl.load(); // Release media resources
      }

     * @returns {Promise} Resolves when crossfade completes

    function crossfadeVideos(outgoingEl, incomingEl, duration = 300) {
      return new Promise((resolve) => {
        if (crossfadeInProgress) {
          console.warn('[clip] Crossfade already in progress, skipping');
          resolve();
          return;
        }

        crossfadeInProgress = true;

        // Set up crossfade classes
        outgoingEl.classList.remove('clip-active', 'clip-preload');
        outgoingEl.classList.add('clip-crossfade-out');

        incomingEl.classList.remove('clip-preload', 'clip-active');
        incomingEl.classList.add('clip-crossfade-in');

        // Start incoming video playback
        incomingEl.play().catch(err => {
          console.error('[clip] Error playing incoming video:', err);

        // Wait for transition to complete

          // Clean up outgoing element

      if (!url) {

      preloadVideoElement.src = url;

        preloadTimeoutId = null;

          preloadTimeoutId = null;

     * This function must match the normalization in:
     * - show-controller/src/lib/nameNormalization.js
     * - show-controller/src/hooks/useCompetitions.js
     * - show-controller/src/hooks/useTeamsDatabase.js
     *
     * Process:
     * 1. Convert accents to ASCII equivalents (ö → oe, é → e, etc.)
     * 2. Lowercase everything
     * 3. Replace hyphens/underscores with spaces
     * 4. Remove apostrophes
     * 5. Collapse multiple spaces and trim
     */
    function normalizeAccentsUnified(str) {
      if (!str) return '';
      return str
        // German/Swedish umlauts - convert to two-letter equivalents
        .replace(/ö/g, 'oe').replace(/Ö/g, 'oe')
        .replace(/ä/g, 'ae').replace(/Ä/g, 'ae')
        .replace(/ü/g, 'ue').replace(/Ü/g, 'ue')
        .replace(/ß/g, 'ss')
        // French/Spanish/Portuguese accents - convert to base letter
        .replace(/[éèêë]/g, 'e').replace(/[ÉÈÊË]/g, 'e')
        .replace(/[áàâãå]/g, 'a').replace(/[ÁÀÂÃÅ]/g, 'a')
        .replace(/[íìîï]/g, 'i').replace(/[ÍÌÎÏ]/g, 'i')
        .replace(/[óòôõø]/g, 'o').replace(/[ÓÒÔÕØ]/g, 'o')
        .replace(/[úùûü]/g, 'u').replace(/[ÚÙÛÜ]/g, 'u')
        .replace(/ñ/g, 'n').replace(/Ñ/g, 'n')
        .replace(/ç/g, 'c').replace(/Ç/g, 'c')
        .replace(/ÿ/g, 'y').replace(/Ÿ/g, 'y')
        // Ligatures
        .replace(/æ/g, 'ae').replace(/Æ/g, 'ae')
        .replace(/œ/g, 'oe').replace(/Œ/g, 'oe');
    }

    // Remove common name suffixes (Jr., Sr., III, etc.)
    function removeSuffixesUnified(name) {
      if (!name) return '';
      return name
        .replace(/,?\s*(jr\.?|junior|sr\.?|senior|[iv]+|[1-5](?:st|nd|rd|th))$/i, '')
        .trim();
    }

    function normalizeNameUnified(name) {
      if (!name) return '';
      return normalizeAccentsUnified(removeSuffixesUnified(name))
        .toLowerCase()
        .replace(/[-_]/g, ' ')      // Hyphens and underscores to spaces
        .replace(/[''`]/g, '')      // Remove apostrophes (curly and straight)
        .replace(/\s+/g, ' ')       // Collapse multiple spaces
        .trim();
    }

    // Load headshots from Firebase teamsDatabase
    function loadFirebaseHeadshots() {
      db.ref('teamsDatabase/headshots').on('value', (snapshot) => {
        const data = snapshot.val() || {};
        firebaseHeadshots = {};
        firebaseHeadshotTeamKeys = {};

        // Helper to store both url and teamKey under the same key variants
        function storeEntry(lookupKey, url, teamKey) {
          firebaseHeadshots[lookupKey] = url;
          if (teamKey) firebaseHeadshotTeamKeys[lookupKey] = teamKey;
        }

        // Convert Firebase structure to simple name -> url map
        // Store multiple keys for each headshot to maximize matching
        for (const [key, value] of Object.entries(data)) {
          if (value && value.url) {
            const tk = value.teamKey || '';

            // 1. Store by Firebase key (underscores → spaces)
            const keyWithSpaces = key.toLowerCase().trim().replace(/_/g, ' ').replace(/\s+/g, ' ');
            storeEntry(keyWithSpaces, value.url, tk);

            // 2. Store by fully normalized key (handles accents, hyphens, etc.)
            const normalizedKey = normalizeNameUnified(key);
            storeEntry(normalizedKey, value.url, tk);

            // 3. Store by name field (original stored name)
            if (value.name) {
              const nameNormalized = normalizeNameUnified(value.name);
              storeEntry(nameNormalized, value.url, tk);

              // Also store just lowercased version (in case accents are already normalized)
              const nameLower = value.name.toLowerCase().trim().replace(/\s+/g, ' ');
              storeEntry(nameLower, value.url, tk);
            }

            // 4. Store stripped version (only letters and spaces - handles unknown chars)
            const strippedKey = normalizedKey.replace(/[^a-z\s]/g, '').replace(/\s+/g, ' ').trim();
            if (strippedKey && strippedKey.length > 2) {
              storeEntry(strippedKey, value.url, tk);
            }

            // 5. Handle 3+ part names - store variants for reverse lookup
            // e.g., "benjamin thurlow lam" also stored as "benjamin lam", "benjamin t lam"
            const parts = normalizedKey.split(' ').filter(Boolean);
            if (parts.length >= 3) {
              // First + Last only (skip middle name)
              const firstLast = `${parts[0]} ${parts[parts.length - 1]}`;
              storeEntry(firstLast, value.url, tk);

              // First + Middle initial + Last
              const firstInitialLast = `${parts[0]} ${parts[1][0]} ${parts[parts.length - 1]}`;
              storeEntry(firstInitialLast, value.url, tk);

              // For 4+ parts, first two + last
              if (parts.length >= 4) {

                storeEntry(firstTwoLast, value.url, tk);
              }
            }

        headshotsLoaded = true;
        console.log(`Loaded ${Object.keys(firebaseHeadshots).length} headshot entries from Firebase`);

    // Get team logo - checks Firebase first, then falls back to API logo

    function getTeamLogoUrl(teamName, apiLogo) {

      const withoutGender = normalized

      if (firebaseTeamLogos[withoutGender]) return firebaseTeamLogos[withoutGender];
      if (firebaseTeamLogos[`${withoutGender}-mens`]) return firebaseTeamLogos[`${withoutGender}-mens`];
      if (firebaseTeamLogos[`${withoutGender}-womens`]) return firebaseTeamLogos[`${withoutGender}-womens`];

      // Try with spaces replaced by dashes
      const dashed = withoutGender.replace(/ /g, '-');
      if (firebaseTeamLogos[dashed]) return firebaseTeamLogos[dashed];
      if (firebaseTeamLogos[`${dashed}-mens`]) return firebaseTeamLogos[`${dashed}-mens`];
      if (firebaseTeamLogos[`${dashed}-womens`]) return firebaseTeamLogos[`${dashed}-womens`];

      // Search through all keys for partial matches
      for (const [key, logoUrl] of Object.entries(firebaseTeamLogos)) {
        if (key.includes(withoutGender) || withoutGender.includes(key.replace(/-mens$/, '').replace(/-womens$/, ''))) {

      // Fall back to API logo if Firebase has nothing
      if (apiLogo && !apiLogo.includes('via.placeholder.com')) return apiLogo;

      console.log(`No logo found for team: "${teamName}" (normalized: "${normalized}", withoutGender: "${withoutGender}")`);
      return '';
    }

    /**

     * Returns meet logo when theme is active, otherwise team logo
     * @param {string} teamName - Team name
     * @param {string} apiLogo - Logo URL from API
     * @returns {string} Logo URL (meet logo or team logo)
     */
    function getEventLevelLogo(teamName, apiLogo) {
      // Check for meet logo (set by theme-loader)
      const meetLogo = document.body.getAttribute('data-meet-logo');
      if (meetLogo) {
        return meetLogo;
      }
      // Fall back to team logo
      return getTeamLogoUrl(teamName, apiLogo);
    }

    /**
     * Build HTML for stream logos section
     * Single logo: returns <img> element
     * Dual logos: returns Logo1 VS Logo2 layout
     * 3+ logos: returns row of logos
     */
    function getTeamCountFromCompType(compType) {
      if (!compType) return 7;
      const ct = compType.toLowerCase();
      if (ct.includes('dual')) return 2;
      if (ct.includes('tri')) return 3;
      if (ct.includes('quad')) return 4;
      if (ct.includes('-5') || ct.includes('5-team')) return 5;
      if (ct.includes('-6') || ct.includes('6-team')) return 6;
      if (ct.includes('-7') || ct.includes('7-team')) return 7;
      return 7;
    }

    function buildStreamLogosHtml(data) {
      // Collect team logos only for teams within the competition's team count
      const maxTeams = getTeamCountFromCompType(data.compType);
      const logos = [];
      for (let i = 1; i <= maxTeams; i++) {
        const teamName = data[`team${i}Name`];
        if (!teamName) continue;
        const teamLogo = data[`team${i}Logo`];
        const logoUrl = getTeamLogoUrl(teamName, teamLogo);
        if (logoUrl) logos.push(logoUrl);
      }

      if (logos.length === 0) {
        return '';
      } else if (logos.length === 1) {
        // Single logo (backwards compat)
        return `<img class="stream-logo" src="${logos[0]}" alt="Team">`;
      } else if (logos.length === 2) {
        // Dual logos with VS
        return `
          <div class="stream-logos-container dual">
            <img class="stream-team-logo" src="${logos[0]}" alt="Team 1">
            <span class="stream-vs-text">VS</span>
            <img class="stream-team-logo" src="${logos[1]}" alt="Team 2">
          </div>
        `;
      } else {
        // 3+ logos in a row
        const sizeClass = logos.length >= 5 ? 'many' : 'multi';
        const logoImgs = logos.map((url, idx) =>
          `<img class="stream-team-logo" src="${url}" alt="Team ${idx + 1}">`
        ).join('');
        return `<div class="stream-logos-container ${sizeClass}">${logoImgs}</div>`;
      }
    }

    /**
     * Get the stat display configuration for a team-stats graphic (Phase 7B.3)
     * Reads from theme overrides: themes/{themeId}/overrides/{graphicId}/statDisplay
     * @param {string} graphicId - The graphic ID (team1-stats, team2-stats, etc.)
     * @returns {string} The stat display mode: 'avg-high' (default), 'nqs-high', 'avg-nqs', 'nqs-only', 'avg-only', 'high-only'
     */
    function getStatDisplayConfig(graphicId) {
      if (!window.__themeData?.overrides) return 'avg-high';

      // Check for override on specific graphic (team1-stats, team2-stats, etc.)
      const graphicOverrides = window.__themeData.overrides[graphicId];
      if (graphicOverrides?.statDisplay) {
        return graphicOverrides.statDisplay;
      }

      // Check for override on generic team-stats (applies to all team*-stats)
      const genericOverrides = window.__themeData.overrides['team-stats'];
      if (genericOverrides?.statDisplay) {
        return genericOverrides.statDisplay;
      }

      return 'avg-high'; // default
    }

    /**
     * Build stat items HTML based on stat display configuration (Phase 7B.3)
     * @param {string} graphicId - The graphic ID (team1-stats, team2-stats, etc.)
     * @param {object} stats - Object with avg, high, nqs values
     * @returns {string} HTML for stat items
     */
    function buildStatItemsHtml(graphicId, stats) {
      const display = getStatDisplayConfig(graphicId);
      const items = [];

      switch (display) {
        case 'nqs-high':
          items.push({ label: 'NQS', value: stats.nqs || '-' });
          items.push({ label: 'HIGH', value: stats.high || '-' });
          break;
        case 'avg-nqs':
          items.push({ label: 'AVG', value: stats.avg || '-' });
          items.push({ label: 'NQS', value: stats.nqs || '-' });
          break;
        case 'nqs-only':
          items.push({ label: 'NQS', value: stats.nqs || '-' });
          break;
        case 'avg-only':
          items.push({ label: 'AVG', value: stats.avg || '-' });
          break;
        case 'high-only':
          items.push({ label: 'HIGH', value: stats.high || '-' });
          break;
        case 'avg-high':
        default:
          items.push({ label: 'AVG', value: stats.avg || '-' });
          items.push({ label: 'HIGH', value: stats.high || '-' });
          break;
      }

      return items.map(item => `
        <div class="stat-item">
          <div class="stat-label">${item.label}</div>
          <div class="stat-value">${item.value}</div>
        </div>
      `).join('');
