<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Athlete Spotlight</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    .spotlight-card {
      position: absolute;
      bottom: var(--athlete-spotlight-as-bottom, 120px);
      left: var(--athlete-spotlight-as-left, 100px);
      animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-100px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .spotlight-header {
      background: var(--athlete-spotlight-header-bg, var(--meet-header-bg, #BFBFBF));
      padding: var(--athlete-spotlight-as-header-padding-v, 12px) var(--athlete-spotlight-as-header-padding-h, 30px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--athlete-spotlight-as-header-gap, 20px);
    }

    .spotlight-event {
      font-size: var(--athlete-spotlight-as-event-font-size, 36px);
      font-weight: var(--athlete-spotlight-as-event-font-weight, 900);
      font-family: var(--athlete-spotlight-as-event-font-family, 'Inter', sans-serif);
      color: var(--athlete-spotlight-header-text, var(--meet-header-text, #000));
      text-transform: var(--athlete-spotlight-as-event-text-transform, uppercase);
      letter-spacing: var(--athlete-spotlight-as-event-letter-spacing, -0.5px);
    }

    .spotlight-logo {
      width: var(--athlete-spotlight-as-logo-size, 50px);
      height: var(--athlete-spotlight-as-logo-size, 50px);
      object-fit: contain;
    }

    .spotlight-content {
      background: var(--athlete-spotlight-content-bg, var(--meet-content-bg, #000));
      padding: var(--athlete-spotlight-as-content-padding-v, 20px) var(--athlete-spotlight-as-content-padding-h, 30px);
      display: flex;
      gap: var(--athlete-spotlight-as-content-gap, 40px);
    }

    .athlete {
      display: flex;
      align-items: center;
      gap: var(--athlete-spotlight-as-athlete-gap, 16px);
    }

    .athlete-headshot {
      width: var(--athlete-spotlight-as-headshot-size, 100px);
      height: var(--athlete-spotlight-as-headshot-size, 100px);
      border-radius: var(--athlete-spotlight-as-headshot-radius, 50%);
      object-fit: cover;
      background: var(--athlete-spotlight-as-headshot-bg, #333);
      border: var(--athlete-spotlight-as-headshot-border, 3px) solid var(--athlete-spotlight-as-headshot-border-color, #fff);
    }

    .athlete-headshot.no-image {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 900;
      color: #666;
    }

    .athlete-info {
      display: flex;
      flex-direction: column;
      gap: var(--athlete-spotlight-as-info-gap, 2px);
    }

    .athlete-name {
      font-size: var(--athlete-spotlight-as-name-font-size, 24px);
      font-weight: var(--athlete-spotlight-as-name-font-weight, 800);
      font-family: var(--athlete-spotlight-as-name-font-family, 'Inter', sans-serif);
      color: var(--athlete-spotlight-overlay-text, var(--meet-overlay-text, #fff));
      text-transform: var(--athlete-spotlight-as-name-text-transform, uppercase);
      letter-spacing: var(--athlete-spotlight-as-name-letter-spacing, -0.5px);
      line-height: var(--athlete-spotlight-as-name-line-height, 1.1);
    }

    .athlete-details {
      font-size: var(--athlete-spotlight-as-details-font-size, 16px);
      font-weight: var(--athlete-spotlight-as-details-font-weight, 400);
      font-family: var(--athlete-spotlight-as-details-font-family, 'Inter', sans-serif);
      color: var(--athlete-spotlight-as-details-color, #aaa);
      text-transform: var(--athlete-spotlight-as-details-text-transform, uppercase);
      letter-spacing: var(--athlete-spotlight-as-details-letter-spacing, 0.5px);
    }

    .divider {
      width: var(--athlete-spotlight-as-divider-width, 2px);
      background: var(--athlete-spotlight-as-divider-color, #333);
      align-self: stretch;
    }
  </style>
</head>
<body>
  <div class="spotlight-card">
    <div class="spotlight-header">
      <div class="spotlight-event" id="event">FLOOR EXERCISE</div>
      <img id="logo" class="spotlight-logo" src="" alt="Team">
    </div>
    <div class="spotlight-content">
      <div class="athlete">
        <img id="athlete1Headshot" class="athlete-headshot" src="" alt="">
        <div class="athlete-info">
          <div class="athlete-name" id="athlete1Name">ATHLETE NAME</div>
          <div class="athlete-details" id="athlete1Details">Sr • City, ST</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="athlete">
        <img id="athlete2Headshot" class="athlete-headshot" src="" alt="">
        <div class="athlete-info">
          <div class="athlete-name" id="athlete2Name">ATHLETE NAME</div>
          <div class="athlete-details" id="athlete2Details">Sr • City, ST</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);

    // Header
    document.getElementById('event').textContent = (params.get('event') || 'FLOOR EXERCISE').toUpperCase();
    document.getElementById('logo').src = params.get('logo') || '';

    // Year mapping
    const yearMap = { '1': 'Fr', '2': 'So', '3': 'Jr', '4': 'Sr', '5': 'Gr' };

    // Helper to format details line
    function formatDetails(year, hometown) {
      const yearStr = yearMap[year] || year || '';
      const location = hometown ? hometown.split(',')[0].trim() : ''; // Just city
      if (yearStr && location) return `${yearStr} • ${location}`;
      if (yearStr) return yearStr;
      if (location) return location;
      return '';
    }

    // Helper to get initials for placeholder
    function getInitials(name) {
      if (!name) return '?';
      const parts = name.trim().split(' ');
      if (parts.length >= 2) {
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }
      return name[0].toUpperCase();
    }

    // Athlete 1
    const a1Name = params.get('athlete1Name') || '';
    const a1Headshot = params.get('athlete1Headshot') || '';
    const a1Year = params.get('athlete1Year') || '';
    const a1Hometown = params.get('athlete1Hometown') || '';

    document.getElementById('athlete1Name').textContent = a1Name.toUpperCase();
    document.getElementById('athlete1Details').textContent = formatDetails(a1Year, a1Hometown);

    const img1 = document.getElementById('athlete1Headshot');
    if (a1Headshot) {
      img1.src = a1Headshot;
      img1.onerror = () => {
        img1.style.display = 'none';
        const placeholder = document.createElement('div');
        placeholder.className = 'athlete-headshot no-image';
        placeholder.textContent = getInitials(a1Name);
        img1.parentNode.insertBefore(placeholder, img1);
      };
    } else {
      img1.style.display = 'none';
      const placeholder = document.createElement('div');
      placeholder.className = 'athlete-headshot no-image';
      placeholder.textContent = getInitials(a1Name);
      img1.parentNode.insertBefore(placeholder, img1);
    }

    // Athlete 2
    const a2Name = params.get('athlete2Name') || '';
    const a2Headshot = params.get('athlete2Headshot') || '';
    const a2Year = params.get('athlete2Year') || '';
    const a2Hometown = params.get('athlete2Hometown') || '';

    document.getElementById('athlete2Name').textContent = a2Name.toUpperCase();
    document.getElementById('athlete2Details').textContent = formatDetails(a2Year, a2Hometown);

    const img2 = document.getElementById('athlete2Headshot');
    if (a2Headshot) {
      img2.src = a2Headshot;
      img2.onerror = () => {
        img2.style.display = 'none';
        const placeholder = document.createElement('div');
        placeholder.className = 'athlete-headshot no-image';
        placeholder.textContent = getInitials(a2Name);
        img2.parentNode.insertBefore(placeholder, img2);
      };
    } else {
      img2.style.display = 'none';
      const placeholder = document.createElement('div');
      placeholder.className = 'athlete-headshot no-image';
      placeholder.textContent = getInitials(a2Name);
      img2.parentNode.insertBefore(placeholder, img2);
    }
  </script>
  <script src="theme-loader.js?v=2"></script>
</body>
</html>
