<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: 'Inter', sans-serif;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background-color: var(--rotation-slate-auto-overlay-bg, var(--meet-overlay-bg, #E5E5E5));
      display: flex;
      flex-direction: row;
    }

    @keyframes slideRight {
      from { opacity: 0; transform: translateX(-60px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Auto-specific: pulse animation on rotation change */
    .rotation-number.changing {
      animation: pulseChange 0.4s ease;
    }

    @keyframes pulseChange {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Auto-specific: status label */
    .status-label {
      font-size: var(--rotation-slate-auto-status-label-font-size, 36px);
      font-weight: var(--rotation-slate-auto-status-label-font-weight, 600);
      font-family: var(--rotation-slate-auto-status-label-font-family, 'Inter', sans-serif);
      color: var(--rotation-slate-auto-overlay-text, var(--meet-overlay-text, #999));
      text-transform: var(--rotation-slate-auto-status-label-text-transform, uppercase);
      letter-spacing: 8px;
      margin-top: 30px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .status-label.visible {
      opacity: 1;
    }

    /* ========== CROSS-LAYOUT FONT OVERRIDES ========== */
    /* These apply to all 16 layouts via element class selectors */
    .meet-name {
      font-family: var(--rotation-slate-auto-meet-name-font-family, 'Inter', sans-serif);
    }
    .rotation-label {
      font-family: var(--rotation-slate-auto-rotation-label-font-family, 'Inter', sans-serif);
    }
    .rotation-number {
      font-family: var(--rotation-slate-auto-rotation-number-font-family, 'Inter', sans-serif);
      font-variant-numeric: tabular-nums;
    }
    .rotation-badge-label {
      font-family: var(--rotation-slate-auto-badge-label-font-family, 'Inter', sans-serif);
    }
    .rotation-badge-num {
      font-family: var(--rotation-slate-auto-badge-num-font-family, 'Inter', sans-serif);
      font-variant-numeric: tabular-nums;
    }

    /* ========== CLASSIC LAYOUT (default) ========== */
    .layout-classic {
      flex-direction: row;
    }

    .layout-classic .logo-section {
      flex: 0 0 700px;
      height: 100%;
      background: var(--rotation-slate-auto-header-bg, var(--meet-header-bg, #f0f0f0));
      display: flex;
      align-items: center;
      justify-content: center;
      animation: slideRight 0.5s cubic-bezier(0.16, 1, 0.3, 1);

    .layout-classic .team-logo {
      width: 500px;
      height: 500px;
      object-fit: contain;
    }

    .layout-classic .content-section {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 100px 120px;
      animation: fadeIn 0.6s ease-out 0.2s both;
    }

    .layout-classic .meet-name {
      font-size: 86px;
      font-weight: var(--rotation-slate-auto-meet-name-font-weight, 700);
      color: var(--rotation-slate-auto-overlay-text, var(--meet-overlay-text, #222));
      text-transform: var(--rotation-slate-auto-meet-name-text-transform, uppercase);
      letter-spacing: 3px;
      margin-bottom: 50px;
      line-height: 1.1;

      color: var(--rotation-slate-auto-overlay-text, var(--meet-overlay-text, #666));
      text-transform: var(--rotation-slate-auto-rotation-label-text-transform, uppercase);
      letter-spacing: 16px;
      margin-bottom: 10px;

    .layout-classic .rotation-number {
      font-size: 500px;
      font-weight: var(--rotation-slate-auto-rotation-number-font-weight, 900);
      color: var(--rotation-slate-auto-overlay-text, var(--meet-overlay-text, #111));
      line-height: 0.75;
      letter-spacing: -20px;
    }

    .layout-jumbo .rotation-number {

      color: var(--rotation-slate-auto-overlay-text, var(--meet-overlay-text, #111));

    /* ========== HERO LAYOUT ========== */
    .layout-hero {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .layout-hero .logo-section {

<body>
  <div class="logo-section">
    <img id="logo" class="team-logo" src="" alt="Team Logo">
  </div>
  <div class="content-section">
    <div id="meetName" class="meet-name">GYMNASTICS</div>
    <div class="divider"></div>
    <div class="rotation-label">Rotation</div>
    <div id="rotationNumber" class="rotation-number">-</div>
    <!-- Banner layout uses a badge instead of giant number -->
    <div class="rotation-badge">
      <div class="rotation-badge-label">Rotation</div>
      <div id="rotationBadgeNum" class="rotation-badge-num">-</div>
    </div>
    <div id="statusLabel" class="status-label"></div>
  </div>

  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCh0aZUvKl6Qvqsva3hvOgJJlleP1OwcTY",
      authDomain: "gymnastics-graphics.firebaseapp.com",
      databaseURL: "https://gymnastics-graphics-default-rtdb.firebaseio.com",
      projectId: "gymnastics-graphics",
      storageBucket: "gymnastics-graphics.firebasestorage.app",
      messagingSenderId: "702072609550",
      appId: "1:702072609550:web:ac74a811186d3ff45b955f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Parse URL parameters
    const params = new URLSearchParams(window.location.search);
    const compId = params.get('compId');
    const layout = params.get('layout') || 'classic';

    // Apply layout class to body
    document.body.classList.add('layout-' + layout);

    if (!compId) {
      console.error('Missing compId parameter');
      document.getElementById('rotationNumber').textContent = '?';
      document.getElementById('rotationBadgeNum').textContent = '?';
    }

    // State
    const state = {
      virtiusSessionId: null,
      gender: 'mens',
      teamCount: 0,
      totalRotations: 6,
      currentRotation: 0,
      isFinal: false,
      pollInterval: 45000,
      pollTimer: null
    };

    const rotationNumberEl = document.getElementById('rotationNumber');
    const rotationBadgeNumEl = document.getElementById('rotationBadgeNum');
    const statusLabelEl = document.getElementById('statusLabel');

    // Load competition config from Firebase
    async function loadCompetitionConfig() {
      try {
        const snapshot = await db.ref(`competitions/${compId}/config`).once('value');
        const config = snapshot.val();
        if (!config) {
          console.error('No competition config found for compId:', compId);
          return false;
        }

        state.virtiusSessionId = config.virtiusSessionId || null;
        state.gender = config.gender || 'mens';

        // Count teams
        let teamCount = 0;
        for (let i = 1; i <= 7; i++) {
          if (config[`team${i}Name`]) teamCount++;
        }
        state.teamCount = teamCount;

        // Set total rotations
        const eventCount = state.gender === 'womens' ? 4 : 6;
        state.totalRotations = Math.max(eventCount, teamCount);

        // Set logo (team1 logo)
        const logoEl = document.getElementById('logo');
        const logoUrl = config.team1Logo || '';
        if (logoUrl) {
          logoEl.src = logoUrl;
        } else {
          logoEl.style.display = 'none';
        }

        // Set meet name
        document.getElementById('meetName').textContent = config.eventName || 'GYMNASTICS';

        console.log('Config loaded:', {
          compId,
          virtiusSessionId: state.virtiusSessionId,
          gender: state.gender,
          teamCount: state.teamCount,
          totalRotations: state.totalRotations
        });

        return true;
      } catch (err) {
        console.error('Failed to load config:', err);
        return false;
      }
    }

    // Detect current rotation from Virtius API data
    function detectRotation(apiTeams) {
      if (!apiTeams || apiTeams.length === 0) return null;

      const totalRotations = state.totalRotations;

      // Check if API data includes rotation fields — if so, use them (most reliable)
      const hasRotationFields = apiTeams.some(team =>
        (team.events || []).some(event => event.rotation != null)
      );

      if (hasRotationFields) {
        return detectRotationFromApiFields(apiTeams, totalRotations);
      }

      // Fallback: count completed events (only used when API lacks rotation fields)
      let minCompleted = totalRotations;
      apiTeams.forEach((team) => {
        let completed = 0;
        (team.events || []).forEach((event) => {
          const gymnasts = event.gymnasts || [];
          const scored = gymnasts.filter(g => g.final_score != null && g.final_score !== '');
          if (scored.length === gymnasts.length && gymnasts.length > 0) {
            completed++;
          }
        });
        minCompleted = Math.min(minCompleted, completed);
      });

      if (minCompleted === totalRotations) {
        return { current: totalRotations, total: totalRotations, isFinal: true };
      }

      return { current: minCompleted + 1, total: totalRotations, isFinal: false };
    }

    function detectRotationFromApiFields(apiTeams, totalRotations) {
      let maxRotationWithScores = 0;
      let allEventsComplete = true;

      apiTeams.forEach((team) => {
        (team.events || []).forEach((event) => {
          const rotation = event.rotation;
          if (!rotation) return;
          const gymnasts = event.gymnasts || [];
          const scored = gymnasts.filter(g => g.final_score != null && g.final_score !== '');
          if (scored.length > 0) {
            maxRotationWithScores = Math.max(maxRotationWithScores, rotation);
          }
          if (scored.length < gymnasts.length) {
            allEventsComplete = false;
          }
        });
      });

      if (allEventsComplete && maxRotationWithScores > 0) {
        return { current: totalRotations, total: totalRotations, isFinal: true };
      }

      // Check if the highest scored rotation is fully complete for all teams
      // If so, advance to the next rotation
      if (maxRotationWithScores > 0 && maxRotationWithScores < totalRotations) {
        let highestRotationComplete = true;
        apiTeams.forEach((team) => {
          const eventInRotation = (team.events || []).find(e => e.rotation === maxRotationWithScores);
          if (eventInRotation) {
            const gymnasts = eventInRotation.gymnasts || [];
            const scored = gymnasts.filter(g => g.final_score != null && g.final_score !== '');
            if (scored.length < gymnasts.length || gymnasts.length === 0) {
              highestRotationComplete = false;
            }
          }
        });
        if (highestRotationComplete) {
          return { current: maxRotationWithScores + 1, total: totalRotations, isFinal: false };
        }
      }

      return { current: Math.max(1, maxRotationWithScores), total: totalRotations, isFinal: false };
    }

    // Update the displayed rotation number
    function updateDisplay(rotation) {
      if (!rotation) return;

      const changed = rotation.current !== state.currentRotation || rotation.isFinal !== state.isFinal;
      state.currentRotation = rotation.current;
      state.isFinal = rotation.isFinal;

      if (changed) {
        rotationNumberEl.classList.add('changing');
        setTimeout(() => rotationNumberEl.classList.remove('changing'), 400);
      }

      rotationNumberEl.textContent = rotation.current;
      rotationBadgeNumEl.textContent = rotation.current;

      if (rotation.isFinal) {
        statusLabelEl.textContent = 'Final';
        statusLabelEl.classList.add('visible');
      } else {
        statusLabelEl.classList.remove('visible');
      }
    }

    // Poll the Virtius API
    async function poll() {
      if (!state.virtiusSessionId) return;

      try {
        const response = await fetch(`https://api.virti.us/session/${state.virtiusSessionId}/json`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        const apiTeams = data?.meet?.teams || [];
        const rotation = detectRotation(apiTeams);
        if (rotation) {
          updateDisplay(rotation);

          // Stop polling once meet is final — no need to keep hitting Virtius
          if (rotation.isFinal && state.pollTimer) {
            clearInterval(state.pollTimer);
            state.pollTimer = null;
            console.log('Meet is final — polling stopped');
          }
        }
      } catch (err) {
        console.error('Poll error:', err);
      }
    }

    // Initialize
    async function init() {
      if (!compId) return;

      const loaded = await loadCompetitionConfig();
      if (!loaded) return;

      if (!state.virtiusSessionId) {
        rotationNumberEl.textContent = '-';
        rotationBadgeNumEl.textContent = '-';
        console.warn('No Virtius session ID - cannot auto-detect rotation');
        return;
      }

      // Initial poll
      await poll();

      // Start polling (only if not already final after first poll)
      if (!state.isFinal) {
        state.pollTimer = setInterval(poll, state.pollInterval);
      }
    }

    // Override with meet logo when theme is active
    function checkMeetLogo() {
      const meetLogo = document.body.getAttribute('data-meet-logo');
      if (meetLogo) {
        document.getElementById('logo').src = meetLogo;
        document.getElementById('logo').style.display = '';
      }
    }
    setTimeout(checkMeetLogo, 500);
    new MutationObserver(checkMeetLogo).observe(document.body, { attributes: true, attributeFilter: ['data-meet-logo'] });

    init();
  </script>
