<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Event Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    .card-container {
      position: absolute;
      top: var(--event-calendar-container-top, var(--meet-container-top, 50px));
      left: var(--event-calendar-container-left, var(--meet-container-left, 70px));
      right: var(--event-calendar-container-right, var(--meet-container-right, 70px));
      bottom: var(--event-calendar-container-bottom, var(--meet-container-bottom, 50px));
      display: flex;
      flex-direction: column;
      border-radius: var(--event-calendar-border-radius, var(--meet-border-radius, 12px));
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .header-bar {
      background: var(--event-calendar-header-bg, var(--meet-header-bg, #d4d4d8));
      padding: var(--event-calendar-header-padding-v, 18px) var(--event-calendar-header-padding-h, 40px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-title {
      font-size: var(--event-calendar-title-font-size, 42px);
      font-weight: var(--event-calendar-title-font-weight, 800);
      font-family: var(--event-calendar-title-font-family, 'Inter', sans-serif);
      color: var(--event-calendar-header-text, var(--meet-header-text, #000));
      text-transform: var(--event-calendar-title-text-transform, uppercase);
    }

    .header-logo {
      width: var(--event-calendar-logo-size, 80px);
      height: var(--event-calendar-logo-size, 80px);
      object-fit: contain;
    }

    .events-container {
      flex: 1;
      background: var(--event-calendar-overlay-bg, var(--meet-overlay-bg, #18181b));
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      padding: var(--event-calendar-content-padding-v, 30px) var(--event-calendar-content-padding-h, 80px);
      gap: 0;
    }

    .event-item {
      display: flex;
      flex-direction: column;
      padding: var(--event-calendar-item-padding, 12px) 0;
      border-bottom: 1px solid var(--event-calendar-border-color, var(--meet-border-color, rgba(255,255,255,0.08)));
      animation: fadeSlideIn var(--event-calendar-animation-duration, 0.5s) ease-out both;
    }

    .event-item:last-child {
      border-bottom: none;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(var(--event-calendar-animation-offset, 20px)); }
      to { opacity: 1; transform: translateY(0); }
    }

    .event-date {
      font-size: var(--event-calendar-date-font-size, 22px);
      font-weight: var(--event-calendar-date-font-weight, 800);
      font-family: var(--event-calendar-date-font-family, 'Inter', sans-serif);
      color: var(--event-calendar-accent-color, var(--meet-accent, #a78bfa));
      text-transform: var(--event-calendar-date-text-transform, uppercase);
      letter-spacing: 0.5px;
    }

    .event-name {
      font-size: var(--event-calendar-name-font-size, 32px);
      font-weight: var(--event-calendar-name-font-weight, 700);
      font-family: var(--event-calendar-name-font-family, 'Inter', sans-serif);
      color: var(--event-calendar-overlay-text, var(--meet-overlay-text, #fff));
      margin-top: var(--event-calendar-name-margin-top, 4px);
    }

    .event-location {
      font-size: var(--event-calendar-location-font-size, 20px);
      font-weight: var(--event-calendar-location-font-weight, 400);
      font-family: var(--event-calendar-location-font-family, 'Inter', sans-serif);
      color: var(--event-calendar-location-color, #a1a1aa);
      margin-top: var(--event-calendar-location-margin-top, 2px);
    }

    /* Size tiers based on event count - use CSS variable scaling */
    .tier-large .event-item {
      --event-calendar-item-padding: var(--event-calendar-tier-large-padding, 30px);
    }
    .tier-large .event-date {
      --event-calendar-date-font-size: var(--event-calendar-tier-large-date-size, 36px);
    }
    .tier-large .event-name {
      --event-calendar-name-font-size: var(--event-calendar-tier-large-name-size, 56px);
      --event-calendar-name-margin-top: var(--event-calendar-tier-large-name-margin, 8px);
    }
    .tier-large .event-location {
      --event-calendar-location-font-size: var(--event-calendar-tier-large-location-size, 32px);
      --event-calendar-location-margin-top: var(--event-calendar-tier-large-location-margin, 6px);
    }

    .tier-medium .event-item {
      --event-calendar-item-padding: var(--event-calendar-tier-medium-padding, 22px);
    }
    .tier-medium .event-date {
      --event-calendar-date-font-size: var(--event-calendar-tier-medium-date-size, 30px);
    }
    .tier-medium .event-name {
      --event-calendar-name-font-size: var(--event-calendar-tier-medium-name-size, 46px);
      --event-calendar-name-margin-top: var(--event-calendar-tier-medium-name-margin, 6px);
    }
    .tier-medium .event-location {
      --event-calendar-location-font-size: var(--event-calendar-tier-medium-location-size, 28px);
      --event-calendar-location-margin-top: var(--event-calendar-tier-medium-location-margin, 4px);
    }

    .tier-compact .event-item {
      --event-calendar-item-padding: var(--event-calendar-tier-compact-padding, 16px);
    }
    .tier-compact .event-date {
      --event-calendar-date-font-size: var(--event-calendar-tier-compact-date-size, 26px);
    }
    .tier-compact .event-name {
      --event-calendar-name-font-size: var(--event-calendar-tier-compact-name-size, 38px);
      --event-calendar-name-margin-top: var(--event-calendar-tier-compact-name-margin, 4px);
    }
    .tier-compact .event-location {
      --event-calendar-location-font-size: var(--event-calendar-tier-compact-location-size, 24px);
      --event-calendar-location-margin-top: var(--event-calendar-tier-compact-location-margin, 3px);
    }

    .tier-dense .event-item {
      --event-calendar-item-padding: var(--event-calendar-tier-dense-padding, 12px);
    }
    .tier-dense .event-date {
      --event-calendar-date-font-size: var(--event-calendar-tier-dense-date-size, 22px);
    }
    .tier-dense .event-name {
      --event-calendar-name-font-size: var(--event-calendar-tier-dense-name-size, 32px);
      --event-calendar-name-margin-top: var(--event-calendar-tier-dense-name-margin, 3px);
    }
    .tier-dense .event-location {
      --event-calendar-location-font-size: var(--event-calendar-tier-dense-location-size, 20px);
      --event-calendar-location-margin-top: var(--event-calendar-tier-dense-location-margin, 2px);
    }

    /* Two-column layout for 7+ events */
    .two-column {
      flex-direction: row;
      flex-wrap: wrap;
      align-content: space-evenly;
      gap: 0 var(--event-calendar-column-gap, 60px);
    }

    .two-column .event-item {
      width: calc(50% - var(--event-calendar-column-gap, 60px) / 2);
    }

    .no-events-message {
      font-size: var(--event-calendar-no-events-font-size, 36px);
      font-weight: var(--event-calendar-no-events-font-weight, 700);
      color: var(--event-calendar-no-events-color, #71717a);
      text-align: center;
      align-self: center;
    }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="header-bar">
      <div class="header-title" id="headerTitle">Event Calendar</div>
      <img id="headerLogo" class="header-logo" src="" alt="Logo">
    </div>
    <div class="events-container" id="eventsContainer"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const logoUrl = params.get('logo') || '';
    const title = params.get('title') || 'Event Calendar';
    const eventsParam = params.get('events') || '';
    const columns = params.get('columns') || 'auto';

    // Set header title
    document.getElementById('headerTitle').textContent = title;

    // Handle header logo
    const headerLogo = document.getElementById('headerLogo');
    if (logoUrl) {
      headerLogo.src = logoUrl;
      headerLogo.onerror = () => { headerLogo.style.display = 'none'; };
    } else {
      headerLogo.style.display = 'none';
    }

    // Override with meet logo when theme is active
    function checkMeetLogo() {
      const meetLogo = document.body.getAttribute('data-meet-logo');
      if (meetLogo) {
        headerLogo.src = meetLogo;
        headerLogo.style.display = '';
      }
    }
    setTimeout(checkMeetLogo, 500);
    new MutationObserver(checkMeetLogo).observe(document.body, {
      attributes: true,
      attributeFilter: ['data-meet-logo', 'data-meet-theme']
    });

    // Parse events
    let events = [];
    if (eventsParam) {
      try {
        events = JSON.parse(eventsParam);
        if (!Array.isArray(events)) events = [];
      } catch (e) {
        // Try pipe-separated fallback: "date~name~location|date~name~location"
        events = eventsParam.split('|').map(entry => {
          const parts = entry.split('~');
          return {
            date: (parts[0] || '').trim(),
            name: (parts[1] || '').trim(),
            location: (parts[2] || '').trim()
          };
        }).filter(e => e.date || e.name);
      }
    }

    const container = document.getElementById('eventsContainer');
    const count = events.length;

    if (count === 0) {
      container.innerHTML = '<div class="no-events-message">No events configured</div>';
    } else {
      // Determine size tier
      let tier;
      if (count <= 3) tier = 'tier-large';
      else if (count <= 5) tier = 'tier-medium';
      else if (count <= 7) tier = 'tier-compact';
      else tier = 'tier-dense';

      container.classList.add(tier);

      // Use two columns for 7+ events (or if forced)
      const useTwoColumns = columns === '2' || (columns === 'auto' && count >= 7);
      if (useTwoColumns) {
        container.classList.add('two-column');
      }

      // Render events
      events.forEach((event, i) => {
        const item = document.createElement('div');
        item.className = 'event-item';
        const staggerDelay = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--event-calendar-animation-stagger') || '0.08');
        item.style.animationDelay = `${i * staggerDelay}s`;

        const dateEl = document.createElement('div');
        dateEl.className = 'event-date';
        dateEl.textContent = event.date || '';

        const nameEl = document.createElement('div');
        nameEl.className = 'event-name';
        nameEl.textContent = event.name || '';

        item.appendChild(dateEl);
        item.appendChild(nameEl);

        if (event.location) {
          const locEl = document.createElement('div');
          locEl.className = 'event-location';
          locEl.textContent = event.location;
          item.appendChild(locEl);
        }

        container.appendChild(item);
      });
    }
  </script>
  <script src="theme-loader.js?v=2"></script>
</body>
</html>
