<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Thank You to Our Sponsors</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    .card-container {
      position: absolute;
      top: 50px;
      left: 70px;
      right: 70px;
      bottom: 50px;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .header-bar {
      background: #d4d4d8;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 42px;
      font-weight: 800;
      color: #000;
      text-transform: uppercase;
    }

    .header-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .sponsors-container {
      flex: 1;
      background: #18181b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .sponsors-grid {
      display: grid;
      gap: 30px;
      justify-items: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    /* Grid layouts based on sponsor count */
    .sponsors-grid.count-1 {
      grid-template-columns: 1fr;
    }

    .sponsors-grid.count-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .sponsors-grid.count-3,
    .sponsors-grid.count-4 {
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
    }

    .sponsors-grid.count-5,
    .sponsors-grid.count-6 {
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
    }

    .sponsors-grid.count-7,
    .sponsors-grid.count-8 {
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
    }

    .sponsor-item {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 20px;
      background: #27272a;
      border-radius: 12px;
    }

    .sponsor-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .sponsor-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .sponsor-fallback-text {
      font-size: 32px;
      font-weight: 700;
      color: #a1a1aa;
      text-align: center;
      word-wrap: break-word;
    }

    .no-sponsors-message {
      font-size: 36px;
      font-weight: 700;
      color: #71717a;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="header-bar">
      <div class="header-title">Thank You to Our Sponsors</div>
      <img id="headerLogo" class="header-logo" src="" alt="Team Logo">
    </div>
    <div class="sponsors-container">
      <div id="sponsorsGrid" class="sponsors-grid"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const logoUrl = params.get('logo') || '';
    const sponsorsParam = params.get('sponsors') || '';

    // Handle header logo
    const headerLogo = document.getElementById('headerLogo');
    if (logoUrl) {
      headerLogo.src = logoUrl;
      headerLogo.onerror = () => {
        headerLogo.style.display = 'none';
      };
    } else {
      headerLogo.style.display = 'none';
    }

    // Parse sponsors
    let sponsors = [];
    if (sponsorsParam) {
      try {
        sponsors = JSON.parse(sponsorsParam);
        if (!Array.isArray(sponsors)) {
          sponsors = [];
        }
      } catch (e) {
        sponsors = [];
      }
    }

    const grid = document.getElementById('sponsorsGrid');

    // Show message if no sponsors
    if (sponsors.length === 0) {
      grid.innerHTML = '<div class="no-sponsors-message">No sponsors configured</div>';
    } else {
      // Set grid class based on count (cap at 8)
      const count = Math.min(sponsors.length, 8);
      grid.classList.add(`count-${count}`);

      // Render sponsors (max 8)
      sponsors.slice(0, 8).forEach(sponsor => {
        const item = document.createElement('div');
        item.className = 'sponsor-item';

        const name = sponsor.name || 'Sponsor';
        const url = sponsor.url || '';

        if (url) {
          const img = document.createElement('img');
          img.className = 'sponsor-logo';
          img.src = url;
          img.alt = name;
          img.onerror = () => {
            // Replace broken image with fallback
            const fallback = document.createElement('div');
            fallback.className = 'sponsor-fallback';
            const fallbackText = document.createElement('div');
            fallbackText.className = 'sponsor-fallback-text';
            fallbackText.textContent = name;
            fallback.appendChild(fallbackText);
            img.replaceWith(fallback);
          };
          item.appendChild(img);
        } else {
          // No URL provided - show fallback
          const fallback = document.createElement('div');
          fallback.className = 'sponsor-fallback';
          const fallbackText = document.createElement('div');
          fallbackText.className = 'sponsor-fallback-text';
          fallbackText.textContent = name;
          fallback.appendChild(fallbackText);
          item.appendChild(fallback);
        }

        grid.appendChild(item);
      });
    }
  </script>
</body>
</html>
