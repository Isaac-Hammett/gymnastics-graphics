<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Thank You to Our Sponsors</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    .card-container {
      position: absolute;
      top: 50px;
      left: 70px;
      right: 70px;
      bottom: 50px;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .header-bar {
      background: #d4d4d8;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 42px;
      font-weight: 800;
      color: #000;
      text-transform: uppercase;
    }

    .header-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .sponsors-container {
      flex: 1;
      background: #18181b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .sponsors-grid {
      display: grid;
      gap: 60px;
      justify-content: center;
      align-content: center;
    }

    /* Grid layouts based on sponsor count */
    .sponsors-grid.count-1 {
      grid-template-columns: 700px;
      grid-template-rows: 500px;
    }

    .sponsors-grid.count-2 {
      grid-template-columns: repeat(2, 550px);
      grid-template-rows: 450px;
    }

    .sponsors-grid.count-3 {
      grid-template-columns: repeat(3, 450px);
      grid-template-rows: 400px;
    }

    .sponsors-grid.count-4 {
      grid-template-columns: repeat(2, 550px);
      grid-template-rows: repeat(2, 350px);
    }

    .sponsors-grid.count-5,
    .sponsors-grid.count-6 {
      grid-template-columns: repeat(3, 450px);
      grid-template-rows: repeat(2, 350px);
    }

    .sponsors-grid.count-7,
    .sponsors-grid.count-8 {
      grid-template-columns: repeat(4, 380px);
      grid-template-rows: repeat(2, 320px);
    }

    .sponsor-item {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 15px;
      background: transparent;
    }

    .sponsor-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .sponsor-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .sponsor-fallback-text {
      font-size: 32px;
      font-weight: 700;
      color: #a1a1aa;
      text-align: center;
      word-wrap: break-word;
    }

    .no-sponsors-message {
      font-size: 36px;
      font-weight: 700;
      color: #71717a;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="header-bar">
      <div class="header-title">Thank You to Our Sponsors</div>
      <img id="headerLogo" class="header-logo" src="" alt="Team Logo">
    </div>
    <div class="sponsors-container">
      <div id="sponsorsGrid" class="sponsors-grid"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const logoUrl = params.get('logo') || '';
    const sponsorsParam = params.get('sponsors') || '';

    // Handle header logo
    const headerLogo = document.getElementById('headerLogo');
    if (logoUrl) {
      headerLogo.src = logoUrl;
      headerLogo.onerror = () => {
        headerLogo.style.display = 'none';
      };
    } else {
      headerLogo.style.display = 'none';
    }

    // Parse sponsors
    let sponsors = [];
    if (sponsorsParam) {
      try {
        sponsors = JSON.parse(sponsorsParam);
        if (!Array.isArray(sponsors)) {
          sponsors = [];
        }
      } catch (e) {
        sponsors = [];
      }
    }

    const grid = document.getElementById('sponsorsGrid');
    const container = document.querySelector('.sponsors-container');

    // Analyze image colors using canvas
    function getImageColors(img) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const size = 50; // Sample at small size for performance
        canvas.width = size;
        canvas.height = size;

        try {
          ctx.drawImage(img, 0, 0, size, size);
          const imageData = ctx.getImageData(0, 0, size, size);
          const data = imageData.data;

          let r = 0, g = 0, b = 0, count = 0;

          // Sample pixels, skip transparent ones
          for (let i = 0; i < data.length; i += 4) {
            const alpha = data[i + 3];
            if (alpha > 128) { // Only count non-transparent pixels
              r += data[i];
              g += data[i + 1];
              b += data[i + 2];
              count++;
            }
          }

          if (count > 0) {
            resolve({ r: r / count, g: g / count, b: b / count });
          } else {
            resolve(null);
          }
        } catch (e) {
          resolve(null);
        }
      });
    }

    // Calculate contrasting background color
    function getContrastingBackground(colors) {
      if (colors.length === 0) {
        return '#18181b'; // Default dark
      }

      // Average all logo colors
      let avgR = 0, avgG = 0, avgB = 0;
      colors.forEach(c => {
        avgR += c.r;
        avgG += c.g;
        avgB += c.b;
      });
      avgR /= colors.length;
      avgG /= colors.length;
      avgB /= colors.length;

      // Calculate luminance
      const luminance = (0.299 * avgR + 0.587 * avgG + 0.114 * avgB) / 255;

      // Pick background based on luminance
      if (luminance > 0.6) {
        // Logos are light - use dark background with subtle tint
        const tintStrength = 0.15;
        const baseR = 24, baseG = 24, baseB = 27; // #18181b
        const r = Math.round(baseR + (avgR - 128) * tintStrength * 0.3);
        const g = Math.round(baseG + (avgG - 128) * tintStrength * 0.3);
        const b = Math.round(baseB + (avgB - 128) * tintStrength * 0.3);
        return `rgb(${Math.max(15, Math.min(40, r))}, ${Math.max(15, Math.min(40, g))}, ${Math.max(15, Math.min(45, b))})`;
      } else if (luminance < 0.35) {
        // Logos are dark - use light background with subtle tint
        const tintStrength = 0.2;
        const baseR = 229, baseG = 229, baseB = 229; // #e5e5e5
        const r = Math.round(baseR + (avgR - 128) * tintStrength * 0.2);
        const g = Math.round(baseG + (avgG - 128) * tintStrength * 0.2);
        const b = Math.round(baseB + (avgB - 128) * tintStrength * 0.2);
        return `rgb(${Math.max(210, Math.min(245, r))}, ${Math.max(210, Math.min(245, g))}, ${Math.max(210, Math.min(245, b))})`;
      } else {
        // Mid-range - use a neutral medium grey
        return '#52525b';
      }
    }

    // Show message if no sponsors
    if (sponsors.length === 0) {
      grid.innerHTML = '<div class="no-sponsors-message">No sponsors configured</div>';
    } else {
      // Set grid class based on count (cap at 8)
      const count = Math.min(sponsors.length, 8);
      grid.classList.add(`count-${count}`);

      const loadedImages = [];
      let loadCount = 0;
      const totalLogos = sponsors.slice(0, 8).filter(s => s.url).length;

      // Function to update background after analyzing logos
      async function updateBackground() {
        const colors = [];
        for (const img of loadedImages) {
          const color = await getImageColors(img);
          if (color) colors.push(color);
        }
        const bgColor = getContrastingBackground(colors);
        container.style.background = bgColor;

        // Also update fallback text color based on background luminance
        const bgLum = parseInt(bgColor.match(/\d+/g)?.[0] || 24);
        const textColor = bgLum > 100 ? '#3f3f46' : '#a1a1aa';
        document.querySelectorAll('.sponsor-fallback-text').forEach(el => {
          el.style.color = textColor;
        });
        document.querySelectorAll('.no-sponsors-message').forEach(el => {
          el.style.color = textColor;
        });
      }

      // Render sponsors (max 8)
      sponsors.slice(0, 8).forEach(sponsor => {
        const item = document.createElement('div');
        item.className = 'sponsor-item';

        const name = sponsor.name || 'Sponsor';
        const url = sponsor.url || '';

        if (url) {
          const img = document.createElement('img');
          img.className = 'sponsor-logo';
          img.crossOrigin = 'anonymous'; // Enable CORS for canvas analysis
          img.src = url;
          img.alt = name;

          img.onload = () => {
            loadedImages.push(img);
            loadCount++;
            if (loadCount >= totalLogos) {
              updateBackground();
            }
          };

          img.onerror = () => {
            loadCount++;
            // Replace broken image with fallback
            const fallback = document.createElement('div');
            fallback.className = 'sponsor-fallback';
            const fallbackText = document.createElement('div');
            fallbackText.className = 'sponsor-fallback-text';
            fallbackText.textContent = name;
            fallback.appendChild(fallbackText);
            img.replaceWith(fallback);
            if (loadCount >= totalLogos) {
              updateBackground();
            }
          };
          item.appendChild(img);
        } else {
          // No URL provided - show fallback
          const fallback = document.createElement('div');
          fallback.className = 'sponsor-fallback';
          const fallbackText = document.createElement('div');
          fallbackText.className = 'sponsor-fallback-text';
          fallbackText.textContent = name;
          fallback.appendChild(fallbackText);
          item.appendChild(fallback);
        }

        grid.appendChild(item);
      });

      // If no logos to load, keep default background
      if (totalLogos === 0) {
        updateBackground();
      }
    }
  </script>
  <script src="theme-loader.js"></script>
</body>
</html>
