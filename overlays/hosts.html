<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Hosts</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    .hosts-card {
      position: absolute;
      bottom: var(--hosts-hosts-bottom, 120px);
      left: var(--hosts-hosts-left, 100px);
      animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-100px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .hosts-header {
      background: var(--hosts-header-bg, var(--meet-header-bg, #BFBFBF));
      padding: var(--hosts-hosts-header-padding-v, 12px) var(--hosts-hosts-header-padding-h, 40px);
      min-width: var(--hosts-hosts-min-width, 400px);
    }

    .hosts-title {
      font-size: var(--hosts-hosts-title-font-size, 40px);
      font-weight: var(--hosts-hosts-title-font-weight, 900);
      font-family: var(--hosts-hosts-title-font-family, 'Inter', sans-serif);
      color: var(--hosts-header-text, var(--meet-header-text, #000));
      text-transform: var(--hosts-hosts-title-text-transform, uppercase);
      letter-spacing: var(--hosts-hosts-title-letter-spacing, -0.5px);
    }

    .hosts-content {
      background: var(--hosts-content-bg, var(--meet-content-bg, #000));
      padding: var(--hosts-hosts-content-padding-v, 16px) var(--hosts-hosts-content-padding-h, 40px);
      min-width: var(--hosts-hosts-min-width, 400px);
    }

    .hosts-name {
      font-size: var(--hosts-hosts-name-font-size, 30px);
      font-weight: var(--hosts-hosts-name-font-weight, 700);
      font-family: var(--hosts-hosts-name-font-family, 'Inter', sans-serif);
      color: var(--hosts-overlay-text, var(--meet-overlay-text, #fff));
      line-height: var(--hosts-hosts-name-line-height, 1.4);
      text-transform: var(--hosts-hosts-name-text-transform, uppercase);
      letter-spacing: var(--hosts-hosts-name-letter-spacing, -0.5px);
    }
  </style>
</head>
<body>
  <div class="hosts-card">
    <div class="hosts-header">
      <div class="hosts-title">HOSTS</div>
    </div>
    <div class="hosts-content" id="hostsList">
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const hosts = params.get('hosts') || '';
    const hostsList = document.getElementById('hostsList');

    // Handle both pipe-separated and newline-separated hosts
    const hostArray = hosts.includes('|') ? hosts.split('|') : hosts.split('\n');

    hostArray.forEach(host => {
      if (host.trim()) {
        const div = document.createElement('div');
        div.className = 'hosts-name';
        div.textContent = host.trim().toUpperCase();
        hostsList.appendChild(div);
      }
    });
  </script>
  <script src="theme-loader.js?v=2"></script>
</body>
</html>
