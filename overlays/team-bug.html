<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Team Score Bug</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    /* Score bug container - positioned on right side of screen */
    .score-bug {
      position: absolute;
      top: 50%;
      right: 0;
      transform: translateY(-50%) translateX(100%);
      display: flex;
      flex-direction: column;
      min-width: 500px;
      opacity: 0;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .score-bug.visible {
      transform: translateY(-50%) translateX(0);
      opacity: 1;
    }

    /* Rotation tag at top */
    .rotation-tag {
      background: #27272a;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      padding: 10px 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Team rows container */
    .team-rows {
      display: flex;
      flex-direction: column;
    }

    /* Individual team row */
    .team-row {
      display: flex;
      flex-direction: row;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      min-height: 70px;
    }

    .team-row:last-child {
      border-bottom: none;
    }

    /* Multi-team scaling: 3 teams - slightly compact */
    .teams-3 .team-row {
      min-height: 65px;
    }

    /* Multi-team scaling: 4 teams - compact */
    .teams-4 .team-row {
      min-height: 60px;
    }
    .teams-4 .team-logo {
      width: 36px;
      height: 36px;
    }
    .teams-4 .team-total {
      font-size: 20px;
    }
    .teams-4 .slot-headshot {
      width: 32px;
      height: 32px;
    }
    .teams-4 .slot-name {
      font-size: 22px;
    }
    .teams-4 .slot-score {
      font-size: 26px;
    }

    /* Multi-team scaling: 5 teams - more compact */
    .teams-5 .team-row {
      min-height: 55px;
    }
    .teams-5 .team-fixed {
      padding: 8px 12px;
      min-width: 90px;
    }
    .teams-5 .team-logo {
      width: 32px;
      height: 32px;
    }
    .teams-5 .team-total {
      font-size: 18px;
      margin-top: 2px;
    }
    .teams-5 .slot-headshot {
      width: 28px;
      height: 28px;
    }
    .teams-5 .slot-name {
      font-size: 20px;
    }
    .teams-5 .slot-score {
      font-size: 24px;
    }
    .teams-5 .slot-apparatus {
      font-size: 16px;
    }
    .teams-5 .team-slot {
      padding: 8px 16px;
    }

    /* Multi-team scaling: 6 teams - most compact */
    .teams-6 .team-row {
      min-height: 50px;
    }
    .teams-6 .team-fixed {
      padding: 6px 10px;
      min-width: 85px;
    }
    .teams-6 .team-logo {
      width: 28px;
      height: 28px;
    }
    .teams-6 .team-total {
      font-size: 16px;
      margin-top: 2px;
    }
    .teams-6 .slot-headshot {
      width: 24px;
      height: 24px;
    }
    .teams-6 .slot-name {
      font-size: 18px;
    }
    .teams-6 .slot-score {
      font-size: 22px;
    }
    .teams-6 .slot-apparatus {
      font-size: 14px;
    }
    .teams-6 .slot-sv {
      font-size: 14px;
    }
    .teams-6 .team-slot {
      padding: 6px 14px;
    }
    .teams-6 .rotation-tag {
      font-size: 18px;
      padding: 8px 16px;
    }

    /* Fixed left section: logo + total */
    .team-fixed {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 15px;
      min-width: 100px;
      background: #000;
    }

    .team-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .team-total {
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      margin-top: 4px;
    }

    .team-total.highlight {
      animation: totalPulse 0.5s ease;
    }

    @keyframes totalPulse {
      0%, 100% { transform: scale(1); color: #fff; }
      50% { transform: scale(1.1); color: #22d3ee; }
    }

    /* Slot area for score flash / now competing */
    .team-slot {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 10px 20px;
      overflow: hidden;
      position: relative;
    }

    /* Slot content (animates up/down) */
    .slot-content {
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateY(0);
      transition: transform 0.4s ease, opacity 0.4s ease;
      opacity: 0;
    }

    .slot-content.visible {
      opacity: 1;
    }

    .slot-content.exit-up {
      transform: translateY(-100%);
      opacity: 0;
    }

    .slot-content.enter-from-below {
      transform: translateY(100%);
      opacity: 0;
    }

    /* Slot machine animation - new content spins up from below */
    @keyframes slotSpinIn {
      0% {
        transform: translateY(100%);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Slot machine animation - old content spins up and out */
    @keyframes slotSpinOut {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      80% {
        opacity: 0;
      }
      100% {
        transform: translateY(-100%);
        opacity: 0;
      }
    }

    .slot-content.spin-in {
      animation: slotSpinIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .slot-content.spin-out {
      animation: slotSpinOut 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Headshot in slot */
    .slot-headshot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    /* Athlete name in slot */
    .slot-name {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
    }

    /* Score in slot */
    .slot-score {
      font-size: 28px;
      font-weight: 900;
      color: #fff;
    }

    /* Apparatus code */
    .slot-apparatus {
      font-size: 18px;
      font-weight: 600;
      color: #a1a1aa;
      text-transform: uppercase;
    }

    /* Start value */
    .slot-sv {
      font-size: 16px;
      font-weight: 400;
      color: #71717a;
    }

    /* Stick indicator */
    .slot-stick {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #22c55e;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Separator dot */
    .slot-separator {
      color: #52525b;
      font-size: 20px;
    }

    /* Correction indicator (score was changed) */
    .slot-correction {
      font-size: 14px;
      font-weight: 500;
      color: #f59e0b;
      font-style: italic;
    }

    /* Stick indicator (bonus landing - men's only) */
    .slot-stick {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 4px rgba(16, 185, 129, 0.3);
    }

    /* Lineup card (above bug) */
    .lineup-card {
      position: absolute;
      bottom: 100%;
      right: 0;
      width: 100%;
      background: #1a1a1a;
      transform: translateY(100%);
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.4s ease;
      margin-bottom: 8px;
    }

    .lineup-card.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .lineup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #27272a;
    }

    .lineup-team-name {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
    }

    .lineup-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .lineup-athletes {
      padding: 8px 0;
    }

    .lineup-athlete {
      display: flex;
      align-items: center;
      padding: 8px 20px;
      gap: 12px;
    }

    .lineup-order {
      font-size: 16px;
      font-weight: 600;
      color: #71717a;
      min-width: 24px;
    }

    .lineup-name {
      flex: 1;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
    }

    .lineup-sv {
      font-size: 16px;
      font-weight: 400;
      color: #71717a;
      min-width: 40px;
      text-align: right;
    }

    .lineup-score {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      min-width: 70px;
      text-align: right;
    }

    .lineup-score.pending {
      color: #52525b;
    }

    .lineup-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #27272a;
    }

    .lineup-event {
      font-size: 18px;
      font-weight: 600;
      color: #a1a1aa;
      text-transform: uppercase;
    }

    .lineup-total {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
    }

    /* Loading / error states */
    .loading-state {
      color: #71717a;
      font-size: 18px;
      padding: 20px;
      text-align: center;
    }

    .error-state {
      color: #ef4444;
      font-size: 18px;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="score-bug" id="scoreBug">
    <div class="lineup-card" id="lineupCard">
      <!-- Lineup card content populated dynamically -->
    </div>
    <div class="rotation-tag" id="rotationTag">Rotation 1 of 6</div>
    <div class="team-rows" id="teamRows">
      <!-- Team rows populated dynamically -->
    </div>
  </div>

  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCh0aZUvKl6Qvqsva3hvOgJJlleP1OwcTY",
      authDomain: "gymnastics-graphics.firebaseapp.com",
      databaseURL: "https://gymnastics-graphics-default-rtdb.firebaseio.com",
      projectId: "gymnastics-graphics",
      storageBucket: "gymnastics-graphics.firebasestorage.app",
      messagingSenderId: "702072609550",
      appId: "1:702072609550:web:ac74a811186d3ff45b955f"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Parse URL parameters
    const params = new URLSearchParams(window.location.search);
    const compId = params.get('compId');

    if (!compId) {
      console.error('Missing compId parameter');
      document.body.innerHTML = '<div class="error-state">Missing compId parameter</div>';
    }

    // State management
    const state = {
      enabled: false,
      polling: false,
      automationMode: 'auto',
      showLineup: null,
      teams: [],
      rotation: { current: 1, total: 6, isFinal: false },
      previousScores: {},        // { "gymnast_id": "finalScore" (string) }
      previousTeamTotals: {},    // { "teamKey": "finalScore" (string) }
      flashQueues: {},           // Per-team flash queues
      activeFlashes: {},         // Currently active flashes per team
      nowCompeting: [],          // Currently competing athletes per team (B1)
      manualNowCompeting: {},    // Manual overrides from producer { teamIndex: true/false } (B4/B7)
      pollInterval: 5000,
      flashDuration: 10000,
      stalePollCount: 0,         // Consecutive polls with no data changes
      // Competition config (loaded from Firebase)
      competitionConfig: null,
      virtiusSessionId: null,
      gender: 'mens',
      // Error handling state (A3c)
      consecutiveErrors: 0,      // Count of consecutive poll failures
      lastError: null,           // Last error message
      lastErrorTime: null,       // Timestamp of last error
      maxBackoffMs: 60000,       // Max backoff delay (60 seconds)
      // Offline/reconnect state (A3d)
      firebaseConnected: true,   // Firebase connection state
      pendingWrites: [],         // Writes queued during offline
      reconnectAttempts: 0       // Count of reconnect attempts
    };

    // Headshot storage (E1)
    let firebaseHeadshots = {};
    let headshotsLoaded = false;

    /**
     * Normalize accented characters to ASCII equivalents (E1).
     * Handles German/Swedish umlauts, French/Spanish/Portuguese accents, ligatures.
     */
    function normalizeAccentsUnified(str) {
      if (!str) return '';
      return str
        // German/Swedish umlauts - convert to two-letter equivalents
        .replace(/ö/g, 'oe').replace(/Ö/g, 'oe')
        .replace(/ä/g, 'ae').replace(/Ä/g, 'ae')
        .replace(/ü/g, 'ue').replace(/Ü/g, 'ue')
        .replace(/ß/g, 'ss')
        // French/Spanish/Portuguese accents - convert to base letter
        .replace(/[éèêë]/g, 'e').replace(/[ÉÈÊË]/g, 'e')
        .replace(/[áàâãå]/g, 'a').replace(/[ÁÀÂÃÅ]/g, 'a')
        .replace(/[íìîï]/g, 'i').replace(/[ÍÌÎÏ]/g, 'i')
        .replace(/[óòôõø]/g, 'o').replace(/[ÓÒÔÕØ]/g, 'o')
        .replace(/[úùûü]/g, 'u').replace(/[ÚÙÛÜ]/g, 'u')
        .replace(/ñ/g, 'n').replace(/Ñ/g, 'n')
        .replace(/ç/g, 'c').replace(/Ç/g, 'c')
        .replace(/ÿ/g, 'y').replace(/Ÿ/g, 'y')
        // Ligatures
        .replace(/æ/g, 'ae').replace(/Æ/g, 'ae')
        .replace(/œ/g, 'oe').replace(/Œ/g, 'oe');
    }

    /**
     * Remove common name suffixes (Jr., Sr., III, etc.) (E1).
     */
    function removeSuffixesUnified(name) {
      if (!name) return '';
      return name
        .replace(/,?\s*(jr\.?|junior|sr\.?|senior|[iv]+|[1-5](?:st|nd|rd|th))$/i, '')
        .trim();
    }

    /**
     * Unified name normalization (E1).
     * Handles accents, suffixes, hyphens, apostrophes.
     */
    function normalizeNameUnified(name) {
      if (!name) return '';
      return normalizeAccentsUnified(removeSuffixesUnified(name))
        .toLowerCase()
        .replace(/[-_]/g, ' ')      // Hyphens and underscores to spaces
        .replace(/[''`]/g, '')      // Remove apostrophes (curly and straight)
        .replace(/\s+/g, ' ')       // Collapse multiple spaces
        .trim();
    }

    /**
     * Load headshots from Firebase teamsDatabase (E1).
     * Creates multiple lookup keys for each headshot to maximize matching.
     */
    function loadFirebaseHeadshots() {
      db.ref('teamsDatabase/headshots').on('value', (snapshot) => {
        const data = snapshot.val() || {};
        firebaseHeadshots = {};

        // Convert Firebase structure to simple name -> url map
        // Store multiple keys for each headshot to maximize matching
        for (const [key, value] of Object.entries(data)) {
          if (value && value.url) {
            // 1. Store by Firebase key (underscores → spaces)
            const keyWithSpaces = key.toLowerCase().trim().replace(/_/g, ' ').replace(/\s+/g, ' ');
            firebaseHeadshots[keyWithSpaces] = value.url;

            // 2. Store by fully normalized key (handles accents, hyphens, etc.)
            const normalizedKey = normalizeNameUnified(key);
            firebaseHeadshots[normalizedKey] = value.url;

            // 3. Store by name field (original stored name)
            if (value.name) {
              const nameNormalized = normalizeNameUnified(value.name);
              firebaseHeadshots[nameNormalized] = value.url;

              // Also store just lowercased version (in case accents are already normalized)
              const nameLower = value.name.toLowerCase().trim().replace(/\s+/g, ' ');
              firebaseHeadshots[nameLower] = value.url;
            }

            // 4. Store stripped version (only letters and spaces - handles unknown chars)
            const strippedKey = normalizedKey.replace(/[^a-z\s]/g, '').replace(/\s+/g, ' ').trim();
            if (strippedKey && strippedKey.length > 2) {
              firebaseHeadshots[strippedKey] = value.url;
            }

            // 5. Handle 3+ part names - store variants for reverse lookup
            // e.g., "benjamin thurlow lam" also stored as "benjamin lam", "benjamin t lam"
            const parts = normalizedKey.split(' ').filter(Boolean);
            if (parts.length >= 3) {
              // First + Last only (skip middle name)
              const firstLast = `${parts[0]} ${parts[parts.length - 1]}`;
              firebaseHeadshots[firstLast] = value.url;

              // First + Middle initial + Last
              const firstInitialLast = `${parts[0]} ${parts[1][0]} ${parts[parts.length - 1]}`;
              firebaseHeadshots[firstInitialLast] = value.url;

              // For 4+ parts, first two + last
              if (parts.length >= 4) {
                const firstTwoLast = `${parts[0]} ${parts[1]} ${parts[parts.length - 1]}`;
                firebaseHeadshots[firstTwoLast] = value.url;
              }
            }
          }
        }
        headshotsLoaded = true;
        console.log(`Loaded ${Object.keys(firebaseHeadshots).length} headshot entries from Firebase`);
      });
    }

    /**
     * Get athlete headshot URL (E1).
     * Handles 3+ part names, accented characters, and various name formats.
     * Falls back to API headshot if no Firebase match found.
     */
    function getAthleteHeadshot(firstName, lastName, apiHeadshot) {
      if (!firstName && !lastName) return apiHeadshot || '';

      // Build full name for lookup
      const rawFullName = `${firstName || ''} ${lastName || ''}`.trim();
      const normalized = normalizeNameUnified(rawFullName);
      const stripped = normalized.replace(/[^a-z\s]/g, '').replace(/\s+/g, ' ').trim();

      // Generate multiple lookup keys to maximize matching
      const lookupKeys = [
        // 1. Original lowercase (exact match)
        rawFullName.toLowerCase().replace(/\s+/g, ' ').trim(),
        // 2. Fully normalized (unified normalization)
        normalized,
        // 3. Stripped (only letters and spaces)
        stripped,
      ];

      // 4. Handle 3+ part names (e.g., "Benjamin Thurlow Lam")
      const parts = normalized.split(' ').filter(Boolean);
      if (parts.length >= 3) {
        // First + Last only (skip middle name)
        lookupKeys.push(`${parts[0]} ${parts[parts.length - 1]}`);
        // First + Middle initial + Last
        lookupKeys.push(`${parts[0]} ${parts[1][0]} ${parts[parts.length - 1]}`);
        // For 4+ parts, try first two + last
        if (parts.length >= 4) {
          lookupKeys.push(`${parts[0]} ${parts[1]} ${parts[parts.length - 1]}`);
        }
      }

      // 5. Handle case where firstName contains multiple parts
      const firstParts = (firstName || '').trim().split(/\s+/).filter(Boolean);
      if (firstParts.length >= 2 && lastName) {
        // Just first part of firstName + lastName
        lookupKeys.push(`${normalizeNameUnified(firstParts[0])} ${normalizeNameUnified(lastName)}`);
        // First part + initial + lastName
        lookupKeys.push(`${normalizeNameUnified(firstParts[0])} ${firstParts[1][0].toLowerCase()} ${normalizeNameUnified(lastName)}`);
      }

      // Remove duplicates and empty strings
      const uniqueKeys = [...new Set(lookupKeys.filter(Boolean))];

      // Try each key against Firebase headshots
      for (const key of uniqueKeys) {
        if (firebaseHeadshots[key]) {
          return firebaseHeadshots[key];
        }
      }

      // Fall back to API headshot
      return apiHeadshot || '';
    }

    // Initialize headshot loading
    loadFirebaseHeadshots();

    /**
     * Handle headshot load error by replacing with initials placeholder (E5).
     * Called via onerror="handleHeadshotError(this, 'First', 'Last')"
     * @param {HTMLImageElement} img - The image element that failed
     * @param {string} firstName - Athlete first name
     * @param {string} lastName - Athlete last name
     */
    function handleHeadshotError(img, firstName, lastName) {
      // Hide the broken image
      img.style.display = 'none';

      // Build initials (first letter of first name + first letter of last name)
      const firstInitial = (firstName || '').charAt(0).toUpperCase();
      const lastInitial = (lastName || '').charAt(0).toUpperCase();
      const initials = `${firstInitial}${lastInitial}` || '?';

      // Create placeholder div with initials
      const placeholder = document.createElement('div');
      placeholder.className = 'slot-headshot-fallback';
      placeholder.textContent = initials;
      placeholder.style.cssText = `
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        color: #9ca3af;
        flex-shrink: 0;
      `;

      // Insert before the hidden image
      img.parentNode.insertBefore(placeholder, img);
    }

    // Firebase paths
    const scoreBugRef = db.ref(`competitions/${compId}/scoreBug`);
    const configRef = db.ref(`competitions/${compId}/config`);
    const connectedRef = db.ref('.info/connected');

    /**
     * Initialize Firebase connection monitoring (A3d).
     * Detects offline/online state and handles reconnection.
     */
    function initConnectionMonitor() {
      connectedRef.on('value', (snapshot) => {
        const connected = snapshot.val() === true;
        const wasConnected = state.firebaseConnected;
        state.firebaseConnected = connected;

        if (connected && !wasConnected) {
          // Just reconnected
          console.log('Firebase connected - processing pending writes');
          state.reconnectAttempts = 0;
          processPendingWrites();

          // Write reconnect event to Firebase
          scoreBugRef.child('connectionStatus').set({
            connected: true,
            reconnectedAt: Date.now(),
            pendingWritesProcessed: state.pendingWrites.length
          });
        } else if (!connected && wasConnected) {
          // Just went offline
          console.warn('Firebase disconnected - writes will be queued');
          state.reconnectAttempts++;

          // Note: Firebase SDK has offline persistence by default
          // Writes are automatically queued and synced on reconnect
        }

        console.log('Firebase connection state:', connected ? 'ONLINE' : 'OFFLINE');
      });
    }

    /**
     * Process any pending writes that were queued during offline.
     * Firebase SDK handles this automatically, but we log for visibility.
     */
    function processPendingWrites() {
      if (state.pendingWrites.length === 0) return;

      console.log('Processing', state.pendingWrites.length, 'pending writes');

      // Firebase SDK automatically syncs queued writes
      // Clear our tracking array
      state.pendingWrites = [];
    }

    /**
     * Safe write to Firebase with offline queueing (A3d).
     * Wraps Firebase write operations to track pending writes during offline.
     * @param {firebase.database.Reference} ref - Firebase reference
     * @param {string} method - 'set', 'update', or 'remove'
     * @param {*} data - Data to write (for set/update)
     * @returns {Promise}
     */
    async function safeWrite(ref, method, data) {
      const writeOp = { path: ref.toString(), method, data, timestamp: Date.now() };

      if (!state.firebaseConnected) {
        // Queue the write for tracking (Firebase SDK queues automatically)
        state.pendingWrites.push(writeOp);
        console.log('Queued offline write:', writeOp.path, method);
      }

      try {
        if (method === 'set') {
          await ref.set(data);
        } else if (method === 'update') {
          await ref.update(data);
        } else if (method === 'remove') {
          await ref.remove();
        }
        return true;
      } catch (err) {
        // Firebase SDK will retry on reconnect
        console.error('Write failed (will retry on reconnect):', err.message);
        if (!state.pendingWrites.includes(writeOp)) {
          state.pendingWrites.push(writeOp);
        }
        return false;
      }
    }

    /**
     * Load competition config from Firebase.
     * Gets virtiusSessionId, team names/logos, gender, and compType.
     * Must be called before initializing Firebase listeners.
     */
    async function loadCompetitionConfig() {
      try {
        const snapshot = await configRef.once('value');
        const config = snapshot.val();

        if (!config) {
          console.error('No competition config found for compId:', compId);
          document.body.innerHTML = '<div class="error-state">Competition not found</div>';
          return false;
        }

        state.competitionConfig = config;
        state.virtiusSessionId = config.virtiusSessionId || null;
        state.gender = config.gender || 'mens';

        // Build teams array from config (up to 6 teams)
        state.teams = [];
        for (let i = 1; i <= 6; i++) {
          const teamName = config[`team${i}Name`];
          if (teamName) {
            state.teams.push({
              index: i,
              name: teamName,
              logo: config[`team${i}Logo`] || '',
              tricode: config[`team${i}Tricode`] || '',
              total: '--'  // Initial state before first API poll
            });
          }
        }

        // Determine total rotations based on gender (6 for men, 4 for women)
        state.rotation.total = state.gender === 'womens' ? 4 : 6;

        console.log('Competition config loaded:', {
          compId,
          virtiusSessionId: state.virtiusSessionId,
          gender: state.gender,
          teamCount: state.teams.length,
          teams: state.teams.map(t => t.name)
        });

        // Check if Virtius session ID is configured
        if (!state.virtiusSessionId) {
          console.warn('No Virtius session ID configured - API polling will not work');
        }

        return true;
      } catch (err) {
        console.error('Failed to load competition config:', err);
        document.body.innerHTML = '<div class="error-state">Failed to load competition config</div>';
        return false;
      }
    }

    /**
     * Update team total display element (A4).
     * Called when API polling detects a change in team.final_score.
     * Adds highlight animation on value change.
     * @param {number} teamIndex - 1-based team index
     * @param {string} newTotal - Formatted score string (e.g., "196.450")
     */
    function updateTeamTotal(teamIndex, newTotal) {
      const totalEl = document.getElementById(`teamTotal${teamIndex}`);
      if (!totalEl) return;

      const prevTotal = totalEl.textContent;

      // Only update if value changed
      if (prevTotal === newTotal) return;

      totalEl.textContent = newTotal;

      // Trigger highlight animation on change (skip for initial load)
      if (prevTotal !== '--') {
        totalEl.classList.remove('highlight');
        // Force reflow to restart animation
        void totalEl.offsetWidth;
        totalEl.classList.add('highlight');
      }
    }

    /**
     * Update all team totals from state (A4).
     * Called after API poll updates state.teams[].total values.
     */
    function updateAllTeamTotals() {
      state.teams.forEach((team) => {
        updateTeamTotal(team.index, team.total);
      });
    }

    // Initialize Firebase listeners
    function initFirebaseListeners() {
      // Listen for enabled state
      scoreBugRef.child('enabled').on('value', (snapshot) => {
        state.enabled = snapshot.val() === true;
        updateBugVisibility();
      });

      // Listen for polling state
      scoreBugRef.child('polling').on('value', (snapshot) => {
        const wasPolling = state.polling;
        state.polling = snapshot.val() === true;
        if (state.polling && !wasPolling) {
          startPolling();
        } else if (!state.polling && wasPolling) {
          stopPolling();
        }
      });

      // Listen for automation mode changes
      scoreBugRef.child('automationMode').on('value', (snapshot) => {
        const newMode = snapshot.val() || 'auto';
        const modeChanged = state.automationMode !== newMode;
        state.automationMode = newMode;

        // When mode changes, update now-competing display accordingly
        if (modeChanged) {
          console.log('Automation mode changed to:', newMode);
          updateAllNowCompeting();
        }
      });

      // Listen for manual now-competing overrides (B7)
      // Producer can show/hide now-competing per team in manual mode
      scoreBugRef.child('nowCompeting').on('value', (snapshot) => {
        const overrides = snapshot.val() || {};
        state.manualNowCompeting = {};

        // Convert team keys to indices: { "team1": true } → { 1: true }
        Object.entries(overrides).forEach(([teamKey, value]) => {
          // teamKey is "team1", "team2", etc.
          const match = teamKey.match(/team(\d+)/);
          if (match) {
            const teamIndex = parseInt(match[1], 10);
            state.manualNowCompeting[teamIndex] = value;
          }
        });

        console.log('Manual now-competing overrides updated:', state.manualNowCompeting);
        updateAllNowCompeting();
      });

      // Listen for lineup card toggle
      scoreBugRef.child('showLineup').on('value', (snapshot) => {
        state.showLineup = snapshot.val();
        updateLineupCard();
      });

      // Listen for flash dismissals
      scoreBugRef.child('dismissFlash').on('value', (snapshot) => {
        const dismissals = snapshot.val() || {};
        handleFlashDismissals(dismissals);
      });

      // Listen for poll interval changes - restart polling with new interval
      scoreBugRef.child('config/pollInterval').on('value', (snapshot) => {
        const newInterval = snapshot.val() || 5000;
        const wasPolling = state.polling && pollTimer !== null;
        state.pollInterval = newInterval;

        // Restart polling with new interval if currently polling
        if (wasPolling) {
          console.log('Poll interval changed to', newInterval, 'ms - restarting polling');
          stopPolling();
          startPolling();
        }
      });

      // Listen for flash duration changes
      scoreBugRef.child('config/flashDuration').on('value', (snapshot) => {
        state.flashDuration = snapshot.val() || 10000;
      });

      console.log('Firebase listeners initialized');
    }

    // Update bug visibility based on enabled state
    function updateBugVisibility() {
      const bugEl = document.getElementById('scoreBug');
      if (state.enabled) {
        bugEl.classList.add('visible');
      } else {
        bugEl.classList.remove('visible');
      }

    // Update lineup card visibility
    function updateLineupCard() {
      const cardEl = document.getElementById('lineupCard');
      if (!state.showLineup) {
        cardEl.classList.remove('visible');
        return;
      }

      // Find the team matching state.showLineup (teamKey like "navy-mens")
      const apiTeams = state.lastApiTeams || [];
      const teamData = apiTeams.find(t => {
        const teamKey = t.short_name || `team${apiTeams.indexOf(t) + 1}`;
        return teamKey === state.showLineup;
      });

      if (!teamData) {
        console.warn('Lineup card: team not found for key:', state.showLineup);
        cardEl.classList.remove('visible');
        return;
      }

      // Find the config team to get logo and display name
      const configTeamIndex = apiTeams.indexOf(teamData);
      const configTeam = state.teams[configTeamIndex] || {};

      // Find the current event (in progress or most recent)
      const currentEvent = findCurrentEventForLineup(teamData);
      if (!currentEvent) {
        console.warn('Lineup card: no current event found');
        cardEl.classList.remove('visible');
        return;
      }

      // Populate the lineup card content
      cardEl.innerHTML = renderLineupCardContent(teamData, configTeam, currentEvent);
      cardEl.classList.add('visible');
    }

    /**
     * Find the current event for lineup card display.
     * Prioritizes: (1) event in progress, (2) last completed event, (3) first event.
     * @param {Object} teamData - Team data from Virtius API
     * @returns {Object|null} Event object or null
     */
    function findCurrentEventForLineup(teamData) {
      if (!teamData || !teamData.events) return null;

      const events = teamData.events;
      if (events.length === 0) return null;

      // Look for event in progress (some scores, but not all)
      for (const event of events) {
        const gymnasts = event.gymnasts || [];
        if (gymnasts.length === 0) continue;

        const scored = gymnasts.filter(g => g.final_score != null);
        const unscored = gymnasts.filter(g => g.final_score == null);

        // Event in progress: has some scores but not complete
        if (scored.length > 0 && unscored.length > 0) {
          return event;
        }
      }

      // No event in progress - find the last event with scores
      for (let i = events.length - 1; i >= 0; i--) {
        const event = events[i];
        const gymnasts = event.gymnasts || [];
        const scored = gymnasts.filter(g => g.final_score != null);
        if (scored.length > 0) {
          return event;
        }
      }

      // No events have scores yet - return first event
      return events[0];
    }

    /**
     * Render lineup card HTML content.
     * @param {Object} teamData - Team data from Virtius API
     * @param {Object} configTeam - Team config with logo/name
     * @param {Object} event - Current event to display
     * @returns {string} HTML content
     */
    function renderLineupCardContent(teamData, configTeam, event) {
      const teamName = configTeam.name || teamData.name || 'Team';
      const teamLogo = configTeam.logo || '';
      const eventName = getEventShortCode(event.event_name || event.name || '');
      const eventTotal = formatScore(event.event_score);

      // Sort gymnasts by lineup order
      const gymnasts = [...(event.gymnasts || [])].sort((a, b) => (a.order || 0) - (b.order || 0));

      // Build athlete rows
      const athleteRows = gymnasts.map((g, idx) => {
        const order = g.order || (idx + 1);
        const name = g.full_name || 'Unknown';
        // Get start value from scores array if available
        const startValue = (g.scores && g.scores[0] && g.scores[0].start)
          ? parseFloat(g.scores[0].start).toFixed(1)
          : '';
        const score = g.final_score != null ? formatScore(g.final_score) : '--';
        const pendingClass = g.final_score == null ? 'pending' : '';

        return `
          <div class="lineup-athlete">
            <span class="lineup-order">${order}.</span>
            <span class="lineup-name">${name}</span>
            <span class="lineup-sv">${startValue}</span>
            <span class="lineup-score ${pendingClass}">${score}</span>
          </div>
        `;
      }).join('');

      return `
        <div class="lineup-header">
          <span class="lineup-team-name">${teamName}</span>
          <img class="lineup-logo" src="${teamLogo}" alt="" onerror="this.style.display='none'">
        </div>
        <div class="lineup-athletes">
          ${athleteRows}
        </div>
        <div class="lineup-footer">
          <span class="lineup-event">${eventName}</span>
          <span class="lineup-total">${eventTotal}</span>
        </div>
      `;
    }

    /**
     * Format score for display (3 decimal places).
     * @param {string|number|null} score - Score value
     * @returns {string} Formatted score or "--"
     */
    function formatScore(score) {
      if (score == null || score === '') return '--';
      const num = parseFloat(score);
      if (isNaN(num)) return '--';
      return num.toFixed(3);
    }

    /**
     * Handle flash dismissals from producer panel (Task A12c).
     * When producer clicks "dismiss" for a team, immediately clears
     * the active flash and advances to next in queue.
     * @param {Object} dismissals - Map of teamIndex -> timestamp
     */
    function handleFlashDismissals(dismissals) {
      if (!dismissals || typeof dismissals !== 'object') return;

      Object.keys(dismissals).forEach((teamIndexStr) => {
        const teamIndex = parseInt(teamIndexStr, 10);
        const dismissTimestamp = dismissals[teamIndex];

        // Skip if no active flash for this team
        if (!state.activeFlashes[teamIndex]) return;

        // Skip if already processed this dismissal (compare timestamps)
        const activeFlash = state.activeFlashes[teamIndex];
        if (activeFlash.dismissedAt === dismissTimestamp) return;

        console.log('Processing flash dismissal:', {
          team: teamIndex,
          gymnast: activeFlash.name,
          dismissTimestamp
        });

        // Mark as processed
        activeFlash.dismissedAt = dismissTimestamp;

        // Clear the timer for current flash
        if (activeFlash.timer) {
          clearTimeout(activeFlash.timer);
        }

        // Advance to next flash (or clear if queue empty)
        advanceFlashQueue(teamIndex);

        // Clear the dismissal flag in Firebase after processing
        scoreBugRef.child(`dismissFlash/${teamIndex}`).remove();
      });
    }

    // Polling management
    let pollTimer = null;

    function startPolling() {
      if (pollTimer) return;
      console.log('Starting API polling');
      poll();  // Initial poll
      pollTimer = setInterval(poll, state.pollInterval);
    }

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
        console.log('Stopped API polling');
      }
    }

    // Main poll function - fetches data from Virtius API
    async function poll() {
      // Check if we have a valid session ID
      if (!state.virtiusSessionId) {
        console.warn('No Virtius session ID - skipping poll');
        return;
      }

      const pollStartTime = Date.now();

      try {
        // Fetch from Virtius API
        const response = await fetch(`https://api.virti.us/session/${state.virtiusSessionId}/json`);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();

        // Store raw API data for score diff engine (Task A5)
        // Extract teams array from meet data
        const teams = data.meet?.teams || [];

        if (teams.length === 0) {
          console.warn('No teams found in API response');
        }

        // Store the latest API data in state
        state.lastApiData = data;
        state.lastApiTeams = teams;

        // Extract team totals and update state.teams with actual data
        // final_score comes as a string from API - convert to float for display
        teams.forEach((apiTeam, idx) => {
          // Match API team to our configured teams by index or name
          const stateTeam = state.teams[idx];
          if (stateTeam) {
            // Convert string final_score to formatted number
            const rawScore = apiTeam.final_score;
            if (rawScore !== null && rawScore !== undefined) {
              const numScore = parseFloat(rawScore);
              stateTeam.total = isNaN(numScore) ? '--' : numScore.toFixed(3);
            }
            // Store API team reference for score diff engine
            stateTeam.apiTeam = apiTeam;
          }
        });

        // Write heartbeat to Firebase on successful poll (using safeWrite for offline resilience)
        await safeWrite(scoreBugRef.child('heartbeat'), 'set', pollStartTime);

        console.log('Poll successful:', {
          sessionId: state.virtiusSessionId,
          teamCount: teams.length,
          teams: state.teams.map(t => ({ name: t.name, total: t.total }))
        });

        // Process API data - detect changes and write deltas to Firebase
        await processApiData(teams, pollStartTime);

        // Update team total displays (A4)
        updateAllTeamTotals();

      } catch (err) {
        // Error handling with exponential backoff (A3c)
        state.consecutiveErrors++;
        state.lastError = err.message;
        state.lastErrorTime = pollStartTime;

        // Calculate backoff delay: 5s, 10s, 20s, 40s, 60s (max)
        const backoffDelay = Math.min(
          state.pollInterval * Math.pow(2, state.consecutiveErrors - 1),
          state.maxBackoffMs
        );

        console.error('Poll failed:', {
          error: err.message,
          consecutiveErrors: state.consecutiveErrors,
          nextRetryIn: `${backoffDelay / 1000}s`
        });

        // Write error state to Firebase for producer panel visibility (D5b)
        // Using safeWrite for offline resilience
        await safeWrite(scoreBugRef.child('apiError'), 'set', {
          message: err.message,
          consecutiveErrors: state.consecutiveErrors,
          timestamp: pollStartTime,
          nextRetryMs: backoffDelay
        });
        // Still write heartbeat to indicate overlay is running
        await safeWrite(scoreBugRef.child('heartbeat'), 'set', pollStartTime);

        // Schedule next poll with backoff delay if we're still supposed to be polling
        if (state.polling && pollTimer) {
          clearInterval(pollTimer);
          pollTimer = setTimeout(() => {
            if (state.polling) {
              poll();
              // If poll succeeds, startPolling() will be called to restore normal interval
            }
          }, backoffDelay);
        }
        return; // Skip normal completion
      }

      // Success - reset error state
      if (state.consecutiveErrors > 0) {
        console.log('Poll recovered after', state.consecutiveErrors, 'consecutive errors');
        state.consecutiveErrors = 0;
        state.lastError = null;
        state.lastErrorTime = null;

        // Clear error state in Firebase
        await safeWrite(scoreBugRef.child('apiError'), 'remove');

        // Restore normal polling interval (we might be on backoff timeout)
        if (state.polling && pollTimer) {
          clearTimeout(pollTimer);
          clearInterval(pollTimer);
          pollTimer = setInterval(poll, state.pollInterval);
        }
      }
    }

    /**
     * Process API data - detect score changes and write incremental deltas to Firebase.
     * Only writes changed paths, not full data rewrite.
     * @param {Array} apiTeams - Teams array from Virtius API
     * @param {number} pollTimestamp - Timestamp of this poll
     */
    async function processApiData(apiTeams, pollTimestamp) {
      const changedPaths = {};
      let hasChanges = false;

      // Process each team
      apiTeams.forEach((team, teamIdx) => {
        const teamKey = team.short_name || `team${teamIdx + 1}`;

        // Check if team total changed
        const prevTeamTotal = state.previousTeamTotals[teamKey];
        const currTeamTotal = team.final_score;  // string or null

        if (currTeamTotal !== prevTeamTotal) {
          changedPaths[`teams/${teamKey}/finalScore`] = currTeamTotal;
          changedPaths[`teams/${teamKey}/name`] = team.name || teamKey;
          hasChanges = true;
        }

        // Process each event's gymnasts for score changes
        const events = team.events || [];
        events.forEach((event) => {
          const eventKey = event.short_name || event.name || 'unknown';
          const gymnasts = event.gymnasts || [];

          gymnasts.forEach((gymnast) => {
            // Primary key: gymnast_id. Fallback: teamKey|normalizedName
            const gymnastKey = gymnast.gymnast_id ||
              `${teamKey}|${normalizeName(gymnast.full_name)}`;

            const prevScore = state.previousScores[gymnastKey];
            const currScore = gymnast.final_score;  // string or null

            // Score changed (new score OR corrected score)
            if (currScore != null && prevScore !== currScore) {
              // Build gymnast data for Firebase and flash queue
              // Stick bonus is indicated by bonus > 0 in the API (men's gymnastics only)
              const bonusValue = parseFloat(gymnast.bonus) || 0;
              const hasStick = bonusValue > 0;

              const gymnastData = {
                name: gymnast.full_name,
                firstName: gymnast.first_name || '',
                lastName: gymnast.last_name || '',
                apiHeadshot: gymnast.headshot || '',
                score: currScore,
                startValue: gymnast.start_value || null,
                execution: gymnast.execution || null,
                difficulty: gymnast.difficulty || null,
                bonus: bonusValue,
                hasStick: hasStick,
                order: gymnast.order,
                event: eventKey,
                team: teamKey,
                gymnastKey: gymnastKey,
                timestamp: pollTimestamp,
                isCorrection: prevScore != null  // True if score was changed (not new)
              };

              changedPaths[`teams/${teamKey}/events/${eventKey}/gymnasts/${gymnastKey}`] = gymnastData;
              hasChanges = true;

              console.log('Score change detected:', {
                gymnast: gymnast.full_name,
                event: eventKey,
                team: teamKey,
                prev: prevScore,
                curr: currScore,
                isCorrection: prevScore != null
              });

              // Trigger flash for this score change (A5)
              const teamIndex = teamIdx + 1;  // Convert 0-based to 1-based index
              if (isFlashActive(teamIndex, gymnastKey)) {
                // Correction during active flash - interrupt and replace
                interruptFlash(teamIndex, gymnastData);
              } else {
                // Queue new flash for this team
                triggerScoreFlash(teamIndex, gymnastData);
              }
            }

            // Score removed (rare - inquiry pending)
            if (currScore == null && prevScore != null) {
              changedPaths[`teams/${teamKey}/events/${eventKey}/gymnasts/${gymnastKey}/score`] = null;
              hasChanges = true;
              console.log('Score removed:', { gymnast: gymnast.full_name, event: eventKey });
            }
          });
        });
      });

      // Write to Firebase (using safeWrite for offline resilience)
      if (hasChanges) {
        // Write changed paths and reset stale counter
        await safeWrite(scoreBugRef.child('liveData'), 'update', {
          ...changedPaths,
          lastDataChangeTimestamp: pollTimestamp,
          stalePollCount: 0
        });
        state.stalePollCount = 0;

        console.log('Wrote incremental deltas to Firebase:', Object.keys(changedPaths).length, 'paths');
      } else {
        // No changes - increment stale counter
        state.stalePollCount++;
        await safeWrite(scoreBugRef.child('liveData'), 'update', {
          lastPollTimestamp: pollTimestamp,
          stalePollCount: state.stalePollCount
        });
      }

      // Update previous state for next comparison
      state.previousScores = buildScoreMap(apiTeams);
      state.previousTeamTotals = buildTeamTotalMap(apiTeams);

      // Detect and update rotation (A10)
      const newRotation = detectRotation(apiTeams);
      if (newRotation.current !== state.rotation.current ||
          newRotation.isFinal !== state.rotation.isFinal) {
        state.rotation = newRotation;
        updateRotationTag();

        // Write rotation to Firebase for producer panel visibility
        await safeWrite(scoreBugRef.child('liveData/rotation'), 'set', newRotation.current);
        await safeWrite(scoreBugRef.child('liveData/totalRotations'), 'set', newRotation.total);
        await safeWrite(scoreBugRef.child('liveData/isFinal'), 'set', newRotation.isFinal);

        console.log('Rotation updated:', newRotation);
      }

      // Detect now-competing athletes (B1)
      const nowCompeting = detectAllNowCompeting(apiTeams);
      const prevNowCompeting = state.nowCompeting || [];

      // Check if now-competing has changed
      const nowCompetingChanged = JSON.stringify(nowCompeting) !== JSON.stringify(prevNowCompeting);

      if (nowCompetingChanged) {
        state.nowCompeting = nowCompeting;

        // Write detected state to Firebase for producer panel visibility
        await safeWrite(scoreBugRef.child('detected/nowCompeting'), 'set', nowCompeting);

        console.log('Now competing updated:', nowCompeting);

        // Update now-competing slot displays (B2)
        updateAllNowCompeting();
      }

      // Write detected teams list for lineup card controls (D7)
      const detectedTeams = apiTeams.map((team, idx) => ({
        teamIndex: idx,
        teamKey: team.short_name || `team${idx + 1}`,
        teamName: team.name,
        tricode: team.tricode
      }));
      const prevDetectedTeams = state.detectedTeams || [];
      if (JSON.stringify(detectedTeams) !== JSON.stringify(prevDetectedTeams)) {
        state.detectedTeams = detectedTeams;
        await safeWrite(scoreBugRef.child('detected/teams'), 'set', detectedTeams);
      }

      // Update lineup card if visible (C5 - live update with new scores)
      if (state.showLineup) {

    function buildScoreMap(apiTeams) {
      const map = {};
      apiTeams.forEach((team, teamIdx) => {
        const teamKey = team.short_name || `team${teamIdx + 1}`;
        const events = team.events || [];

        events.forEach((event) => {
          const gymnasts = event.gymnasts || [];
          gymnasts.forEach((gymnast) => {
            const gymnastKey = gymnast.gymnast_id ||
              `${teamKey}|${normalizeName(gymnast.full_name)}`;
            map[gymnastKey] = gymnast.final_score;  // string or null
          });
        });
      });
      return map;

     * @returns {Object} Map of teamKey -> finalScore (string)

    function buildTeamTotalMap(apiTeams) {
      const map = {};
      apiTeams.forEach((team, teamIdx) => {
        const teamKey = team.short_name || `team${teamIdx + 1}`;
        map[teamKey] = team.final_score;  // string or null
      });

    /**
     * Check if a flash is currently active for a given team and gymnast.
     * Used to detect score corrections during active flash display.
     * @param {number} teamIndex - 1-based team index
     * @param {string} gymnastKey - Unique gymnast identifier
     * @returns {boolean} True if flash is active for this gymnast
     */
    function isFlashActive(teamIndex, gymnastKey) {
      const activeFlash = state.activeFlashes[teamIndex];
      return activeFlash && activeFlash.gymnastKey === gymnastKey;
    }

    /**
     * Interrupt current flash with a new one (score correction case).
     * Immediately replaces the active flash and resets timer.
     * @param {number} teamIndex - 1-based team index
     * @param {Object} gymnastData - New score data to display
     */
    function interruptFlash(teamIndex, gymnastData) {
      console.log('Interrupting active flash with correction:', {
        team: teamIndex,
        gymnast: gymnastData.name,
        newScore: gymnastData.score
      });

      // Clear existing flash timer
      if (state.activeFlashes[teamIndex]?.timer) {
        clearTimeout(state.activeFlashes[teamIndex].timer);
      }

      // Replace with new flash data
      state.activeFlashes[teamIndex] = {
        ...gymnastData,
        startTime: Date.now(),
        timer: null
      };

      // Render the updated flash immediately
      renderFlash(teamIndex, gymnastData);

      // Set new timer
      state.activeFlashes[teamIndex].timer = setTimeout(() => {
        advanceFlashQueue(teamIndex);
      }, state.flashDuration);
    }

    /**
     * Queue a new score flash for a team.
     * If no flash is active, displays immediately. Otherwise queued.
     * @param {number} teamIndex - 1-based team index
     * @param {Object} gymnastData - Score data to display
     */
    function triggerScoreFlash(teamIndex, gymnastData) {
      // Initialize queue if needed
      if (!state.flashQueues[teamIndex]) {
        state.flashQueues[teamIndex] = [];
      }

      const queue = state.flashQueues[teamIndex];

      // Edge case: Check if this gymnast is already in the queue (correction before display)
      const existingIndex = queue.findIndex(item => item.gymnastKey === gymnastData.gymnastKey);
      if (existingIndex !== -1) {
        // Update existing queue entry with corrected score (A13: corrections in queue)
        console.log('Updating queued flash with correction:', {
          team: teamIndex,
          gymnast: gymnastData.name,
          oldScore: queue[existingIndex].score,
          newScore: gymnastData.score
        });
        queue[existingIndex] = { ...gymnastData, isCorrection: true };
        return;
      }

      // Edge case: Cap queue length to prevent runaway (A13: rapid scores)
      const MAX_QUEUE_SIZE = 6;  // Max gymnasts per rotation
      if (queue.length >= MAX_QUEUE_SIZE) {
        console.warn('Flash queue full, dropping oldest entry:', {
          team: teamIndex,
          dropped: queue[0].name,
          newEntry: gymnastData.name
        });
        queue.shift();
      }

      console.log('Queuing score flash:', {
        team: teamIndex,
        gymnast: gymnastData.name,
        score: gymnastData.score,
        queueLength: queue.length
      });

      // Add to queue
      queue.push(gymnastData);

      // If no active flash, start displaying
      if (!state.activeFlashes[teamIndex]) {
        displayNextFlash(teamIndex);
      }
    }

    /**
     * Display the next flash from the queue.
     * Called when starting or advancing the queue.
     * @param {number} teamIndex - 1-based team index
     */
    function displayNextFlash(teamIndex) {
      const queue = state.flashQueues[teamIndex] || [];

      if (queue.length === 0) {
        // No more flashes - clear active state
        state.activeFlashes[teamIndex] = null;
        clearFlashDisplay(teamIndex);
        return;
      }

      // Get next flash from queue
      const gymnastData = queue.shift();

      // Set as active
      state.activeFlashes[teamIndex] = {
        ...gymnastData,
        startTime: Date.now(),
        timer: setTimeout(() => {
          advanceFlashQueue(teamIndex);
        }, state.flashDuration)
      };

      // Render the flash
      renderFlash(teamIndex, gymnastData);
    }

    /**
     * Advance to next flash in queue (called when timer expires).
     * @param {number} teamIndex - 1-based team index
     */
    function advanceFlashQueue(teamIndex) {
      // Clear current flash timer
      if (state.activeFlashes[teamIndex]?.timer) {
        clearTimeout(state.activeFlashes[teamIndex].timer);
      }

      // Display next or clear
      displayNextFlash(teamIndex);
    }

    function triggerSpinIn(slotContent) {

      void slotContent.offsetWidth;

      if (slotContent.innerHTML.trim() === '') return;

      slotContent.classList.remove('spin-in', 'visible');

      setTimeout(() => {

        const nowCompetingToRestore = getNowCompetingForTeam(teamIndex);

    function getEventShortCode(eventName) {

      if (name.includes('floor')) return 'FX';

      if (name.includes('vault')) return 'VT';

      if (name.includes('beam') || name.includes('balance')) return 'BB';

      return eventName;

    /**
     * Detect current rotation from API data using ALL teams.
     * Rotation only advances when ALL teams have completed their current event.
     * @param {Array} apiTeams - Teams array from Virtius API
     * @returns {Object} { current: number, total: number, isFinal: boolean }
     */
    function detectRotation(apiTeams) {
      if (!apiTeams || apiTeams.length === 0) {
        return state.rotation;  // Keep existing state if no data
      }

      // Total events based on gender (6 for men, 4 for women)
      const totalEvents = state.rotation.total;

      // Find minimum completed events across ALL teams
      let minCompletedAcrossTeams = totalEvents;

      apiTeams.forEach((team) => {
        const events = team.events || [];
        let completedEvents = 0;

        events.forEach((event) => {
          const gymnasts = event.gymnasts || [];
          // An event is "complete" if all gymnasts have scores
          const scored = gymnasts.filter(g => g.final_score != null);
          if (scored.length === gymnasts.length && gymnasts.length > 0) {
            completedEvents++;
          }
        });

        minCompletedAcrossTeams = Math.min(minCompletedAcrossTeams, completedEvents);
      });

      // All events complete for all teams = Final
      if (minCompletedAcrossTeams === totalEvents) {
        return { current: totalEvents, total: totalEvents, isFinal: true };
      }

      // Current rotation = completed events + 1
      const currentRotation = minCompletedAcrossTeams + 1;
      return { current: currentRotation, total: totalEvents, isFinal: false };
    }

    /**
     * Detect the currently competing athlete for a team.
     * Finds the next athlete without a score in an event that has some scores.
     * Based on logic from GraphicsControl.jsx:216-269.
     * @param {Object} team - Team object from Virtius API
     * @returns {Object|null} { athlete: Object, event: Object } or null
     */
    function detectNowCompeting(team) {
      if (!team || !team.events) return null;

      // Olympic order for events (already sorted in API, but just in case)
      const events = team.events;

      for (const event of events) {
        const gymnasts = event.gymnasts || [];
        if (gymnasts.length === 0) continue;

        // Sort by order (lineup position)
        const sortedGymnasts = [...gymnasts].sort((a, b) => (a.order || 0) - (b.order || 0));

        // Find scored and unscored athletes
        const scored = sortedGymnasts.filter(g => g.final_score != null);
        const unscored = sortedGymnasts.filter(g => g.final_score == null);

        // If this event has some scores but not all, it's in progress
        if (scored.length > 0 && unscored.length > 0) {
          return {
            athlete: unscored[0],
            event: event
          };
        }
      }

      return null; // No one currently competing (between rotations or complete)
    }

    /**
     * Detect now-competing athletes for all teams and return results.
     * @param {Array} apiTeams - Teams array from Virtius API
     * @returns {Array} Array of { teamIndex, teamName, tricode, athlete, eventName }
     */
    function detectAllNowCompeting(apiTeams) {
      if (!apiTeams || apiTeams.length === 0) return [];

      const results = [];

      apiTeams.forEach((team, teamIndex) => {
        const nowCompeting = detectNowCompeting(team);
        if (nowCompeting) {
          results.push({
            teamIndex: teamIndex,
            teamKey: team.short_name || `team${teamIndex + 1}`,
            teamName: team.name,

              type: nowCompeting.athlete.type // 0=competing, 1=exhibition, etc.

      });

      return results;
    }

    // Initialize Firebase schema with default values (prevents race conditions)
    // Uses update() with null checks - only sets values that don't exist
    async function initializeSchema() {
      const defaultSchema = {
        enabled: false,
        polling: false,
        automationMode: 'auto',
        showLineup: null,
        dismissFlash: {},
        nowCompeting: {},
        detected: {},
        heartbeat: null,
        liveData: {
          lastPollTimestamp: null,
          lastDataChangeTimestamp: null,
          stalePollCount: 0,
          rotation: null,
          totalRotations: null,
          teams: {}
        },
        lastError: null,
        config: {
          pollInterval: 5000,
          flashDuration: 10000,
          showStickIndicator: true
        }
      };

      try {
        // Use transaction to safely initialize schema without overwriting existing values
        await scoreBugRef.transaction((currentData) => {
          if (currentData === null) {
            // No data exists - write full schema
            console.log('Initializing scoreBug schema with defaults');
            return defaultSchema;
          }
          // Data exists - merge defaults for any missing fields only
          const merged = { ...defaultSchema };
          Object.keys(currentData).forEach(key => {
            if (currentData[key] !== undefined) {
              // Keep existing value
              merged[key] = currentData[key];
            }
          });
          // Deep merge for nested objects (config, liveData)
          if (currentData.config) {
            merged.config = { ...defaultSchema.config, ...currentData.config };
          }
          if (currentData.liveData) {
            merged.liveData = { ...defaultSchema.liveData, ...currentData.liveData };
          }
          console.log('Merged existing scoreBug data with defaults');
          return merged;
        });
        console.log('Firebase schema initialized');
      } catch (err) {
        console.error('Failed to initialize schema:', err);
      }
    }

    // Initialize on load
    if (compId) {
      // Start connection monitor immediately (A3d)
      initConnectionMonitor();

      // Order: load config -> render teams -> initialize schema -> start listeners
      loadCompetitionConfig().then(async (success) => {
        if (!success) return;  // Exit early, don't initialize listeners

        // Render team rows with initial state (before API data)
        renderTeamRows();

        // Update rotation tag for correct total (4 for women, 6 for men)
        updateRotationTag();

        // Initialize Firebase schema (safe defaults)
        await initializeSchema();

        // Start listening for Firebase changes (only after successful config load)
        initFirebaseListeners();
      });
    }
  </script>
  <script src="theme-loader.js"></script>
</body>
