<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Team Score Bug</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    /* Score bug container - positioned on right side of screen */
    .score-bug {
      position: absolute;
      top: 50%;
      right: 0;
      transform: translateY(-50%) translateX(100%);
      display: flex;
      flex-direction: column;
      min-width: 500px;
      opacity: 0;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .score-bug.visible {
      transform: translateY(-50%) translateX(0);
      opacity: 1;
    }

    /* Rotation tag at top */
    .rotation-tag {
      background: #27272a;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      padding: 10px 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Team rows container */
    .team-rows {
      display: flex;
      flex-direction: column;
    }

    /* Individual team row */
    .team-row {
      display: flex;
      flex-direction: row;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      min-height: 70px;
    }

    .team-row:last-child {
      border-bottom: none;
    }

    /* Fixed left section: logo + total */
    .team-fixed {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 15px;
      min-width: 100px;
      background: #000;
    }

    .team-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .team-total {
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      margin-top: 4px;
    }

    .team-total.highlight {
      animation: totalPulse 0.5s ease;
    }

    @keyframes totalPulse {
      0%, 100% { transform: scale(1); color: #fff; }
      50% { transform: scale(1.1); color: #22d3ee; }
    }

    /* Slot area for score flash / now competing */
    .team-slot {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 10px 20px;
      overflow: hidden;
      position: relative;
    }

    /* Slot content (animates up/down) */
    .slot-content {
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateY(0);
      transition: transform 0.4s ease, opacity 0.4s ease;
      opacity: 0;
    }

    .slot-content.visible {
      opacity: 1;
    }

    .slot-content.exit-up {
      transform: translateY(-100%);
      opacity: 0;
    }

    .slot-content.enter-from-below {
      transform: translateY(100%);
      opacity: 0;
    }

    /* Headshot in slot */
    .slot-headshot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    /* Athlete name in slot */
    .slot-name {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
    }

    /* Score in slot */
    .slot-score {
      font-size: 28px;
      font-weight: 900;
      color: #fff;
    }

    /* Apparatus code */
    .slot-apparatus {
      font-size: 18px;
      font-weight: 600;
      color: #a1a1aa;
      text-transform: uppercase;
    }

    /* Start value */
    .slot-sv {
      font-size: 16px;
      font-weight: 400;
      color: #71717a;
    }

    /* Stick indicator */
    .slot-stick {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #22c55e;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Separator dot */
    .slot-separator {
      color: #52525b;
      font-size: 20px;
    }

    /* Lineup card (above bug) */
    .lineup-card {
      position: absolute;
      bottom: 100%;
      right: 0;
      width: 100%;
      background: #1a1a1a;
      transform: translateY(100%);
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.4s ease;
      margin-bottom: 8px;
    }

    .lineup-card.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .lineup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #27272a;
    }

    .lineup-team-name {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
    }

    .lineup-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .lineup-athletes {
      padding: 8px 0;
    }

    .lineup-athlete {
      display: flex;
      align-items: center;
      padding: 8px 20px;
      gap: 12px;
    }

    .lineup-order {
      font-size: 16px;
      font-weight: 600;
      color: #71717a;
      min-width: 24px;
    }

    .lineup-name {
      flex: 1;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
    }

    .lineup-sv {
      font-size: 16px;
      font-weight: 400;
      color: #71717a;
      min-width: 40px;
      text-align: right;
    }

    .lineup-score {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      min-width: 70px;
      text-align: right;
    }

    .lineup-score.pending {
      color: #52525b;
    }

    .lineup-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #27272a;
    }

    .lineup-event {
      font-size: 18px;
      font-weight: 600;
      color: #a1a1aa;
      text-transform: uppercase;
    }

    .lineup-total {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
    }

    /* Loading / error states */
    .loading-state {
      color: #71717a;
      font-size: 18px;
      padding: 20px;
      text-align: center;
    }

    .error-state {
      color: #ef4444;
      font-size: 18px;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="score-bug" id="scoreBug">
    <div class="lineup-card" id="lineupCard">
      <!-- Lineup card content populated dynamically -->
    </div>
    <div class="rotation-tag" id="rotationTag">Rotation 1 of 6</div>
    <div class="team-rows" id="teamRows">
      <!-- Team rows populated dynamically -->
    </div>
  </div>

  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCh0aZUvKl6Qvqsva3hvOgJJlleP1OwcTY",
      authDomain: "gymnastics-graphics.firebaseapp.com",
      databaseURL: "https://gymnastics-graphics-default-rtdb.firebaseio.com",
      projectId: "gymnastics-graphics",
      storageBucket: "gymnastics-graphics.firebasestorage.app",
      messagingSenderId: "702072609550",
      appId: "1:702072609550:web:ac74a811186d3ff45b955f"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Parse URL parameters
    const params = new URLSearchParams(window.location.search);
    const compId = params.get('compId');

    if (!compId) {
      console.error('Missing compId parameter');
      document.body.innerHTML = '<div class="error-state">Missing compId parameter</div>';
    }

    // State management
    const state = {
      enabled: false,
      polling: false,
      automationMode: 'auto',
      showLineup: null,
      teams: [],
      rotation: { current: 1, total: 6, isFinal: false },
      previousScores: {},        // { "gymnast_id": "finalScore" (string) }
      previousTeamTotals: {},    // { "teamKey": "finalScore" (string) }
      flashQueues: {},           // Per-team flash queues
      activeFlashes: {},         // Currently active flashes per team
      pollInterval: 5000,
      flashDuration: 10000,
      stalePollCount: 0,         // Consecutive polls with no data changes
      // Competition config (loaded from Firebase)
      competitionConfig: null,
      virtiusSessionId: null,
      gender: 'mens'
    };

    /**
     * Normalize athlete name for lookup (lowercase, remove special chars).
     * Matches pattern used in output.html for headshot lookups.
     */
    function normalizeName(name) {
      if (!name) return '';
      return name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
    }

    // Firebase paths
    const scoreBugRef = db.ref(`competitions/${compId}/scoreBug`);
    const configRef = db.ref(`competitions/${compId}/config`);

    /**
     * Load competition config from Firebase.
     * Gets virtiusSessionId, team names/logos, gender, and compType.
     * Must be called before initializing Firebase listeners.
     */
    async function loadCompetitionConfig() {
      try {
        const snapshot = await configRef.once('value');
        const config = snapshot.val();

        if (!config) {
          console.error('No competition config found for compId:', compId);
          document.body.innerHTML = '<div class="error-state">Competition not found</div>';
          return false;
        }

        state.competitionConfig = config;
        state.virtiusSessionId = config.virtiusSessionId || null;
        state.gender = config.gender || 'mens';

        // Build teams array from config (up to 6 teams)
        state.teams = [];
        for (let i = 1; i <= 6; i++) {
          const teamName = config[`team${i}Name`];
          if (teamName) {
            state.teams.push({
              index: i,
              name: teamName,
              logo: config[`team${i}Logo`] || '',
              tricode: config[`team${i}Tricode`] || '',
              total: '--'  // Initial state before first API poll
            });
          }
        }

        // Determine total rotations based on gender (6 for men, 4 for women)
        state.rotation.total = state.gender === 'womens' ? 4 : 6;

        console.log('Competition config loaded:', {
          compId,
          virtiusSessionId: state.virtiusSessionId,
          gender: state.gender,
          teamCount: state.teams.length,
          teams: state.teams.map(t => t.name)
        });

        // Check if Virtius session ID is configured
        if (!state.virtiusSessionId) {
          console.warn('No Virtius session ID configured - API polling will not work');
        }

        return true;
      } catch (err) {
        console.error('Failed to load competition config:', err);
        document.body.innerHTML = '<div class="error-state">Failed to load competition config</div>';
        return false;
      }
    }

    /**
     * Render initial team rows based on competition config.
     * Called after loadCompetitionConfig() to show teams before API polling starts.
     */
    function renderTeamRows() {
      const container = document.getElementById('teamRows');
      if (!container) return;

      container.innerHTML = state.teams.map((team, idx) => `
        <div class="team-row" data-team-index="${team.index}">
          <div class="team-fixed">
            <img class="team-logo" src="${team.logo}" alt="${team.name}" onerror="this.style.display='none'">
            <div class="team-total" id="teamTotal${team.index}">${team.total}</div>
          </div>
          <div class="team-slot" id="teamSlot${team.index}">
            <div class="slot-content" id="slotContent${team.index}">
              <!-- Score flash / now competing content populated dynamically -->
            </div>
          </div>
        </div>
      `).join('');

      console.log('Team rows rendered:', state.teams.length);
    }

    // Initialize Firebase listeners
    function initFirebaseListeners() {
      // Listen for enabled state
      scoreBugRef.child('enabled').on('value', (snapshot) => {
        state.enabled = snapshot.val() === true;
        updateBugVisibility();
      });

      // Listen for polling state
      scoreBugRef.child('polling').on('value', (snapshot) => {
        const wasPolling = state.polling;
        state.polling = snapshot.val() === true;
        if (state.polling && !wasPolling) {
          startPolling();
        } else if (!state.polling && wasPolling) {
          stopPolling();
        }
      });

      // Listen for automation mode
      scoreBugRef.child('automationMode').on('value', (snapshot) => {
        state.automationMode = snapshot.val() || 'auto';
      });

      // Listen for lineup card toggle
      scoreBugRef.child('showLineup').on('value', (snapshot) => {
        state.showLineup = snapshot.val();
        updateLineupCard();
      });

      // Listen for flash dismissals
      scoreBugRef.child('dismissFlash').on('value', (snapshot) => {
        const dismissals = snapshot.val() || {};
        handleFlashDismissals(dismissals);
      });

      // Listen for poll interval changes - restart polling with new interval
      scoreBugRef.child('config/pollInterval').on('value', (snapshot) => {
        const newInterval = snapshot.val() || 5000;
        const wasPolling = state.polling && pollTimer !== null;
        state.pollInterval = newInterval;

        // Restart polling with new interval if currently polling
        if (wasPolling) {
          console.log('Poll interval changed to', newInterval, 'ms - restarting polling');
          stopPolling();
          startPolling();
        }
      });

      // Listen for flash duration changes
      scoreBugRef.child('config/flashDuration').on('value', (snapshot) => {
        state.flashDuration = snapshot.val() || 10000;
      });

      console.log('Firebase listeners initialized');
    }

    // Update bug visibility based on enabled state
    function updateBugVisibility() {
      const bugEl = document.getElementById('scoreBug');
      if (state.enabled) {
        bugEl.classList.add('visible');
      } else {
        bugEl.classList.remove('visible');
      }
    }

    // Update lineup card visibility
    function updateLineupCard() {
      const cardEl = document.getElementById('lineupCard');
      if (state.showLineup) {
        cardEl.classList.add('visible');
        // TODO: Populate lineup card content (Phase C)
      } else {
        cardEl.classList.remove('visible');
      }
    }

    // Handle flash dismissals from producer
    function handleFlashDismissals(dismissals) {
      // TODO: Implement flash dismissal handling (Task A12c)
    }

    // Polling management
    let pollTimer = null;

    function startPolling() {
      if (pollTimer) return;
      console.log('Starting API polling');
      poll();  // Initial poll
      pollTimer = setInterval(poll, state.pollInterval);
    }

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
        console.log('Stopped API polling');
      }
    }

    // Main poll function - fetches data from Virtius API
    async function poll() {
      // Check if we have a valid session ID
      if (!state.virtiusSessionId) {
        console.warn('No Virtius session ID - skipping poll');
        return;
      }

      const pollStartTime = Date.now();

      try {
        // Fetch from Virtius API
        const response = await fetch(`https://api.virti.us/session/${state.virtiusSessionId}/json`);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();

        // Store raw API data for score diff engine (Task A5)
        // Extract teams array from meet data
        const teams = data.meet?.teams || [];

        if (teams.length === 0) {
          console.warn('No teams found in API response');
        }

        // Store the latest API data in state
        state.lastApiData = data;
        state.lastApiTeams = teams;

        // Extract team totals and update state.teams with actual data
        // final_score comes as a string from API - convert to float for display
        teams.forEach((apiTeam, idx) => {
          // Match API team to our configured teams by index or name
          const stateTeam = state.teams[idx];
          if (stateTeam) {
            // Convert string final_score to formatted number
            const rawScore = apiTeam.final_score;
            if (rawScore !== null && rawScore !== undefined) {
              const numScore = parseFloat(rawScore);
              stateTeam.total = isNaN(numScore) ? '--' : numScore.toFixed(3);
            }
            // Store API team reference for score diff engine
            stateTeam.apiTeam = apiTeam;
          }
        });

        // Write heartbeat to Firebase on successful poll
        await scoreBugRef.child('heartbeat').set(pollStartTime);

        console.log('Poll successful:', {
          sessionId: state.virtiusSessionId,
          teamCount: teams.length,
          teams: state.teams.map(t => ({ name: t.name, total: t.total }))
        });

        // Process API data - detect changes and write deltas to Firebase
        await processApiData(teams, pollStartTime);

      } catch (err) {
        // Log error - full error handling with backoff is Task A3c
        console.error('Poll failed:', err.message);

        // Still try to write heartbeat even on failure (indicates overlay is running)
        try {
          await scoreBugRef.child('heartbeat').set(pollStartTime);
        } catch (heartbeatErr) {
          console.error('Failed to write heartbeat:', heartbeatErr);
        }
      }
    }

    /**
     * Process API data - detect score changes and write incremental deltas to Firebase.
     * Only writes changed paths, not full data rewrite.
     * @param {Array} apiTeams - Teams array from Virtius API
     * @param {number} pollTimestamp - Timestamp of this poll
     */
    async function processApiData(apiTeams, pollTimestamp) {
      const changedPaths = {};
      let hasChanges = false;

      // Process each team
      apiTeams.forEach((team, teamIdx) => {
        const teamKey = team.short_name || `team${teamIdx + 1}`;

        // Check if team total changed
        const prevTeamTotal = state.previousTeamTotals[teamKey];
        const currTeamTotal = team.final_score;  // string or null

        if (currTeamTotal !== prevTeamTotal) {
          changedPaths[`teams/${teamKey}/finalScore`] = currTeamTotal;
          changedPaths[`teams/${teamKey}/name`] = team.name || teamKey;
          hasChanges = true;
        }

        // Process each event's gymnasts for score changes
        const events = team.events || [];
        events.forEach((event) => {
          const eventKey = event.short_name || event.name || 'unknown';
          const gymnasts = event.gymnasts || [];

          gymnasts.forEach((gymnast) => {
            // Primary key: gymnast_id. Fallback: teamKey|normalizedName
            const gymnastKey = gymnast.gymnast_id ||
              `${teamKey}|${normalizeName(gymnast.full_name)}`;

            const prevScore = state.previousScores[gymnastKey];
            const currScore = gymnast.final_score;  // string or null

            // Score changed (new score OR corrected score)
            if (currScore != null && prevScore !== currScore) {
              // Build gymnast data for Firebase
              const gymnastData = {
                name: gymnast.full_name,
                score: currScore,
                startValue: gymnast.start_value || null,
                execution: gymnast.execution || null,
                difficulty: gymnast.difficulty || null,
                order: gymnast.order,
                event: eventKey,
                team: teamKey,
                timestamp: pollTimestamp
              };

              changedPaths[`teams/${teamKey}/events/${eventKey}/gymnasts/${gymnastKey}`] = gymnastData;
              hasChanges = true;

              console.log('Score change detected:', {
                gymnast: gymnast.full_name,
                event: eventKey,
                team: teamKey,
                prev: prevScore,
                curr: currScore
              });
            }

            // Score removed (rare - inquiry pending)
            if (currScore == null && prevScore != null) {
              changedPaths[`teams/${teamKey}/events/${eventKey}/gymnasts/${gymnastKey}/score`] = null;
              hasChanges = true;
              console.log('Score removed:', { gymnast: gymnast.full_name, event: eventKey });
            }
          });
        });
      });

      // Write to Firebase
      try {
        if (hasChanges) {
          // Write changed paths and reset stale counter
          await scoreBugRef.child('liveData').update({
            ...changedPaths,
            lastDataChangeTimestamp: pollTimestamp,
            stalePollCount: 0
          });
          state.stalePollCount = 0;

          console.log('Wrote incremental deltas to Firebase:', Object.keys(changedPaths).length, 'paths');
        } else {
          // No changes - increment stale counter
          state.stalePollCount++;
          await scoreBugRef.child('liveData').update({
            lastPollTimestamp: pollTimestamp,
            stalePollCount: state.stalePollCount
          });
        }
      } catch (err) {
        console.error('Failed to write liveData:', err);
      }

      // Update previous state for next comparison
      state.previousScores = buildScoreMap(apiTeams);
      state.previousTeamTotals = buildTeamTotalMap(apiTeams);
    }

    /**
     * Build score map from API teams data.
     * @returns {Object} Map of gymnastKey -> finalScore (string)
     */
    function buildScoreMap(apiTeams) {
      const map = {};
      apiTeams.forEach((team, teamIdx) => {
        const teamKey = team.short_name || `team${teamIdx + 1}`;
        const events = team.events || [];

        events.forEach((event) => {
          const gymnasts = event.gymnasts || [];
          gymnasts.forEach((gymnast) => {
            const gymnastKey = gymnast.gymnast_id ||
              `${teamKey}|${normalizeName(gymnast.full_name)}`;
            map[gymnastKey] = gymnast.final_score;  // string or null
          });
        });
      });
      return map;
    }

    /**
     * Build team total map from API teams data.
     * @returns {Object} Map of teamKey -> finalScore (string)
     */
    function buildTeamTotalMap(apiTeams) {
      const map = {};
      apiTeams.forEach((team, teamIdx) => {
        const teamKey = team.short_name || `team${teamIdx + 1}`;
        map[teamKey] = team.final_score;  // string or null
      });
      return map;
    }

    // Initialize Firebase schema with default values (prevents race conditions)
    // Uses update() with null checks - only sets values that don't exist
    async function initializeSchema() {
      const defaultSchema = {
        enabled: false,
        polling: false,
        automationMode: 'auto',
        showLineup: null,
        dismissFlash: {},
        nowCompeting: {},
        detected: {},
        heartbeat: null,
        liveData: {
          lastPollTimestamp: null,
          lastDataChangeTimestamp: null,
          stalePollCount: 0,
          rotation: null,
          totalRotations: null,
          teams: {}
        },
        lastError: null,
        config: {
          pollInterval: 5000,
          flashDuration: 10000,
          showStickIndicator: true
        }
      };

      try {
        // Use transaction to safely initialize schema without overwriting existing values
        await scoreBugRef.transaction((currentData) => {
          if (currentData === null) {
            // No data exists - write full schema
            console.log('Initializing scoreBug schema with defaults');
            return defaultSchema;
          }
          // Data exists - merge defaults for any missing fields only
          const merged = { ...defaultSchema };
          Object.keys(currentData).forEach(key => {
            if (currentData[key] !== undefined) {
              // Keep existing value
              merged[key] = currentData[key];
            }
          });
          // Deep merge for nested objects (config, liveData)
          if (currentData.config) {
            merged.config = { ...defaultSchema.config, ...currentData.config };
          }
          if (currentData.liveData) {
            merged.liveData = { ...defaultSchema.liveData, ...currentData.liveData };
          }
          console.log('Merged existing scoreBug data with defaults');
          return merged;
        });
        console.log('Firebase schema initialized');
      } catch (err) {
        console.error('Failed to initialize schema:', err);
      }
    }

    // Initialize on load
    if (compId) {
      // Order: load config -> render teams -> initialize schema -> start listeners
      loadCompetitionConfig().then((success) => {
        if (!success) return;

        // Render team rows with initial state (before API data)
        renderTeamRows();

        // Initialize Firebase schema (safe defaults)
        return initializeSchema();
      }).then(() => {
        // Start listening for Firebase changes
        initFirebaseListeners();
      });
    }
  </script>
</body>
</html>
