<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Who to Watch</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    .wtw-card {
      position: absolute;
      bottom: var(--who-to-watch-lower-third-wtw-card-bottom, var(--meet-bar-bottom, 120px));
      left: var(--who-to-watch-lower-third-wtw-card-left, var(--meet-bar-left, 100px));
      min-width: var(--who-to-watch-lower-third-wtw-card-min-width, 600px);
      max-width: var(--who-to-watch-lower-third-wtw-card-max-width, 900px);
      animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-100px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .wtw-header {
      background: var(--who-to-watch-lower-third-header-bg, var(--meet-header-bg, #BFBFBF));
      padding: var(--who-to-watch-lower-third-wtw-header-padding-v, 12px) var(--who-to-watch-lower-third-wtw-header-padding-h, 30px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--who-to-watch-lower-third-wtw-header-gap, 20px);
    }

    .wtw-label {
      font-size: var(--who-to-watch-lower-third-wtw-label-font-size, 36px);
      font-weight: var(--who-to-watch-lower-third-wtw-label-font-weight, 900);
      font-family: var(--who-to-watch-lower-third-wtw-label-font-family, 'Inter', sans-serif);
      color: var(--who-to-watch-lower-third-header-text, var(--meet-header-text, #000));
      text-transform: var(--who-to-watch-lower-third-wtw-label-text-transform, uppercase);
      letter-spacing: var(--who-to-watch-lower-third-wtw-label-letter-spacing, -0.5px);
    }

    .wtw-logo {
      width: var(--who-to-watch-lower-third-wtw-logo-size, 50px);
      height: var(--who-to-watch-lower-third-wtw-logo-size, 50px);
      object-fit: contain;
    }

    .wtw-content {
      background: var(--who-to-watch-lower-third-content-bg, var(--meet-content-bg, #000));
      padding: var(--who-to-watch-lower-third-wtw-content-padding-v, 20px) var(--who-to-watch-lower-third-wtw-content-padding-h, 30px);
      display: flex;
      align-items: center;
      gap: var(--who-to-watch-lower-third-wtw-content-gap, 20px);
    }

    .wtw-headshot-container {
      width: var(--who-to-watch-lower-third-wtw-headshot-size, 110px);
      height: var(--who-to-watch-lower-third-wtw-headshot-size, 110px);
      border-radius: var(--who-to-watch-lower-third-wtw-headshot-radius, 50%);
      overflow: hidden;
      background: var(--who-to-watch-lower-third-wtw-headshot-bg, #333);
      border: var(--who-to-watch-lower-third-wtw-headshot-border, 3px) solid var(--who-to-watch-lower-third-wtw-headshot-border-color, #fff);
      flex-shrink: 0;
    }

    .wtw-headshot {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }

    .wtw-headshot-container.no-image {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--who-to-watch-lower-third-wtw-initials-font-size, 40px);
      font-weight: var(--who-to-watch-lower-third-wtw-initials-font-weight, 900);
      color: var(--who-to-watch-lower-third-wtw-initials-color, #666);
    }

    .wtw-info {
      display: flex;
      flex-direction: column;
      gap: var(--who-to-watch-lower-third-wtw-info-gap, 4px);
    }

    .wtw-name {
      font-size: var(--who-to-watch-lower-third-wtw-name-font-size, 32px);
      font-weight: var(--who-to-watch-lower-third-wtw-name-font-weight, 900);
      font-family: var(--who-to-watch-lower-third-wtw-name-font-family, 'Inter', sans-serif);
      color: var(--who-to-watch-lower-third-overlay-text, var(--meet-overlay-text, #fff));
      text-transform: var(--who-to-watch-lower-third-wtw-name-text-transform, uppercase);
      letter-spacing: var(--who-to-watch-lower-third-wtw-name-letter-spacing, -0.5px);
      line-height: var(--who-to-watch-lower-third-wtw-name-line-height, 1.1);
    }

    .wtw-subtitle {
      font-size: var(--who-to-watch-lower-third-wtw-subtitle-font-size, 18px);
      font-weight: var(--who-to-watch-lower-third-wtw-subtitle-font-weight, 400);
      font-family: var(--who-to-watch-lower-third-wtw-subtitle-font-family, 'Inter', sans-serif);
      color: var(--who-to-watch-lower-third-wtw-subtitle-color, #aaa);
      text-transform: var(--who-to-watch-lower-third-wtw-subtitle-text-transform, uppercase);
      letter-spacing: var(--who-to-watch-lower-third-wtw-subtitle-letter-spacing, 0.5px);
    }

    .wtw-stat {
      font-size: var(--who-to-watch-lower-third-wtw-stat-font-size, 18px);
      font-weight: var(--who-to-watch-lower-third-wtw-stat-font-weight, 700);
      font-family: var(--who-to-watch-lower-third-wtw-stat-font-family, 'Inter', sans-serif);
      color: var(--who-to-watch-lower-third-badge-bg, var(--meet-badge-bg, var(--meet-header-bg, #3b82f6)));
      text-transform: var(--who-to-watch-lower-third-wtw-stat-text-transform, uppercase);
      letter-spacing: var(--who-to-watch-lower-third-wtw-stat-letter-spacing, 0.3px);
      margin-top: var(--who-to-watch-lower-third-wtw-stat-margin-top, 4px);
    }
  </style>
</head>
<body>
  <div class="wtw-card">
    <div class="wtw-header">
      <div class="wtw-label">Who to Watch</div>
      <img id="logo" class="wtw-logo" src="" alt="Team">
    </div>
    <div class="wtw-content">
      <div id="headshotContainer" class="wtw-headshot-container">
        <img id="headshot" class="wtw-headshot" src="" alt="">
      </div>
      <div class="wtw-info">
        <div class="wtw-name" id="athleteName">ATHLETE NAME</div>
        <div class="wtw-subtitle" id="subtitle">Team • Year • Apparatus</div>
        <div class="wtw-stat" id="stat"></div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    // Athlete name
    const name = params.get('athleteName') || '';
    document.getElementById('athleteName').textContent = name.toUpperCase();

    // Logo
    const logoEl = document.getElementById('logo');
    const logoUrl = params.get('logo') || params.get('logoUrl') || '';
    if (logoUrl) {
      logoEl.src = logoUrl;
      logoEl.onerror = () => { logoEl.style.display = 'none'; };
    } else {
      logoEl.style.display = 'none';
    }

    // Subtitle
    const subtitle = params.get('subtitle') || params.get('teamName') || '';
    const subtitleEl = document.getElementById('subtitle');
    if (subtitle) {
      subtitleEl.textContent = subtitle.toUpperCase();
    } else {
      subtitleEl.style.display = 'none';
    }

    // Stat line
    const statLabel = params.get('statLabel') || '';
    const statValue = params.get('statValue') || '';
    const statEl = document.getElementById('stat');
    if (statLabel && statValue) {
      statEl.textContent = `${statLabel}: ${statValue}`;
    } else {
      statEl.style.display = 'none';
    }

    // Headshot
    function getInitials(n) {
      if (!n) return '?';
      const parts = n.trim().split(' ');
      if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      return n[0].toUpperCase();
    }

    const headshotEl = document.getElementById('headshot');
    const headshotContainerEl = document.getElementById('headshotContainer');
    const headshotUrl = params.get('headshot') || '';
    if (headshotUrl) {
      headshotEl.src = headshotUrl;
      headshotEl.onerror = () => {
        headshotContainerEl.innerHTML = '';
        headshotContainerEl.classList.add('no-image');
        headshotContainerEl.textContent = getInitials(name);
      };
    } else {
      headshotContainerEl.innerHTML = '';
      headshotContainerEl.classList.add('no-image');
      headshotContainerEl.textContent = getInitials(name);
    }

    // ── Adjustment query params ──
    const card = document.querySelector('.wtw-card');
    const header = document.querySelector('.wtw-header');
    const labelEl = document.querySelector('.wtw-label');
    const nameEl = document.getElementById('athleteName');

    // Badge controls
    const badgeText = params.get('badgeText');
    if (badgeText === '') {
      labelEl.style.display = 'none';
    } else if (badgeText) {
      labelEl.textContent = badgeText.toUpperCase();
    }
    const badgeFontSize = parseInt(params.get('badgeFontSize'));
    if (badgeFontSize) labelEl.style.fontSize = badgeFontSize + 'px';

    // Text sizing
    const nameFontSize = parseInt(params.get('nameFontSize'));
    if (nameFontSize) nameEl.style.fontSize = nameFontSize + 'px';
    const subtitleFontSize = parseInt(params.get('subtitleFontSize'));
    if (subtitleFontSize) subtitleEl.style.fontSize = subtitleFontSize + 'px';
    const statFontSize = parseInt(params.get('statFontSize'));
    if (statFontSize) statEl.style.fontSize = statFontSize + 'px';

    // Headshot size (applied to container)
    const headshotSize = parseInt(params.get('headshotSize'));
    if (headshotSize) {
      headshotContainerEl.style.width = headshotSize + 'px';
      headshotContainerEl.style.height = headshotSize + 'px';
    }
    const showHeadshot = params.get('showHeadshot');
    if (showHeadshot === 'false') {
      headshotContainerEl.style.display = 'none';
    }

    // Headshot position/scale within the circle
    const headshotOffsetY = parseInt(params.get('headshotOffsetY'));
    const headshotScale = parseInt(params.get('headshotScale'));
    if (headshotOffsetY || headshotScale) {
      const s = (headshotScale || 100) / 100;
      const oy = headshotOffsetY || 0;
      headshotEl.style.transform = 'scale(' + s + ') translateY(' + oy + 'px)';
    }

    // Logo size
    const logoSizeParam = parseInt(params.get('logoSize'));
    if (logoSizeParam) {
      logoEl.style.width = logoSizeParam + 'px';
      logoEl.style.height = logoSizeParam + 'px';
    }

    // Card positioning
    const cardBottom = parseInt(params.get('cardBottom'));
    if (cardBottom) card.style.bottom = cardBottom + 'px';
    const cardLeft = parseInt(params.get('cardLeft'));
    if (cardLeft) card.style.left = cardLeft + 'px';
    const cardMinWidth = parseInt(params.get('cardMinWidth'));
    if (cardMinWidth) card.style.minWidth = cardMinWidth + 'px';
    const cardMaxWidth = parseInt(params.get('cardMaxWidth'));
    if (cardMaxWidth) card.style.maxWidth = cardMaxWidth + 'px';

    // Theme color overrides (applied after theme-loader)
    const bgColor = params.get('bgColor');
    const accentColor = params.get('accentColor');
    if (bgColor || accentColor) {
      setTimeout(() => {
        if (bgColor) {
          document.documentElement.style.setProperty('--meet-header-bg', bgColor);
        }
        if (accentColor) {
          document.documentElement.style.setProperty('--meet-content-bg', accentColor);
        }
      }, 600);
    }
  </script>
  <script src="theme-loader.js"></script>
</body>
</html>
