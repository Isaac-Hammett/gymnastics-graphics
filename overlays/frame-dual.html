<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Dual View Frame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }
    /* Same box size as quad view: 920px x 510px, centered vertically */
    /* Vertical center: (1080 - 510) / 2 = 285px from top */
    /* But we need room for logos, so shift down slightly: top at 320px */
    .frame-panel {
      position: absolute;
      width: 920px;
      height: 510px;
      border: var(--frame-dual-frame-border-width, 2px) solid var(--frame-dual-frame-border-color, var(--meet-border-color, white));
      top: 320px;
    }
    .frame-panel.left {
      left: var(--frame-dual-container-left, 40px);
    }
    .frame-panel.right {
      right: var(--frame-dual-container-right, 40px);
    }
    /* Logo header row - all team logos across the top */
    .logo-header {
      position: absolute;
      top: 0;
      left: var(--frame-dual-container-left, 40px);
      right: var(--frame-dual-container-right, 40px);
      height: var(--frame-dual-logo-header-height, 320px);
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    .team-logo {
      height: var(--frame-dual-frame-logo-size, 140px);
      width: auto;
      max-width: var(--frame-dual-frame-logo-max-width, 250px);
      object-fit: contain;
    }
    .virtius-watermark {
      position: absolute;
      display: var(--frame-dual-show-watermark, block);
      bottom: var(--frame-dual-watermark-bottom, 15px);
      right: var(--frame-dual-watermark-right, 50px);
      font-family: 'Inter', sans-serif;
      font-size: var(--frame-dual-watermark-font-size, 24px);
      font-weight: var(--frame-dual-watermark-font-weight, bold);
      color: var(--frame-dual-watermark-color, #6b7280);
    }
    .virtius-watermark .v {
      color: var(--frame-dual-watermark-accent-color, #60a5fa);
    }
  </style>
</head>
<body>
  <div class="logo-header" id="logoHeader"></div>
  <div class="frame-panel left"></div>
  <div class="frame-panel right"></div>
  <div class="virtius-watermark"><span class="v">V</span>irtius</div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const header = document.getElementById('logoHeader');

    // Collect all logos from URL params (supports up to 6 teams)
    for (let i = 1; i <= 7; i++) {
      const logo = params.get(`team${i}Logo`);
      if (logo && logo.trim()) {
        const img = document.createElement('img');
        img.className = 'team-logo';
        img.src = logo;
        img.alt = `Team ${i}`;
        header.appendChild(img);
      }
    }
  </script>
  <script src="theme-loader.js?v=2"></script>
</body>
</html>
