<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Single Frame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }
    .frame-container {
      position: absolute;
      top: var(--frame-single-container-top, 10px);
      left: var(--frame-single-container-left, 40px);
      right: var(--frame-single-container-right, 40px);
      bottom: var(--frame-single-container-bottom, 50px);
    }
    .frame-panel {
      width: 100%;
      height: 100%;
      border: var(--frame-single-frame-border-width, 2px) solid var(--frame-single-frame-border-color, var(--meet-border-color, white));
    }
    .virtius-watermark {
      position: absolute;
      display: var(--frame-single-show-watermark, block);
      bottom: var(--frame-single-watermark-bottom, 15px);
      right: var(--frame-single-watermark-right, 50px);
      font-family: 'Inter', sans-serif;
      font-size: var(--frame-single-watermark-font-size, 24px);
      font-weight: var(--frame-single-watermark-font-weight, bold);
      color: var(--frame-single-watermark-color, #6b7280);
    }
    .virtius-watermark .v {
      color: var(--frame-single-watermark-accent-color, #60a5fa);
    }
  </style>
</head>
<body>
  <div class="frame-container">
    <div class="frame-panel"></div>
  </div>
  <div class="virtius-watermark"><span class="v">V</span>irtius</div>
  <script src="theme-loader.js?v=2"></script>
</body>
</html>
