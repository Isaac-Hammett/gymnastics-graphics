<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Coaches</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    /* Top-anchored so header aligns with stats card when switching graphics */
    .coaches-card {
      position: absolute;
      top: var(--coaches-coaches-top, 780px);
      left: var(--coaches-coaches-left, 100px);
      animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-100px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .coaches-header {
      background: var(--coaches-header-bg, var(--meet-header-bg, #BFBFBF));
      padding: var(--coaches-coaches-header-padding-v, 12px) var(--coaches-coaches-header-padding-h, 40px);
      min-width: var(--coaches-coaches-min-width, 400px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .coaches-title {
      font-size: var(--coaches-coaches-title-font-size, 40px);
      font-weight: var(--coaches-coaches-title-font-weight, 900);
      font-family: var(--coaches-coaches-title-font-family, 'Inter', sans-serif);
      color: var(--coaches-header-text, var(--meet-header-text, #000));
      text-transform: var(--coaches-coaches-title-text-transform, uppercase);
      letter-spacing: var(--coaches-coaches-title-letter-spacing, -0.5px);
    }

    .coaches-logo {
      width: var(--coaches-coaches-logo-size, 60px);
      height: var(--coaches-coaches-logo-size, 60px);
      object-fit: contain;
    }

    .coaches-content {
      background: var(--coaches-content-bg, var(--meet-content-bg, #000));
      padding: var(--coaches-coaches-content-padding-v, 16px) var(--coaches-coaches-content-padding-h, 40px);
      min-width: var(--coaches-coaches-min-width, 400px);
    }

    .coach-name {
      font-size: var(--coaches-coaches-name-font-size, 30px);
      font-weight: var(--coaches-coaches-name-font-weight, 700);
      font-family: var(--coaches-coaches-name-font-family, 'Inter', sans-serif);
      color: var(--coaches-overlay-text, var(--meet-overlay-text, #fff));
      line-height: var(--coaches-coaches-name-line-height, 1.4);
      text-transform: var(--coaches-coaches-name-text-transform, uppercase);
      letter-spacing: var(--coaches-coaches-name-letter-spacing, -0.5px);
    }
  </style>
</head>
<body>
  <div class="coaches-card">
    <div class="coaches-header">
      <div class="coaches-title">COACHES</div>
      <img id="logo" class="coaches-logo" src="" alt="Team">
    </div>
    <div class="coaches-content" id="coachesList">
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('logo').src = params.get('logo') || '';
    const coaches = params.get('coaches') || '';
    const coachesList = document.getElementById('coachesList');

    // Handle both pipe-separated and newline-separated coaches
    const coachArray = coaches.includes('|') ? coaches.split('|') : coaches.split('\n');

    coachArray.forEach(coach => {
      if (coach.trim()) {
        const div = document.createElement('div');
        div.className = 'coach-name';
        div.textContent = coach.trim().toUpperCase();
        coachesList.appendChild(div);
      }
    });
  </script>
  <script src="theme-loader.js?v=2"></script>
</body>
</html>
