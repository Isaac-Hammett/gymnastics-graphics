<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Tri View Center Frame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }
    .frame-container {
      position: absolute;
      top: var(--frame-tri-center-container-top, 10px);
      left: var(--frame-tri-center-container-left, 40px);
      right: var(--frame-tri-center-container-right, 40px);
      bottom: var(--frame-tri-center-container-bottom, 50px);
    }
    .top-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 50%;
    }
    .bottom-row {
      display: flex;
      justify-content: center;
      height: 50%;
    }
    .frame-panel {
      border: var(--frame-tri-center-frame-border-width, 2px) solid var(--frame-tri-center-frame-border-color, var(--meet-border-color, white));
    }
    .frame-panel.top-left {
      border-right: 1px solid var(--frame-tri-center-frame-border-color, var(--meet-border-color, white));
    }
    .frame-panel.top-right {
      border-left: 1px solid var(--frame-tri-center-frame-border-color, var(--meet-border-color, white));
    }
    .frame-panel.bottom-center {
      width: 50%;
    }
    .virtius-watermark {
      position: absolute;
      display: var(--frame-tri-center-show-watermark, block);
      bottom: var(--frame-tri-center-watermark-bottom, 15px);
      right: var(--frame-tri-center-watermark-right, 50px);
      font-family: 'Inter', sans-serif;
      font-size: var(--frame-tri-center-watermark-font-size, 24px);
      font-weight: var(--frame-tri-center-watermark-font-weight, bold);
      color: var(--frame-tri-center-watermark-color, #6b7280);
    }
    .virtius-watermark .v {
      color: var(--frame-tri-center-watermark-accent-color, #60a5fa);
    }
  </style>
</head>
<body>
  <div class="frame-container">
    <div class="top-row">
      <div class="frame-panel top-left"></div>
      <div class="frame-panel top-right"></div>
    </div>
    <div class="bottom-row">
      <div class="frame-panel bottom-center"></div>
    </div>
  </div>
  <div class="virtius-watermark"><span class="v">V</span>irtius</div>
  <script src="theme-loader.js?v=2"></script>
</body>
</html>
