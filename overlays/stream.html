<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Stream</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .stream-title {
      font-size: 64px;
      font-weight: 900;
      color: var(--meet-overlay-text, #000);
      margin-bottom: 60px;
      text-transform: uppercase;
      letter-spacing: -1px;
    }

    /* Single logo (backwards compat) */
    .stream-logo {
      width: 360px;
      height: 360px;
      object-fit: contain;
      margin-bottom: 60px;
    }

    /* Multi-logo container */
    .logos-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      margin-bottom: 60px;
    }

    /* 2 logos: larger with VS */
    .logos-container.dual .team-logo {
      width: 280px;
      height: 280px;
      object-fit: contain;
    }

    .logos-container.dual .vs-text {
      font-size: 60px;
      font-weight: 900;
      color: var(--meet-overlay-text, #000);
      text-transform: uppercase;
    }

    /* 3-4 logos: medium size */
    .logos-container.multi .team-logo {
      width: 200px;
      height: 200px;
      object-fit: contain;
    }

    /* 5-7 logos: smaller size */
    .logos-container.many .team-logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
    }

    .stream-event-name {
      font-size: 64px;
      font-weight: 900;
      color: var(--meet-overlay-text, #000);
      text-transform: uppercase;
      letter-spacing: -1px;
      margin-bottom: 10px;
    }

    .stream-date {
      font-size: 52px;
      font-weight: 800;
      color: var(--meet-overlay-text, #000);
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .stream-branding {
      margin-top: 50px;
    }

    .stream-branding img {
      height: 40px;
      width: auto;
      object-fit: contain;
    }

    /* Stream is used as OBS browser source — keep background transparent */
    body[data-meet-theme] {
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="stream-title" id="title">STREAM STARTING SOON</div>
  <div id="logoSection"></div>
  <div class="stream-event-name" id="eventName"></div>
  <div class="stream-date" id="meetDate"></div>
  <div class="stream-branding"><img src="/assets/virtius-logo.svg" alt="Virtius"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('title').textContent = (params.get('title') || 'STREAM STARTING SOON').toUpperCase();
    document.getElementById('eventName').textContent = (params.get('eventName') || '').toUpperCase();
    document.getElementById('meetDate').textContent = (params.get('meetDate') || '').toUpperCase();

    // Collect all logos from URL params (logo, logo2, logo3, ... logo7)
    const logos = [];
    const logo1 = params.get('logo');
    if (logo1 && logo1.trim()) logos.push(logo1);
    for (let i = 2; i <= 7; i++) {
      const logo = params.get(`logo${i}`);
      if (logo && logo.trim()) logos.push(logo);
    }

    const logoSection = document.getElementById('logoSection');

    if (logos.length === 0) {
      // No logos — show nothing
    } else if (logos.length === 1) {
      // Single logo (backwards compat)
      const img = document.createElement('img');
      img.id = 'logo';
      img.className = 'stream-logo';
      img.src = logos[0];
      img.alt = 'Team';
      logoSection.appendChild(img);
    } else if (logos.length === 2) {
      // Dual logos with VS
      const container = document.createElement('div');
      container.className = 'logos-container dual';

      const img1 = document.createElement('img');
      img1.className = 'team-logo';
      img1.src = logos[0];
      img1.alt = 'Team 1';
      container.appendChild(img1);

      const vs = document.createElement('span');
      vs.className = 'vs-text';
      vs.textContent = 'VS';
      container.appendChild(vs);

      const img2 = document.createElement('img');
      img2.className = 'team-logo';
      img2.src = logos[1];
      img2.alt = 'Team 2';
      container.appendChild(img2);

      logoSection.appendChild(container);
    } else {
      // 3+ logos in a row
      const container = document.createElement('div');
      container.className = 'logos-container ' + (logos.length >= 5 ? 'many' : 'multi');

      logos.forEach((logoUrl, idx) => {
        const img = document.createElement('img');
        img.className = 'team-logo';
        img.src = logoUrl;
        img.alt = `Team ${idx + 1}`;
        container.appendChild(img);
      });

      logoSection.appendChild(container);
    }

    // Override with meet logo when theme is active (event-level graphic)
    // Only applies to single-logo mode
    function checkMeetLogo() {
      const meetLogo = document.body.getAttribute('data-meet-logo');
      const singleLogo = document.getElementById('logo');
      if (meetLogo && singleLogo) {
        singleLogo.src = meetLogo;
      }
    }
    // theme-loader runs async, check after delay and observe for changes
    setTimeout(checkMeetLogo, 500);
    new MutationObserver(checkMeetLogo).observe(document.body, { attributes: true, attributeFilter: ['data-meet-logo'] });
  </script>
  <script src="theme-loader.js?v=2"></script>
</body>
</html>
