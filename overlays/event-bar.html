<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Event Info Bar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    .event-bar {
      position: absolute;
      bottom: 120px;
      left: 100px;
      display: flex;
      flex-direction: row;
      animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-100px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .logo-section {
      width: 100px;
      background: var(--meet-accent-secondary, #BFBFBF);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .logo-section img {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }

    .content-section {
      display: flex;
      flex-direction: column;
    }

    .venue-row {
      background: var(--meet-accent-secondary, #BFBFBF);
      padding: 10px 40px;
      min-width: 600px;
    }

    .venue-text {
      font-size: 36px;
      font-weight: 900;
      color: var(--meet-header-text, #000);
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .details-row {
      background: var(--meet-accent-primary, #000);
      padding: 10px 40px;
    }

    .teams-text {
      font-size: 28px;
      font-weight: 800;
      color: var(--meet-overlay-text, #fff);
      text-transform: uppercase;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .location-text {
      font-size: 24px;
      font-weight: 700;
      color: var(--meet-overlay-text, #fff);
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }
  </style>
</head>
<body>
  <div class="event-bar">
    <div class="logo-section">
      <img id="logo" src="" alt="Team">
    </div>
    <div class="content-section">
      <div class="venue-row">
        <div class="venue-text" id="venue">VENUE NAME</div>
      </div>
      <div class="details-row">
        <div class="teams-text" id="teams">TEAM 1 VS TEAM 2</div>
        <div class="location-text" id="location">CITY, STATE</div>
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('logo').src = params.get('team1Logo') || params.get('logo') || '';
    document.getElementById('venue').textContent = (params.get('venue') || 'VENUE NAME').toUpperCase();

    // Handle teams - either from eventName or construct from team names
    const eventName = params.get('eventName');
    const team1 = params.get('team1Name');
    const team2 = params.get('team2Name');

    if (eventName) {
      document.getElementById('teams').textContent = eventName.toUpperCase();
    } else if (team1 && team2) {
      document.getElementById('teams').textContent = `${team1.toUpperCase()} VS ${team2.toUpperCase()}`;
    }

    document.getElementById('location').textContent = (params.get('location') || 'CITY, STATE').toUpperCase();
  </script>
  <script src="theme-loader.js"></script>
</body>
</html>
