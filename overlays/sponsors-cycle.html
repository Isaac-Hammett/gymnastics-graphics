<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Sponsor Cycle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #E5E5E5;
    }

    #container {
      width: 1920px;
      height: 1080px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sponsor-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    .sponsor-slide.active {
      opacity: 1;
    }

    .sponsor-logo {
      max-width: 1800px;
      max-height: 960px;
      object-fit: contain;
    }

    .no-sponsors-message {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 48px;
      font-weight: 600;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sponsorsParam = params.get('sponsors') || '';

    // Parse sponsors
    let sponsors = [];
    if (sponsorsParam) {
      try {
        sponsors = JSON.parse(sponsorsParam);
        if (!Array.isArray(sponsors)) {
          sponsors = [];
        }
      } catch (e) {
        sponsors = [];
      }
    }

    const container = document.getElementById('container');
    let currentIndex = 0;
    let slides = [];

    // Show message if no sponsors
    if (sponsors.length === 0) {
      container.innerHTML = '<div class="no-sponsors-message">No sponsors configured</div>';
    } else {
      // Create slide for each sponsor
      sponsors.forEach((sponsor, index) => {
        const url = sponsor.url || '';
        if (!url) return; // Skip sponsors without URLs

        const slide = document.createElement('div');
        slide.className = 'sponsor-slide';

        const img = document.createElement('img');
        img.className = 'sponsor-logo';
        img.src = url;
        img.alt = sponsor.name || 'Sponsor';
        img.onerror = () => {
          slide.dataset.broken = 'true';
          if (slide.classList.contains('active')) {
            advanceToNext();
          }
        };
        slide.appendChild(img);

        container.appendChild(slide);
        slides.push(slide);
      });

      // Show first slide if we have any
      if (slides.length > 0) {
        showSlide(0);

        // Only start cycling if more than 1 sponsor
        if (slides.length > 1) {
          setInterval(advanceToNext, 3000);
        }
      } else {
        container.innerHTML = '<div class="no-sponsors-message">No sponsors configured</div>';
      }
    }

    function showSlide(index) {
      // Skip broken slides
      if (slides[index].dataset.broken === 'true') {
        currentIndex = (index + 1) % slides.length;
        if (currentIndex !== index) {
          showSlide(currentIndex);
        }
        return;
      }

      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === index);
      });
      currentIndex = index;
    }

    function advanceToNext() {
      let nextIndex = (currentIndex + 1) % slides.length;
      let attempts = 0;

      while (slides[nextIndex].dataset.broken === 'true' && attempts < slides.length) {
        nextIndex = (nextIndex + 1) % slides.length;
        attempts++;
      }

      if (attempts < slides.length) {
        showSlide(nextIndex);
      }
    }
  </script>
  <script src="theme-loader.js"></script>
</body>
</html>
