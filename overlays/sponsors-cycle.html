<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Our Sponsors</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    .header-bar {
      background: #BFBFBF;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 60px;
    }

    .header-title {
      font-size: 48px;
      font-weight: 900;
      color: #000;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .header-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .sponsor-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 980px;
      padding: 40px;
      position: relative;
    }

    .sponsor-slide {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    .sponsor-slide.active {
      opacity: 1;
    }

    .sponsor-logo {
      max-width: 600px;
      max-height: 500px;
      object-fit: contain;
    }

    .sponsor-name {
      font-size: 36px;
      font-weight: 700;
      color: #000;
      text-align: center;
      max-width: 800px;
    }

    .sponsor-fallback {
      width: 600px;
      height: 400px;
      background: #E5E5E5;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .sponsor-fallback-text {
      font-size: 48px;
      font-weight: 700;
      color: #666;
      text-align: center;
      word-wrap: break-word;
    }

    .no-sponsors-message {
      font-size: 36px;
      font-weight: 700;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="header-title">OUR SPONSORS</div>
    <img id="headerLogo" class="header-logo" src="" alt="Team Logo">
  </div>
  <div id="sponsorDisplay" class="sponsor-display"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const logoUrl = params.get('logo') || '';
    const sponsorsParam = params.get('sponsors') || '';

    // Handle header logo
    const headerLogo = document.getElementById('headerLogo');
    if (logoUrl) {
      headerLogo.src = logoUrl;
      headerLogo.onerror = () => {
        headerLogo.style.display = 'none';
      };
    } else {
      headerLogo.style.display = 'none';
    }

    // Parse sponsors
    let sponsors = [];
    if (sponsorsParam) {
      try {
        sponsors = JSON.parse(sponsorsParam);
        if (!Array.isArray(sponsors)) {
          sponsors = [];
        }
      } catch (e) {
        sponsors = [];
      }
    }

    const display = document.getElementById('sponsorDisplay');
    let currentIndex = 0;
    let brokenCount = 0;
    let textOnlyMode = false;
    let slides = [];
    let cycleInterval = null;

    // Show message if no sponsors
    if (sponsors.length === 0) {
      display.innerHTML = '<div class="no-sponsors-message">No sponsors configured</div>';
    } else {
      // Create slide for each sponsor
      sponsors.forEach((sponsor, index) => {
        const slide = document.createElement('div');
        slide.className = 'sponsor-slide';
        slide.dataset.index = index;

        const name = sponsor.name || 'Sponsor';
        const url = sponsor.url || '';

        if (url) {
          const img = document.createElement('img');
          img.className = 'sponsor-logo';
          img.src = url;
          img.alt = name;
          img.dataset.index = index;
          img.onerror = () => {
            brokenCount++;
            // Check if ALL logos are broken
            if (brokenCount >= sponsors.length) {
              switchToTextOnlyMode();
            } else if (slide.classList.contains('active')) {
              // This was the active slide - skip to next immediately
              advanceToNext();
            }
            // Mark this slide as broken
            slide.dataset.broken = 'true';
          };
          slide.appendChild(img);
        } else {
          // No URL provided - show fallback
          const fallback = document.createElement('div');
          fallback.className = 'sponsor-fallback';
          const fallbackText = document.createElement('div');
          fallbackText.className = 'sponsor-fallback-text';
          fallbackText.textContent = name;
          fallback.appendChild(fallbackText);
          slide.appendChild(fallback);
        }

        const nameEl = document.createElement('div');
        nameEl.className = 'sponsor-name';
        nameEl.textContent = name;
        slide.appendChild(nameEl);

        display.appendChild(slide);
        slides.push(slide);
      });

      // Show first slide
      showSlide(0);

      // Only start cycling if more than 1 sponsor
      if (sponsors.length > 1) {
        cycleInterval = setInterval(advanceToNext, 3000);
      }
    }

    function showSlide(index) {
      // Skip broken slides unless we're in text-only mode
      if (!textOnlyMode && slides[index].dataset.broken === 'true') {
        currentIndex = (index + 1) % slides.length;
        showSlide(currentIndex);
        return;
      }

      slides.forEach((slide, i) => {
        if (i === index) {
          slide.classList.add('active');
        } else {
          slide.classList.remove('active');
        }
      });
      currentIndex = index;
    }

    function advanceToNext() {
      let nextIndex = (currentIndex + 1) % slides.length;
      let attempts = 0;

      // Find next non-broken slide (unless text-only mode)
      while (!textOnlyMode && slides[nextIndex].dataset.broken === 'true' && attempts < slides.length) {
        nextIndex = (nextIndex + 1) % slides.length;
        attempts++;
      }

      // If all slides are broken, we'll switch to text-only mode
      if (attempts >= slides.length) {
        switchToTextOnlyMode();
        return;
      }

      showSlide(nextIndex);
    }

    function switchToTextOnlyMode() {
      textOnlyMode = true;

      // Rebuild slides with text-only fallbacks
      slides.forEach((slide, index) => {
        const name = sponsors[index].name || 'Sponsor';
        slide.innerHTML = '';
        slide.dataset.broken = 'false';

        const fallback = document.createElement('div');
        fallback.className = 'sponsor-fallback';
        const fallbackText = document.createElement('div');
        fallbackText.className = 'sponsor-fallback-text';
        fallbackText.textContent = name;
        fallback.appendChild(fallbackText);
        slide.appendChild(fallback);

        const nameEl = document.createElement('div');
        nameEl.className = 'sponsor-name';
        nameEl.textContent = name;
        slide.appendChild(nameEl);
      });

      // Resume from current position
      showSlide(currentIndex);
    }
  </script>
</body>
</html>
