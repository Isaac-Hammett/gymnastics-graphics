<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Background</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const patternName = params.get('pattern') || 'waves';
  const colors = (params.get('colors') || '#E91E8C,#1a1a2e,#FFFFFF,#000000').split(',');
  const speed = parseFloat(params.get('speed') || '1');
  const intensity = parseFloat(params.get('intensity') || '1');

  function scaleAlpha(hexAlpha, int) {
    var val = parseInt(hexAlpha, 16);
    return Math.min(255, Math.round(val * int)).toString(16).padStart(2, '0');
  }

  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  const state = {};

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // --- Pattern renderers ---

  function renderWaves(ctx, w, h, t, colors) {
    ctx.fillStyle = colors[3] || '#000';
    ctx.fillRect(0, 0, w, h);
    for (let layer = 0; layer < 3; layer++) {
      ctx.globalAlpha = Math.min(1, (0.3 - layer * 0.05) * intensity);
      ctx.fillStyle = colors[layer % colors.length];
      ctx.beginPath();
      ctx.moveTo(0, h);
      for (let x = 0; x <= w; x += 4) {
        const y = h * 0.5 + Math.sin((x / w) * 4 + t * 0.8 + layer * 2) * h * 0.15
          + Math.sin((x / w) * 2 + t * 0.5 + layer) * h * 0.1;
        ctx.lineTo(x, y + layer * h * 0.12);
      }
      ctx.lineTo(w, h);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function renderBokeh(ctx, w, h, t, colors, state) {
    if (!state.circles) {
      state.circles = [];
      for (let i = 0; i < 30; i++) {
        state.circles.push({
          x: Math.random() * w, y: Math.random() * h,
          r: 20 + Math.random() * 80,
          dx: (Math.random() - 0.5) * 0.5, dy: (Math.random() - 0.5) * 0.3,
          color: colors[Math.floor(Math.random() * colors.length)],
          phase: Math.random() * Math.PI * 2,
        });
      }
    }
    ctx.fillStyle = colors[3] || '#000';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < state.circles.length; i++) {
      var c = state.circles[i];
      c.x += c.dx; c.y += c.dy;
      if (c.x < -c.r) c.x = w + c.r;
      if (c.x > w + c.r) c.x = -c.r;
      if (c.y < -c.r) c.y = h + c.r;
      if (c.y > h + c.r) c.y = -c.r;
      var pulse = 1 + Math.sin(t + c.phase) * 0.15;
      var grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r * pulse);
      grad.addColorStop(0, c.color + scaleAlpha('40', intensity));
      grad.addColorStop(0.5, c.color + scaleAlpha('20', intensity));
      grad.addColorStop(1, c.color + '00');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r * pulse, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function renderStripes(ctx, w, h, t, colors) {
    ctx.fillStyle = colors[3] || '#000';
    ctx.fillRect(0, 0, w, h);
    var stripeW = 60;
    var offset = (t * 40) % (stripeW * colors.length);
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate(Math.PI / 4);
    var diag = Math.sqrt(w * w + h * h);
    for (var x = -diag - offset; x < diag; x += stripeW) {
      var idx = Math.abs(Math.floor((x + offset) / stripeW)) % colors.length;
      ctx.globalAlpha = Math.min(1, 0.25 * intensity);
      ctx.fillStyle = colors[idx];
      ctx.fillRect(x, -diag, stripeW * 0.7, diag * 2);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function renderGeometric(ctx, w, h, t, colors) {
    ctx.fillStyle = colors[3] || '#000';
    ctx.fillRect(0, 0, w, h);
    var cellSize = 80;
    var cols = Math.ceil(w / cellSize) + 1;
    var rows = Math.ceil(h / cellSize) + 1;
    for (var row = 0; row < rows; row++) {
      for (var col = 0; col < cols; col++) {
        var x = col * cellSize, y = row * cellSize;
        var colorIdx = (row + col) % (colors.length - 1);
        var phase = Math.sin(t * 0.5 + row * 0.3 + col * 0.2);
        ctx.globalAlpha = Math.min(1, (0.15 + phase * 0.1) * intensity);
        ctx.fillStyle = colors[colorIdx];
        if ((row + col) % 2 === 0) {
          ctx.beginPath();
          ctx.moveTo(x + cellSize / 2, y);
          ctx.lineTo(x + cellSize, y + cellSize / 2);
          ctx.lineTo(x + cellSize / 2, y + cellSize);
          ctx.lineTo(x, y + cellSize / 2);
          ctx.closePath();
          ctx.fill();
        } else {
          var r = (cellSize / 3) * (0.8 + phase * 0.2);
          ctx.beginPath();
          ctx.arc(x + cellSize / 2, y + cellSize / 2, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  function renderParticles(ctx, w, h, t, colors, state) {
    if (!state.particles) {
      state.particles = [];
      for (var i = 0; i < 60; i++) {
        state.particles.push({
          x: Math.random() * w, y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.5) * 0.8,
          r: 2 + Math.random() * 3,
          color: colors[Math.floor(Math.random() * (colors.length - 1))],
        });
      }
    }
    ctx.fillStyle = (colors[3] || '#000') + 'E0';
    ctx.fillRect(0, 0, w, h);
    var p = state.particles;
    for (var i = 0; i < p.length; i++) {
      p[i].x += p[i].vx; p[i].y += p[i].vy;
      if (p[i].x < 0) p[i].x = w;
      if (p[i].x > w) p[i].x = 0;
      if (p[i].y < 0) p[i].y = h;
      if (p[i].y > h) p[i].y = 0;
    }
    ctx.strokeStyle = colors[0] + '30';
    ctx.lineWidth = 0.5;
    for (var i = 0; i < p.length; i++) {
      for (var j = i + 1; j < p.length; j++) {
        var dx = p[i].x - p[j].x, dy = p[i].y - p[j].y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.globalAlpha = (1 - dist / 120) * 0.3;
          ctx.beginPath();
          ctx.moveTo(p[i].x, p[i].y);
          ctx.lineTo(p[j].x, p[j].y);
          ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 0.8;
    for (var i = 0; i < p.length; i++) {
      ctx.fillStyle = p[i].color;
      ctx.beginPath();
      ctx.arc(p[i].x, p[i].y, p[i].r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function renderGradient(ctx, w, h, t, colors) {
    var cx = w / 2 + Math.cos(t * 0.3) * w * 0.2;
    var cy = h / 2 + Math.sin(t * 0.2) * h * 0.2;
    var radius = Math.max(w, h) * 0.8;
    var grad = ctx.createRadialGradient(cx, cy, 0, w / 2, h / 2, radius);
    grad.addColorStop(0, colors[0]);
    grad.addColorStop(0.4, colors[1] || colors[0]);
    grad.addColorStop(0.7, colors[2] || colors[1] || colors[0]);
    grad.addColorStop(1, colors[3] || '#000');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  }

  function renderCornerPulse(ctx, w, h, t, colors) {
    ctx.fillStyle = colors[3] || '#000';
    ctx.fillRect(0, 0, w, h);
    var corners = [[0,0],[w,0],[w,h],[0,h]];
    for (var i = 0; i < 4; i++) {
      var cx = corners[i][0], cy = corners[i][1];
      var pulse = 0.4 + Math.sin(t * 0.6 + i * Math.PI / 2) * 0.25;
      var radius = Math.max(w, h) * (0.4 + pulse * 0.3);
      var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
      grad.addColorStop(0, colors[i % colors.length] + scaleAlpha('35', intensity));
      grad.addColorStop(0.5, colors[i % colors.length] + scaleAlpha('12', intensity));
      grad.addColorStop(1, colors[i % colors.length] + '00');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
    }
  }

  function renderAurora(ctx, w, h, t, colors) {
    ctx.fillStyle = colors[3] || '#000';
    ctx.fillRect(0, 0, w, h);
    for (var band = 0; band < 5; band++) {
      var color = colors[band % (colors.length - 1)];
      ctx.globalAlpha = Math.min(1, (0.12 + Math.sin(t * 0.3 + band) * 0.06) * intensity);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      for (var x = 0; x <= w; x += 4) {
        var baseY = h * (0.15 + band * 0.1);
        var y = baseY + Math.sin((x/w)*3 + t*0.4 + band*1.5)*h*0.08 + Math.sin((x/w)*7 + t*0.7 + band)*h*0.03;
        ctx.lineTo(x, y);
      }
      for (var x2 = w; x2 >= 0; x2 -= 4) {
        var baseY2 = h * (0.15 + band * 0.1) + h * 0.12;
        var y2 = baseY2 + Math.sin((x2/w)*3 + t*0.4 + band*1.5 + 1)*h*0.06 + Math.sin((x2/w)*5 + t*0.6 + band)*h*0.04;
        ctx.lineTo(x2, y2);
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function renderRipple(ctx, w, h, t, colors) {
    ctx.fillStyle = colors[3] || '#000';
    ctx.fillRect(0, 0, w, h);
    var cx = w/2, cy = h/2, maxR = Math.sqrt(cx*cx + cy*cy), ringCount = 8;
    for (var i = 0; i < ringCount; i++) {
      var phase = (t * 0.5 + i / ringCount) % 1;
      var r = phase * maxR;
      ctx.globalAlpha = Math.min(1, (1 - phase) * 0.3 * intensity);
      ctx.strokeStyle = colors[i % (colors.length - 1)];
      ctx.lineWidth = 3 + (1 - phase) * 4;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function renderSmoke(ctx, w, h, t, colors, state) {
    if (!state.clouds) {
      state.clouds = [];
      for (var i = 0; i < 12; i++) {
        state.clouds.push({
          x: Math.random()*w, y: h*0.3 + Math.random()*h*0.5,
          rx: 100 + Math.random()*200, ry: 40 + Math.random()*80,
          dx: (Math.random()-0.5)*0.4, phase: Math.random()*Math.PI*2,
          color: colors[i % (colors.length - 1)],
        });
      }
    }
    ctx.fillStyle = colors[3] || '#000';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < state.clouds.length; i++) {
      var c = state.clouds[i];
      c.x += c.dx;
      if (c.x < -c.rx*2) c.x = w + c.rx;
      if (c.x > w + c.rx*2) c.x = -c.rx;
      var pulse = 1 + Math.sin(t*0.3 + c.phase)*0.2;
      var grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.rx*pulse);
      grad.addColorStop(0, c.color + scaleAlpha('18', intensity));
      grad.addColorStop(0.6, c.color + scaleAlpha('0A', intensity));
      grad.addColorStop(1, c.color + '00');
      ctx.fillStyle = grad;
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(1, c.ry / c.rx);
      ctx.beginPath();
      ctx.arc(0, 0, c.rx*pulse, 0, Math.PI*2);
      ctx.restore();
      ctx.fill();
    }
  }

  function renderHexagons(ctx, w, h, t, colors) {
    ctx.fillStyle = colors[3] || '#000';
    ctx.fillRect(0, 0, w, h);
    var size = 40, hGap = size*1.75, vGap = size*1.5;
    var cols = Math.ceil(w/hGap)+2, rows = Math.ceil(h/vGap)+2;
    for (var row = -1; row < rows; row++) {
      for (var col = -1; col < cols; col++) {
        var cx = col*hGap + (row%2)*hGap*0.5, cy = row*vGap;
        var dist = Math.sqrt(Math.pow(cx-w/2,2) + Math.pow(cy-h/2,2));
        var phase = Math.sin(t*0.4 + dist*0.005);
        var colorIdx = Math.abs(row+col) % (colors.length-1);
        ctx.globalAlpha = Math.min(1, (0.08 + phase*0.08) * intensity);
        ctx.fillStyle = colors[colorIdx];
        ctx.strokeStyle = colors[colorIdx] + scaleAlpha('30', intensity);
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (var a = 0; a < 6; a++) {
          var angle = (Math.PI/3)*a - Math.PI/6;
          var px = cx + size*Math.cos(angle), py = cy + size*Math.sin(angle);
          if (a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  function renderStarfield(ctx, w, h, t, colors, state) {
    if (!state.stars) {
      state.stars = [];
      for (var i = 0; i < 150; i++) {
        state.stars.push({x:Math.random()*w, y:Math.random()*h, z:Math.random(), phase:Math.random()*Math.PI*2});
      }
    }
    ctx.fillStyle = colors[3] || '#000';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < state.stars.length; i++) {
      var s = state.stars[i];
      s.x -= s.z*0.5 + 0.1;
      if (s.x < 0) { s.x = w; s.y = Math.random()*h; }
      var twinkle = 0.4 + Math.sin(t*2 + s.phase)*0.4;
      var r = 0.5 + s.z*2;
      var colorIdx = Math.floor(s.phase) % (colors.length-1);
      ctx.globalAlpha = Math.min(1, twinkle * s.z * intensity);
      ctx.fillStyle = colors[colorIdx];
      ctx.beginPath();
      ctx.arc(s.x, s.y, r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function renderLava(ctx, w, h, t, colors) {
    ctx.fillStyle = colors[3] || '#000';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 6; i++) {
      var cx = w*(0.2+0.6*(i/6)) + Math.sin(t*0.3+i*2)*w*0.1;
      var cy = h*0.5 + Math.sin(t*0.2+i*1.5)*h*0.3;
      var rx = 80 + Math.sin(t*0.4+i)*30;
      var ry = 100 + Math.cos(t*0.3+i*0.7)*40;
      var color = colors[i % (colors.length-1)];
      var grad = ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(rx,ry));
      grad.addColorStop(0, color+scaleAlpha('50', intensity));
      grad.addColorStop(0.5, color+scaleAlpha('20', intensity));
      grad.addColorStop(1, color+'00');
      ctx.fillStyle = grad;
      ctx.save();
      ctx.translate(cx,cy);
      ctx.scale(1, ry/rx);
      ctx.beginPath();
      ctx.arc(0,0,rx,0,Math.PI*2);
      ctx.restore();
      ctx.fill();
    }
  }

  function renderScanlines(ctx, w, h, t, colors) {
    var grad = ctx.createLinearGradient(0,0,w,h);
    grad.addColorStop(0, colors[3]||'#000');
    grad.addColorStop(0.5, colors[1]+'40');
    grad.addColorStop(1, colors[3]||'#000');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);
    var lineH = 3;
    var sweep = ((t*60) % (h+200)) - 100;
    for (var y = 0; y < h; y += lineH*2) {
      var distFromSweep = Math.abs(y - sweep);
      var glow = Math.max(0, 1 - distFromSweep/100);
      ctx.globalAlpha = Math.min(1, (0.03 + glow*0.15) * intensity);
      ctx.fillStyle = glow > 0.3 ? colors[0] : (colors[2]||'#333');
      ctx.fillRect(0,y,w,lineH);
    }
    ctx.globalAlpha = 0.1;
    var sweepGrad = ctx.createLinearGradient(0,sweep-50,0,sweep+50);
    sweepGrad.addColorStop(0, colors[0]+'00');
    sweepGrad.addColorStop(0.5, colors[0]+'30');
    sweepGrad.addColorStop(1, colors[0]+'00');
    ctx.fillStyle = sweepGrad;
    ctx.fillRect(0,sweep-50,w,100);
    ctx.globalAlpha = 1;
  }

  function renderPrism(ctx, w, h, t, colors) {
    ctx.fillStyle = colors[3] || '#000';
    ctx.fillRect(0,0,w,h);
    var cx = w/2, cy = h/2, maxLen = Math.max(w,h), rayCount = 24;
    for (var i = 0; i < rayCount; i++) {
      var angle = (i/rayCount)*Math.PI*2 + t*0.15;
      var width = (Math.PI*2/rayCount)*0.4;
      var pulse = 0.5 + Math.sin(t*0.8 + i*0.5)*0.3;
      ctx.globalAlpha = Math.min(1, (0.08 + pulse*0.07) * intensity);
      ctx.fillStyle = colors[i % (colors.length-1)];
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,maxLen,angle-width/2,angle+width/2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function renderVignette(ctx, w, h, t, colors) {
    ctx.fillStyle = colors[3] || '#000';
    ctx.fillRect(0,0,w,h);
    var breath = 0.6 + Math.sin(t*0.4)*0.2;
    var innerR = Math.min(w,h)*(0.2 + breath*0.2);
    var outerR = Math.max(w,h)*0.9;
    var grad = ctx.createRadialGradient(w/2,h/2,innerR,w/2,h/2,outerR);
    grad.addColorStop(0, (colors[3]||'#000')+'00');
    grad.addColorStop(0.4, colors[1]+scaleAlpha('20', intensity));
    grad.addColorStop(0.7, colors[0]+scaleAlpha('40', intensity));
    grad.addColorStop(1, colors[0]+scaleAlpha('60', intensity));
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);
    var wash = 0.5 + Math.sin(t*0.25+1)*0.3;
    ctx.globalAlpha = Math.min(1, wash*0.08*intensity);
    ctx.fillStyle = colors[2] || colors[0];
    ctx.fillRect(0,0,w,h);
    ctx.globalAlpha = 1;
  }

  var patterns = {
    waves: renderWaves,
    bokeh: renderBokeh,
    stripes: renderStripes,
    geometric: renderGeometric,
    particles: renderParticles,
    gradient: renderGradient,
    cornerPulse: renderCornerPulse,
    aurora: renderAurora,
    ripple: renderRipple,
    smoke: renderSmoke,
    hexagons: renderHexagons,
    starfield: renderStarfield,
    lava: renderLava,
    scanlines: renderScanlines,
    prism: renderPrism,
    vignette: renderVignette,
  };

  var renderFn = patterns[patternName] || patterns.waves;
  var startTime = performance.now();

  function frame(now) {
    var t = ((now - startTime) / 1000) * speed;
    renderFn(ctx, canvas.width, canvas.height, t, colors, state);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
