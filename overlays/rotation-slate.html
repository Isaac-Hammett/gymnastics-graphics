<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Rotation Slate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: 'Inter', sans-serif;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background-color: var(--meet-overlay-bg, #E5E5E5);
      display: flex;
      flex-direction: row;
    }

    .logo-section {
      flex: 0 0 700px;
      height: 100%;
      background: var(--meet-accent-secondary, #f0f0f0);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: slideRight 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideRight {
      from { opacity: 0; transform: translateX(-60px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .team-logo {
      width: 500px;
      height: 500px;
      object-fit: contain;
    }

    .content-section {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 100px 120px;
      background-color: var(--meet-overlay-bg, #E5E5E5);
      animation: fadeIn 0.6s ease-out 0.2s both;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .meet-name {
      font-size: 86px;
      font-weight: 700;
      color: var(--meet-overlay-text, #222);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 50px;
      line-height: 1.1;
    }

    .divider {
      width: 200px;
      height: 10px;
      background: var(--meet-border-color, #111);
      border-radius: 5px;
      margin-bottom: 50px;
    }

    .rotation-label {
      font-size: 64px;
      font-weight: 600;
      color: var(--meet-overlay-text, #666);
      text-transform: uppercase;
      letter-spacing: 16px;
      margin-bottom: 10px;
    }

    .rotation-number {
      font-size: 500px;
      font-weight: 900;
      color: var(--meet-overlay-text, #111);
      line-height: 0.75;
      letter-spacing: -20px;
    }
  </style>
</head>
<body>
  <div class="logo-section">
    <img id="logo" class="team-logo" src="" alt="Team Logo">
  </div>
  <div class="content-section">
    <div id="meetName" class="meet-name">MEET NAME</div>
    <div class="divider"></div>
    <div class="rotation-label">Rotation</div>
    <div id="rotationNumber" class="rotation-number">1</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    // Get parameters
    const logo = params.get('logo') || params.get('team1Logo') || '';
    const meetName = params.get('meetName') || params.get('eventName') || 'GYMNASTICS';
    const rotation = params.get('rotation') || '1';

    // Set logo
    const logoEl = document.getElementById('logo');
    if (logo) {
      logoEl.src = logo;
    } else {
      logoEl.style.display = 'none';
    }

    // Set meet name
    document.getElementById('meetName').textContent = meetName;

    // Set rotation number
    document.getElementById('rotationNumber').textContent = rotation;
  </script>
  <script src="theme-loader.js"></script>
</body>
</html>
