<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Team Header Frame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }
    .header-row {
      position: absolute;
      top: var(--frame-team-header-container-top, 30px);
      left: var(--frame-team-header-container-left, 40px);
      right: var(--frame-team-header-container-right, 40px);
      height: var(--frame-team-header-logo-header-height, 140px);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .team-logo {
      height: var(--frame-team-header-frame-logo-size, 120px);
      width: auto;
      max-width: var(--frame-team-header-frame-logo-max-width, 200px);
      object-fit: contain;
    }
    .frame-container {
      position: absolute;
      top: 200px;
      left: var(--frame-team-header-container-left, 40px);
      right: var(--frame-team-header-container-right, 40px);
      bottom: var(--frame-team-header-container-bottom, 50px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--frame-team-header-frame-gap, 0);
    }
    .frame-panel {
      border: var(--frame-team-header-frame-border-width, 2px) solid var(--frame-team-header-frame-border-color, var(--meet-border-color, white));
    }
    .frame-panel:first-child {
      border-right: 1px solid var(--frame-team-header-frame-border-color, var(--meet-border-color, white));
    }
    .frame-panel:last-child {
      border-left: 1px solid var(--frame-team-header-frame-border-color, var(--meet-border-color, white));
    }
    .virtius-watermark {
      position: absolute;
      display: var(--frame-team-header-show-watermark, block);
      bottom: var(--frame-team-header-watermark-bottom, 15px);
      right: var(--frame-team-header-watermark-right, 50px);
      font-family: 'Inter', sans-serif;
      font-size: var(--frame-team-header-watermark-font-size, 24px);
      font-weight: var(--frame-team-header-watermark-font-weight, bold);
      color: var(--frame-team-header-watermark-color, #6b7280);
    }
    .virtius-watermark .v {
      color: var(--frame-team-header-watermark-accent-color, #60a5fa);
    }
  </style>
</head>
<body>
  <div class="header-row" id="logoHeader">
    <!-- Logos will be dynamically inserted -->
  </div>
  <div class="frame-container">
    <div class="frame-panel"></div>
    <div class="frame-panel"></div>
  </div>
  <div class="virtius-watermark"><span class="v">V</span>irtius</div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const header = document.getElementById('logoHeader');

    // Collect all logos from URL params
    const logos = [];
    for (let i = 1; i <= 7; i++) {
      const logo = params.get(`team${i}Logo`);
      if (logo && logo.trim()) {
        logos.push(logo);
      }
    }

    // Create logo elements
    logos.forEach((logo, index) => {
      const img = document.createElement('img');
      img.className = 'team-logo';
      img.src = logo;
      img.alt = `Team ${index + 1}`;
      header.appendChild(img);
    });
  </script>
  <script src="theme-loader.js?v=2"></script>
</body>
</html>
