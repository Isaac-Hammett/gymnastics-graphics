# Model configuration for agent-team runs. `.env` can override any line; the real environment wins over both.
# Precedence at run time: explicit override > `model:<alias>` label on the ticket > MODEL_<role> > MODEL_DEFAULT.
# IDs checked against the claude-api reference on 2026-09-27 (Haiku 4.5 $1/$5, Sonnet 5 $2/$10, Opus 5 $5/$25 per MTok).

MODEL_DEFAULT=claude-sonnet-5
FALLBACK_MODEL=claude-sonnet-5

MODEL_alias_haiku=claude-haiku-4-5
MODEL_alias_sonnet=claude-sonnet-5
MODEL_alias_opus=claude-opus-5
MODEL_alias_fable=claude-fable-5-1

# ticket roles
MODEL_graphics=claude-sonnet-5
MODEL_frontend=claude-sonnet-5
MODEL_server=claude-sonnet-5
MODEL_data=claude-sonnet-5
MODEL_docs=claude-haiku-4-5

# system roles
MODEL_verify=claude-sonnet-5
MODEL_planner=claude-sonnet-5
MODEL_reviewer=claude-opus-5
