<!-- TalentView — Commentator Clip Info Screen -->
<!-- Task 1.1: Current content display with mode-specific layouts -->

<style>
/* === CSS Variables (from style guide) === */
:root {
  --bg-primary: #0a0a0b;
  --bg-secondary: #18181b;
  --bg-tertiary: #27272a;
  --text-primary: #e4e4e7;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --border-color: #3f3f46;

  /* Apparatus Colors */
  --clip-apparatus-vt: #ef4444;
  --clip-apparatus-ub: #a855f7;
  --clip-apparatus-bb: #3b82f6;
  --clip-apparatus-fx: #22c55e;
  --clip-apparatus-ph: #f97316;
  --clip-apparatus-sr: #14b8a6;
  --clip-apparatus-pb: #6366f1;
  --clip-apparatus-hb: #f59e0b;

  /* Mode Colors */
  --clip-mode-live-bg: rgba(34, 197, 94, 0.2);
  --clip-mode-live-text: #4ade80;
  --clip-mode-live-border: #22c55e;

  --clip-mode-clip-bg: rgba(34, 197, 94, 0.2);
  --clip-mode-clip-text: #4ade80;
  --clip-mode-clip-border: #22c55e;

  --clip-mode-replay-bg: rgba(6, 182, 212, 0.2);
  --clip-mode-replay-text: #22d3ee;
  --clip-mode-replay-border: #06b6d4;

  --clip-mode-fallback-bg: rgba(113, 113, 122, 0.15);
  --clip-mode-fallback-text: #a1a1aa;
  --clip-mode-fallback-border: #52525b;
}

/* === TalentView Layout === */
.talent-view {
  background: var(--bg-primary);
  min-height: 100vh;
  padding: 16px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: var(--text-primary);
}

.talent-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-color);
}

.talent-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin: 0;
}

/* === Mode Badge === */
.clip-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 9999px;
  font-size: 0.625rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.clip-badge-clip {
  background: var(--clip-mode-clip-bg);
  color: var(--clip-mode-clip-text);
}

.clip-badge-live {
  background: var(--clip-mode-live-bg);
  color: var(--clip-mode-live-text);
}

.clip-badge-replay {
  background: var(--clip-mode-replay-bg);
  color: var(--clip-mode-replay-text);
}

.clip-badge-fallback {
  background: var(--clip-mode-fallback-bg);
  color: var(--clip-mode-fallback-text);
}

/* Apparatus badge */
.clip-badge-apparatus {
  background: rgba(255, 255, 255, 0.1);
  padding: 2px 6px;
  font-size: 0.625rem;
  font-weight: 700;
}

.clip-badge-ub { color: var(--clip-apparatus-ub); }
.clip-badge-vt { color: var(--clip-apparatus-vt); }
.clip-badge-bb { color: var(--clip-apparatus-bb); }
.clip-badge-fx { color: var(--clip-apparatus-fx); }

/* === NOW SHOWING Card === */
.now-showing-card {
  background: var(--bg-secondary);
  border: 2px solid var(--clip-mode-clip-border);
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 16px;
}

.now-showing-card--live {
  border-color: var(--clip-mode-live-border);
}

.now-showing-card--replay {
  border-color: var(--clip-mode-replay-border);
}

.now-showing-card--fallback {
  border-color: var(--clip-mode-fallback-border);
}

.now-showing-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.now-showing-content {
  display: flex;
  gap: 20px;
  align-items: flex-start;
}

/* Athlete photo placeholder */
.athlete-photo {
  width: 80px;
  height: 100px;
  border-radius: 6px;
  background: var(--bg-tertiary);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.athlete-photo-placeholder {
  font-size: 32px;
  color: var(--text-muted);
}

.athlete-info {
  flex: 1;
  min-width: 0;
}

.athlete-name {
  font-size: 24px;
  font-weight: 600;
  color: var(--text-primary);
  margin: 0 0 8px 0;
  line-height: 1.2;
}

.athlete-apparatus {
  font-size: 14px;
  color: var(--text-secondary);
  margin: 0 0 4px 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.athlete-team {
  font-size: 14px;
  color: var(--text-secondary);
  margin: 0 0 16px 0;
}

/* Score display - always visible to commentator */
.athlete-score {
  font-size: 28px;
  font-weight: 700;
  margin: 0;
  font-variant-numeric: tabular-nums;
}

.athlete-score--has-value {
  color: var(--text-primary);
}

.athlete-score--pending {
  color: var(--text-muted);
  font-style: italic;
  font-weight: 400;
  font-size: 18px;
}

.score-visibility-hint {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
  font-style: italic;
}

/* === Mode-specific display messages === */
.mode-message {
  background: var(--bg-tertiary);
  border-radius: 6px;
  padding: 16px;
  text-align: center;
  margin-bottom: 16px;
}

.mode-message__icon {
  font-size: 32px;
  margin-bottom: 8px;
}

.mode-message__title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin: 0 0 4px 0;
}

.mode-message__subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  margin: 0;
}

/* Fallback state (no clip playing) */
.fallback-display {
  border-color: var(--clip-mode-fallback-border);
}

.fallback-display .now-showing-content {
  opacity: 0.5;
}

/* Live mode indicator */
.live-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.live-indicator__dot {
  width: 8px;
  height: 8px;
  background: var(--clip-mode-live-text);
  border-radius: 50%;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* === Demo Mode Switcher === */
.demo-controls {
  position: fixed;
  bottom: 16px;
  left: 16px;
  right: 16px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 12px;
  z-index: 100;
}

.demo-controls__label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.demo-controls__buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.demo-btn {
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 500;
  border-radius: 6px;
  border: 1px solid var(--border-color);
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 150ms;
}

.demo-btn:hover {
  background: var(--bg-secondary);
  color: var(--text-primary);
}

.demo-btn--active {
  background: #3b82f6;
  color: white;
  border-color: #3b82f6;
}
</style>

<section class="talent-view" id="talentView">
  <!-- Header with mode badge -->
  <header class="talent-header">
    <h1 class="talent-title">Talent View</h1>
    <span class="clip-badge clip-badge-clip" id="modeBadge" aria-label="Current mode: Clip">CLIP</span>
  </header>

  <!-- NOW SHOWING Card (CLIP mode - default) -->
  <article class="now-showing-card" id="nowShowingCard" role="region" aria-labelledby="nowShowingLabel">
    <div class="now-showing-label" id="nowShowingLabel">
      <span>Now Showing</span>
    </div>

    <div class="now-showing-content">
      <!-- Athlete photo area -->
      <div class="athlete-photo" aria-hidden="true">
        <span class="athlete-photo-placeholder">H</span>
      </div>

      <!-- Athlete info -->
      <div class="athlete-info">
        <h2 class="athlete-name" id="athleteName">Hailey Kriz</h2>
        <p class="athlete-apparatus">
          <span class="clip-badge clip-badge-apparatus clip-badge-ub">UB</span>
          <span id="apparatusName">Uneven Bars</span>
        </p>
        <p class="athlete-team" id="teamName">Yale University</p>

        <!-- Score - always visible to commentator -->
        <p class="athlete-score athlete-score--has-value" id="athleteScore">9.875</p>
        <p class="score-visibility-hint" id="scoreHint">Shown to viewers at ~60% of clip</p>
      </div>
    </div>
  </article>

  <!-- LIVE mode display (hidden by default) -->
  <div class="mode-message" id="liveMessage" style="display: none;">
    <div class="mode-message__icon">
      <span class="live-indicator">
        <span class="live-indicator__dot"></span>
      </span>
    </div>
    <h3 class="mode-message__title">Live Camera Feed</h3>
    <p class="mode-message__subtitle">Camera 2 — Uneven Bars</p>
  </div>

  <!-- REPLAY mode display (hidden by default) -->
  <div class="mode-message" id="replayMessage" style="display: none;">
    <div class="mode-message__icon">&#9658;</div>
    <h3 class="mode-message__title">Moment Replay</h3>
    <p class="mode-message__subtitle">Hailey Kriz — Pak salto release at 0.5x</p>
  </div>

  <!-- FALLBACK mode display (hidden by default) -->
  <div class="mode-message" id="fallbackMessage" style="display: none;">
    <div class="mode-message__icon">&#9679;</div>
    <h3 class="mode-message__title">Standby</h3>
    <p class="mode-message__subtitle">Waiting for next clip...</p>
  </div>

  <!-- Demo mode switcher -->
  <div class="demo-controls">
    <div class="demo-controls__label">Demo Mode</div>
    <div class="demo-controls__buttons">
      <button class="demo-btn demo-btn--active" data-mode="clip">CLIP</button>
      <button class="demo-btn" data-mode="live">LIVE</button>
      <button class="demo-btn" data-mode="replay">REPLAY</button>
      <button class="demo-btn" data-mode="fallback">FALLBACK</button>
      <button class="demo-btn" data-mode="pending">Score Pending</button>
    </div>
  </div>
</section>

<script>
(function() {
  const state = {
    mode: 'clip',
    scorePending: false,
    data: {
      clip: {
        athleteName: 'Hailey Kriz',
        apparatus: 'UB',
        apparatusName: 'Uneven Bars',
        team: 'Yale University',
        score: 9.875
      },
      live: {
        camera: 2,
        apparatus: 'Uneven Bars'
      },
      replay: {
        athleteName: 'Hailey Kriz',
        moment: 'Pak salto release',
        speed: '0.5x'
      }
    }
  };

  const elements = {
    modeBadge: document.getElementById('modeBadge'),
    nowShowingCard: document.getElementById('nowShowingCard'),
    athleteName: document.getElementById('athleteName'),
    athleteScore: document.getElementById('athleteScore'),
    scoreHint: document.getElementById('scoreHint'),
    liveMessage: document.getElementById('liveMessage'),
    replayMessage: document.getElementById('replayMessage'),
    fallbackMessage: document.getElementById('fallbackMessage')
  };

  function updateMode(mode, scorePending = false) {
    state.mode = mode;
    state.scorePending = scorePending;

    // Update badge
    const badgeClasses = {
      clip: 'clip-badge-clip',
      live: 'clip-badge-live',
      replay: 'clip-badge-replay',
      fallback: 'clip-badge-fallback'
    };

    elements.modeBadge.className = 'clip-badge ' + (badgeClasses[mode] || 'clip-badge-clip');
    elements.modeBadge.textContent = mode.toUpperCase();
    elements.modeBadge.setAttribute('aria-label', 'Current mode: ' + mode);

    // Update card border
    const cardClasses = {
      clip: '',
      live: 'now-showing-card--live',
      replay: 'now-showing-card--replay',
      fallback: 'now-showing-card--fallback fallback-display'
    };

    elements.nowShowingCard.className = 'now-showing-card ' + (cardClasses[mode] || '');

    // Show/hide mode-specific messages
    elements.liveMessage.style.display = mode === 'live' ? 'block' : 'none';
    elements.replayMessage.style.display = mode === 'replay' ? 'block' : 'none';
    elements.fallbackMessage.style.display = mode === 'fallback' ? 'block' : 'none';
    elements.nowShowingCard.style.display = (mode === 'live' || mode === 'fallback') ? 'none' : 'block';

    // Update score display
    if (scorePending) {
      elements.athleteScore.className = 'athlete-score athlete-score--pending';
      elements.athleteScore.textContent = 'Score: pending';
      elements.scoreHint.textContent = 'Score will appear when posted';
    } else {
      elements.athleteScore.className = 'athlete-score athlete-score--has-value';
      elements.athleteScore.textContent = state.data.clip.score.toFixed(3);
      elements.scoreHint.textContent = 'Shown to viewers at ~60% of clip';
    }

    // Update demo button states
    document.querySelectorAll('.demo-btn').forEach(btn => {
      btn.classList.toggle('demo-btn--active',
        btn.dataset.mode === mode || (btn.dataset.mode === 'pending' && scorePending));
    });
  }

  // Demo button handlers
  document.querySelectorAll('.demo-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const mode = this.dataset.mode;
      if (mode === 'pending') {
        updateMode('clip', true);
      } else {
        updateMode(mode, false);
      }
    });
  });

  // Initialize
  updateMode('clip');
})();
</script>
