<!-- Producer View — Live Playout Dashboard -->
<!-- Task 1.1: Playout Status Bar -->

<style>
  /* === Playout Status Bar === */
  .playout-status-bar {
    background: var(--bg-secondary, #18181b);
    border: 1px solid var(--border-color, #3f3f46);
    border-radius: 8px;
    padding: 16px;
  }

  .playout-status-bar--autonomous {
    border-left: 3px solid var(--clip-mode-live-border, #22c55e);
  }

  .playout-status-bar--override {
    border-left: 3px solid var(--clip-mode-override-border, #f59e0b);
  }

  .playout-status-bar--paused {
    border-left: 3px solid var(--clip-mode-paused-border, #eab308);
  }

  .playout-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .playout-header__title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary, #e4e4e7);
  }

  .playout-header__play-icon {
    width: 16px;
    height: 16px;
    color: var(--clip-mode-live-text, #4ade80);
  }

  .playout-header__rotation {
    font-weight: 400;
    color: var(--text-secondary, #a1a1aa);
    margin-left: 8px;
  }

  /* Coordinator Health Indicator */
  .coordinator-health {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary, #a1a1aa);
  }

  .coordinator-health__dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .coordinator-health__dot--healthy {
    background: var(--clip-status-success, #22c55e);
    box-shadow: 0 0 6px rgba(34, 197, 94, 0.5);
    animation: pulse-healthy 2s ease-in-out infinite;
  }

  .coordinator-health__dot--slow {
    background: var(--clip-status-warning, #f59e0b);
    box-shadow: 0 0 6px rgba(245, 158, 11, 0.5);
  }

  .coordinator-health__dot--offline {
    background: var(--clip-status-error, #ef4444);
    box-shadow: 0 0 6px rgba(239, 68, 68, 0.5);
    animation: pulse-error 1s ease-in-out infinite;
  }

  @keyframes pulse-healthy {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  @keyframes pulse-error {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Status Cards Container */
  .playout-status-cards {
    display: grid;
    grid-template-columns: 1fr 1.5fr 1fr;
    gap: 12px;
  }

  /* Individual Status Card */
  .status-card {
    background: var(--bg-tertiary, #27272a);
    border: 1px solid var(--border-color, #3f3f46);
    border-radius: 6px;
    padding: 12px;
  }

  .status-card__label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted, #71717a);
    margin-bottom: 8px;
  }

  .status-card__mode {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .status-card__primary {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary, #e4e4e7);
  }

  .status-card__secondary {
    font-size: 12px;
    color: var(--text-secondary, #a1a1aa);
  }

  .status-card__meta {
    font-size: 11px;
    color: var(--text-muted, #71717a);
    margin-top: 4px;
  }

  /* NOW Card - Active State Highlight */
  .status-card--now {
    border-color: var(--clip-mode-live-border, #22c55e);
    background: rgba(34, 197, 94, 0.05);
  }

  .status-card--now.status-card--clip {
    border-color: var(--clip-mode-clip-border, #22c55e);
  }

  .status-card--now.status-card--replay {
    border-color: var(--clip-mode-replay-border, #06b6d4);
    background: rgba(6, 182, 212, 0.05);
  }

  .status-card--now.status-card--override {
    border-color: var(--clip-mode-override-border, #f59e0b);
    background: rgba(245, 158, 11, 0.05);
  }

  .status-card--now.status-card--paused {
    border-color: var(--clip-mode-paused-border, #eab308);
    background: rgba(234, 179, 8, 0.05);
  }

  .status-card--now.status-card--break {
    border-color: var(--clip-mode-break-border, #71717a);
    background: rgba(113, 113, 122, 0.05);
  }

  .status-card--now.status-card--fallback {
    border-color: var(--clip-mode-fallback-border, #52525b);
    background: rgba(113, 113, 122, 0.03);
  }

  /* Mode Badges */
  .mode-badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 9999px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .mode-badge--live {
    background: var(--clip-mode-live-bg, rgba(34, 197, 94, 0.2));
    color: var(--clip-mode-live-text, #4ade80);
  }

  .mode-badge--clip {
    background: var(--clip-mode-clip-bg, rgba(34, 197, 94, 0.2));
    color: var(--clip-mode-clip-text, #4ade80);
  }

  .mode-badge--replay {
    background: var(--clip-mode-replay-bg, rgba(6, 182, 212, 0.2));
    color: var(--clip-mode-replay-text, #22d3ee);
  }

  .mode-badge--queued {
    background: var(--clip-mode-queued-bg, rgba(59, 130, 246, 0.2));
    color: var(--clip-mode-queued-text, #60a5fa);
  }

  .mode-badge--break {
    background: var(--clip-mode-break-bg, rgba(113, 113, 122, 0.2));
    color: var(--clip-mode-break-text, #a1a1aa);
  }

  .mode-badge--fallback {
    background: var(--clip-mode-fallback-bg, rgba(113, 113, 122, 0.15));
    color: var(--clip-mode-fallback-text, #a1a1aa);
  }

  .mode-badge--override {
    background: var(--clip-mode-override-bg, rgba(245, 158, 11, 0.2));
    color: var(--clip-mode-override-text, #fbbf24);
  }

  .mode-badge--paused {
    background: var(--clip-mode-paused-bg, rgba(234, 179, 8, 0.2));
    color: var(--clip-mode-paused-text, #facc15);
  }

  /* Apparatus Badges */
  .apparatus-badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 6px;
    border-radius: 9999px;
    font-size: 10px;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.1);
  }

  .apparatus-badge--vt { color: var(--clip-apparatus-vt, #ef4444); }
  .apparatus-badge--ub { color: var(--clip-apparatus-ub, #a855f7); }
  .apparatus-badge--bb { color: var(--clip-apparatus-bb, #3b82f6); }
  .apparatus-badge--fx { color: var(--clip-apparatus-fx, #22c55e); }
  .apparatus-badge--ph { color: var(--clip-apparatus-ph, #f97316); }
  .apparatus-badge--sr { color: var(--clip-apparatus-sr, #14b8a6); }
  .apparatus-badge--pb { color: var(--clip-apparatus-pb, #6366f1); }
  .apparatus-badge--hb { color: var(--clip-apparatus-hb, #f59e0b); }

  /* Preload Indicator */
  .preload-indicator {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--text-muted, #71717a);
  }

  .preload-indicator__spinner {
    width: 10px;
    height: 10px;
    border: 1.5px solid var(--border-color, #3f3f46);
    border-top-color: var(--clip-status-info, #3b82f6);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .preload-indicator__check {
    width: 10px;
    height: 10px;
    color: var(--clip-status-success, #22c55e);
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Queue Stats */
  .queue-stats {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .queue-stats__row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
  }

  .queue-stats__label {
    color: var(--text-secondary, #a1a1aa);
  }

  .queue-stats__value {
    color: var(--text-primary, #e4e4e7);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }

  .queue-stats__time {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary, #e4e4e7);
    font-variant-numeric: tabular-nums;
  }

  /* Demo State Switcher */
  .demo-state-switcher {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--border-color, #3f3f46);
  }

  .demo-state-btn {
    padding: 4px 8px;
    font-size: 10px;
    font-weight: 500;
    border-radius: 4px;
    background: var(--bg-tertiary, #27272a);
    color: var(--text-secondary, #a1a1aa);
    border: 1px solid var(--border-color, #3f3f46);
    cursor: pointer;
    transition: all 150ms;
  }

  .demo-state-btn:hover {
    background: var(--bg-secondary, #18181b);
    color: var(--text-primary, #e4e4e7);
    border-color: var(--text-muted, #71717a);
  }

  .demo-state-btn--active {
    background: var(--clip-status-info, #3b82f6);
    color: white;
    border-color: var(--clip-status-info, #3b82f6);
  }

  .demo-label {
    font-size: 10px;
    color: var(--text-muted, #71717a);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-right: 8px;
    align-self: center;
  }
</style>

<div class="playout-status-bar playout-status-bar--autonomous" id="playoutStatusBar">
  <!-- Header Row -->
  <div class="playout-header">
    <div class="playout-header__title">
      <svg class="playout-header__play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M8 5v14l11-7z"/>
      </svg>
      <span>PLAYOUT ACTIVE</span>
      <span class="playout-header__rotation">— Rotation 2</span>
    </div>
    <div class="coordinator-health" id="coordinatorHealth">
      <span class="coordinator-health__dot coordinator-health__dot--healthy" id="healthDot"></span>
      <span id="healthLabel">Coordinator</span>
    </div>
  </div>

  <!-- Status Cards: NOW / NEXT / QUEUE -->
  <div class="playout-status-cards">
    <!-- NOW Card -->
    <div class="status-card status-card--now" id="nowCard">
      <div class="status-card__label">NOW</div>
      <div class="status-card__mode" id="nowMode">
        <span class="mode-badge mode-badge--live" id="nowBadge">LIVE</span>
      </div>
      <div class="status-card__primary" id="nowPrimary">Balance Beam</div>
      <div class="status-card__meta" id="nowMeta">Camera 3</div>
    </div>

    <!-- NEXT Card -->
    <div class="status-card" id="nextCard">
      <div class="status-card__label">NEXT</div>
      <div class="status-card__mode">
        <span class="mode-badge mode-badge--queued">CLIP</span>
        <span class="apparatus-badge apparatus-badge--ub">UB</span>
        <span class="preload-indicator" id="preloadIndicator">
          <span class="preload-indicator__check">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </span>
          <span>Ready</span>
        </span>
      </div>
      <div class="status-card__primary" id="nextAthlete">Helena Kriz</div>
      <div class="status-card__secondary" id="nextTeam">Yale · 9.875</div>
    </div>

    <!-- QUEUE Card -->
    <div class="status-card">
      <div class="status-card__label">QUEUE</div>
      <div class="queue-stats">
        <div class="queue-stats__row">
          <span class="queue-stats__label">Queued</span>
          <span class="queue-stats__value" id="queuedCount">4 clips</span>
        </div>
        <div class="queue-stats__row">
          <span class="queue-stats__label">Est. time</span>
          <span class="queue-stats__time" id="queueTime">~2:45</span>
        </div>
        <div class="queue-stats__row">
          <span class="queue-stats__label">Played</span>
          <span class="queue-stats__value" id="playedCount">12</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Demo State Switcher (for prototype interactivity) -->
  <div class="demo-state-switcher">
    <span class="demo-label">Demo Mode:</span>
    <button class="demo-state-btn demo-state-btn--active" data-mode="live">LIVE</button>
    <button class="demo-state-btn" data-mode="clip">CLIP</button>
    <button class="demo-state-btn" data-mode="replay">REPLAY</button>
    <button class="demo-state-btn" data-mode="break">BREAK</button>
    <button class="demo-state-btn" data-mode="fallback">FALLBACK</button>
    <button class="demo-state-btn" data-mode="override">OVERRIDE</button>
    <button class="demo-state-btn" data-mode="paused">PAUSED</button>
    <span class="demo-label" style="margin-left: 16px;">Health:</span>
    <button class="demo-state-btn" data-health="healthy">Healthy</button>
    <button class="demo-state-btn" data-health="slow">Slow</button>
    <button class="demo-state-btn" data-health="offline">Offline</button>
  </div>
</div>

<script>
(function() {
  // Mode configurations
  const modeConfigs = {
    live: {
      badge: 'LIVE',
      badgeClass: 'mode-badge--live',
      cardClass: '',
      barClass: 'playout-status-bar--autonomous',
      primary: 'Balance Beam',
      meta: 'Camera 3'
    },
    clip: {
      badge: 'CLIP',
      badgeClass: 'mode-badge--clip',
      cardClass: 'status-card--clip',
      barClass: 'playout-status-bar--autonomous',
      primary: 'Tamyra Singletary',
      meta: 'Bridgeport · VT · 9.725'
    },
    replay: {
      badge: 'REPLAY',
      badgeClass: 'mode-badge--replay',
      cardClass: 'status-card--replay',
      barClass: 'playout-status-bar--autonomous',
      primary: 'Haley Fitzgerald',
      meta: 'Moment Replay · 0.5x'
    },
    break: {
      badge: 'BREAK',
      badgeClass: 'mode-badge--break',
      cardClass: 'status-card--break',
      barClass: 'playout-status-bar--autonomous',
      primary: 'Rotation Break',
      meta: 'Standings Graphic'
    },
    fallback: {
      badge: 'FALLBACK',
      badgeClass: 'mode-badge--fallback',
      cardClass: 'status-card--fallback',
      barClass: 'playout-status-bar--autonomous',
      primary: 'Quad View',
      meta: 'No clips ready'
    },
    override: {
      badge: 'OVERRIDE',
      badgeClass: 'mode-badge--override',
      cardClass: 'status-card--override',
      barClass: 'playout-status-bar--override',
      primary: 'Camera 2 (Manual)',
      meta: 'Producer override active'
    },
    paused: {
      badge: 'PAUSED',
      badgeClass: 'mode-badge--paused',
      cardClass: 'status-card--paused',
      barClass: 'playout-status-bar--paused',
      primary: 'Playout Frozen',
      meta: 'Press Space to resume'
    }
  };

  // Health configurations
  const healthConfigs = {
    healthy: {
      dotClass: 'coordinator-health__dot--healthy',
      label: 'Coordinator'
    },
    slow: {
      dotClass: 'coordinator-health__dot--slow',
      label: 'Coordinator (slow)'
    },
    offline: {
      dotClass: 'coordinator-health__dot--offline',
      label: 'Coordinator Offline'
    }
  };

  // DOM elements
  const statusBar = document.getElementById('playoutStatusBar');
  const nowCard = document.getElementById('nowCard');
  const nowBadge = document.getElementById('nowBadge');
  const nowPrimary = document.getElementById('nowPrimary');
  const nowMeta = document.getElementById('nowMeta');
  const healthDot = document.getElementById('healthDot');
  const healthLabel = document.getElementById('healthLabel');
  const demoButtons = document.querySelectorAll('.demo-state-btn');

  // Update mode
  function setMode(mode) {
    const config = modeConfigs[mode];
    if (!config) return;

    // Update status bar border
    statusBar.className = 'playout-status-bar ' + config.barClass;

    // Update NOW card
    nowCard.className = 'status-card status-card--now ' + config.cardClass;
    nowBadge.className = 'mode-badge ' + config.badgeClass;
    nowBadge.textContent = config.badge;
    nowPrimary.textContent = config.primary;
    nowMeta.textContent = config.meta;

    // Update button states
    demoButtons.forEach(btn => {
      if (btn.dataset.mode === mode) {
        btn.classList.add('demo-state-btn--active');
      } else if (btn.dataset.mode) {
        btn.classList.remove('demo-state-btn--active');
      }
    });
  }

  // Update coordinator health
  function setHealth(health) {
    const config = healthConfigs[health];
    if (!config) return;

    healthDot.className = 'coordinator-health__dot ' + config.dotClass;
    healthLabel.textContent = config.label;
  }

  // Event listeners
  demoButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.mode) {
        setMode(btn.dataset.mode);
      } else if (btn.dataset.health) {
        setHealth(btn.dataset.health);
      }
    });
  });

  // Simulate preload state changes
  const preloadIndicator = document.getElementById('preloadIndicator');
  let preloadReady = true;

  setInterval(() => {
    preloadReady = !preloadReady;
    if (preloadReady) {
      preloadIndicator.innerHTML = `
        <span class="preload-indicator__check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </span>
        <span>Ready</span>
      `;
    } else {
      preloadIndicator.innerHTML = `
        <span class="preload-indicator__spinner"></span>
        <span>Preloading</span>
      `;
    }
  }, 4000);
})();
</script>
