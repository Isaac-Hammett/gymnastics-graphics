<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Stage Renderer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', sans-serif;
      transform-origin: top left;
    }
    #canvas {
      width: 1920px;
      height: 1080px;
      position: relative;
    }
    /* Layout system */
    .layout-row { display: flex; flex-direction: column; }
    .layout-columns { display: flex; flex-direction: row; flex: 1; min-height: 0; }
    .layout-column { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div id="canvas">
    <div id="skeleton-mount"></div>
  </div>

  <script>
    // --- Firebase Init ---
    const firebaseConfig = {
      apiKey: "AIzaSyCh0aZUvKl6Qvqsva3hvOgJJlleP1OwcTY",
      authDomain: "gymnastics-graphics.firebaseapp.com",
      databaseURL: "https://gymnastics-graphics-default-rtdb.firebaseio.com",
      projectId: "gymnastics-graphics",
      storageBucket: "gymnastics-graphics.firebasestorage.app",
      messagingSenderId: "702072609550",
      appId: "1:702072609550:web:ac74a811186d3ff45b955f"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- URL Param Parsing ---
    const urlParams = new URLSearchParams(window.location.search);
    const paramComp = urlParams.get('comp');
    const paramPreview = urlParams.get('preview');
    const paramSkeleton = urlParams.get('skeleton');
    const paramBlock = urlParams.get('block');
    const paramTheme = urlParams.get('theme');
    const paramGraphic = urlParams.get('graphic');
    const paramLayout = urlParams.get('layout');

    // --- Skeleton Loader ---
    let currentSkeletonName = null;

    async function loadSkeleton(name) {
      clearSkeleton();
      try {
        const [htmlRes, cssRes] = await Promise.all([
          fetch('skeletons/' + name + '.html'),
          fetch('skeletons/' + name + '.css')
        ]);
        if (!htmlRes.ok || !cssRes.ok) {
          console.error('[stage] Skeleton not found:', name);
          return null;
        }
        const [html, css] = await Promise.all([htmlRes.text(), cssRes.text()]);

        // Inject CSS
        const styleEl = document.createElement('style');
        styleEl.setAttribute('data-skeleton', name);
        styleEl.textContent = css;
        document.head.appendChild(styleEl);

        // Inject HTML
        const mount = document.getElementById('skeleton-mount');
        mount.innerHTML = html;

        // Validate
        const content = mount.querySelector('.skeleton-content');
        if (!content) {
          console.error('[stage] Skeleton missing .skeleton-content:', name);
          clearSkeleton();
          return null;
        }

        currentSkeletonName = name;
        return mount.firstElementChild;
      } catch (err) {
        console.error('[stage] Skeleton load error:', name, err);
        return null;
      }
    }

    function clearSkeleton() {
      if (currentSkeletonName) {
        const styleEl = document.querySelector('style[data-skeleton="' + currentSkeletonName + '"]');
        if (styleEl) styleEl.remove();
      }
      document.getElementById('skeleton-mount').innerHTML = '';
      currentSkeletonName = null;
    }

    // --- Block Loader ---
    let activeBlocks = [];

    function pascalCase(type) {
      // Strip leading underscore, split on hyphens, capitalize each part
      const stripped = type.replace(/^_/, '');
      return stripped.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
    }

    async function loadBlocks(blockSpecs, context) {
      const results = [];

      // Fetch CSS and JS for each block in parallel
      const loadPromises = blockSpecs.map(spec => {
        const type = typeof spec === 'string' ? spec : spec.type;
        const id = typeof spec === 'string' ? spec : (spec.id || spec.type);
        return loadSingleBlock(type, id, context);
      });

      const loaded = await Promise.all(loadPromises);
      for (const entry of loaded) {
        if (entry) results.push(entry);
      }

      // Wait for ready (max 1 second)
      if (results.length > 0) {
        await waitForReady(results, 1000);
      }

      activeBlocks = results;
      return results;
    }

    async function loadSingleBlock(type, id, context) {
      try {
        // Load CSS via <link> tag
        const linkEl = document.createElement('link');
        linkEl.rel = 'stylesheet';
        linkEl.href = 'blocks/' + type + '.css';
        linkEl.setAttribute('data-block', type);
        document.head.appendChild(linkEl);

        // Load JS via <script> tag
        await new Promise((resolve, reject) => {
          const scriptEl = document.createElement('script');
          scriptEl.src = 'blocks/' + type + '.js';
          scriptEl.onload = resolve;
          scriptEl.onerror = () => reject(new Error('Failed to load block JS: ' + type));
          document.body.appendChild(scriptEl);
        });

        // Look up block constructor
        const globalName = 'Block' + pascalCase(type);
        const block = window[globalName];
        if (!block) {
          throw new Error('Block global not found: window.' + globalName);
        }

        // Create wrapper element
        const wrapper = document.createElement('div');
        wrapper.className = 'block-' + type;
        wrapper.style.opacity = '0';
        wrapper.style.pointerEvents = 'none';

        return { type, id, block, wrapper };
      } catch (err) {
        console.error('[stage] Block load error:', type, err);
        // Report error to Firebase if comp exists
        if (paramComp) {
          try {
            const errorRef = db.ref('competitions/' + paramComp + '/production/stageErrors/' + Date.now());
            errorRef.set({
              type: 'block_load_error',
              graphic: paramGraphic || 'preview',
              block: type,
              message: err.message,
              url: window.location.href,
              timestamp: new Date().toISOString()
            });
          } catch (fbErr) {
            console.error('[stage] Failed to report error to Firebase:', fbErr);
          }
        }
        return null;
      }
    }

    function renderBlocks(blocks, container, dataMap) {
      for (const entry of blocks) {
        const data = dataMap[entry.id] || dataMap[entry.type] || entry.block.sampleData || {};
        container.appendChild(entry.wrapper);
        entry.block.render(entry.wrapper, data, {
          comp: paramComp,
          theme: null,
          db: db,
          compConfig: null
        });
        // Make visible immediately in preview (animations come in Task 4)
        entry.wrapper.style.opacity = '1';
        entry.wrapper.style.pointerEvents = 'auto';
      }
    }

    async function waitForReady(blocks, timeout) {
      const readyPromises = blocks.map(entry => {
        if (entry.block.ready) return entry.block.ready();
        return Promise.resolve();
      });
      await Promise.race([
        Promise.all(readyPromises),
        new Promise(resolve => setTimeout(resolve, timeout))
      ]);
    }

    function destroyBlocks() {
      for (const entry of activeBlocks) {
        if (entry.block.destroy) entry.block.destroy();
        if (entry.wrapper.parentNode) entry.wrapper.parentNode.removeChild(entry.wrapper);
        // Remove CSS
        const linkEl = document.querySelector('link[data-block="' + entry.type + '"]');
        if (linkEl) linkEl.remove();
      }
      activeBlocks = [];
    }

    // --- Theme Application ---
    // Handles two formats:
    //   1. Raw Firebase: { colors: { headerBar, ... }, logos: { meetLogo }, images: { ... } }
    //   2. Resolved (from themeResolver): { headerBg, headerText, meetLogo, headerBgImage, ... }
    function applyTheme(skeletonElement, theme) {
      if (!theme || !skeletonElement) return;

      // Detect format: resolved themes have flat color keys (headerBg), raw has theme.colors
      var isResolved = !theme.colors && (theme.headerBg || theme.overlayBg || theme.contentBg);

      if (isResolved) {
        // Resolved format — flat keys from themeResolver
        var resolvedColorMap = {
          headerBg: '--meet-header-bg',
          headerText: '--meet-header-text',
          contentBg: '--meet-content-bg',
          overlayBg: '--meet-overlay-bg',
          overlayText: '--meet-overlay-text',
          borderColor: '--meet-border-color',
          badgeBg: '--meet-badge-bg',
          badgeText: '--meet-badge-text'
        };
        for (var rKey in resolvedColorMap) {
          if (theme[rKey]) skeletonElement.style.setProperty(resolvedColorMap[rKey], theme[rKey]);
        }

        // Logo — flat key
        if (theme.meetLogo) {
          skeletonElement.style.setProperty('--meet-logo-url', 'url(' + theme.meetLogo + ')');
        }

        // Images — flat keys
        var resolvedImageMap = {
          headerBgImage: '--meet-header-bg-image',
          headerBgImageFit: '--meet-header-bg-image-fit',
          headerBgImagePosition: '--meet-header-bg-image-position',
          headerBgImageOpacity: '--meet-header-bg-image-opacity',
          bodyBgImage: '--meet-body-bg-image',
          bodyTexture: '--meet-body-texture',
          bodyTextureOpacity: '--meet-body-texture-opacity',
          bodyTextureBlend: '--meet-body-texture-blend'
        };
        for (var iKey in resolvedImageMap) {
          if (theme[iKey]) {
            var iVal = theme[iKey];
            if (iKey.endsWith('Image') || iKey === 'bodyTexture') {
              skeletonElement.style.setProperty(resolvedImageMap[iKey], 'url(' + iVal + ')');
            } else {
              skeletonElement.style.setProperty(resolvedImageMap[iKey], iVal);
            }
          }
        }
      } else {
        // Raw Firebase format — nested under colors/logos/images
        var colors = theme.colors || {};
        var colorMap = {
          headerBar: '--meet-header-bg',
          contentArea: '--meet-content-bg',
          bodyBackground: '--meet-overlay-bg',
          borderDivider: '--meet-border-color',
          badge: '--meet-badge-bg',
          badgeText: '--meet-badge-text',
          textOnHeader: '--meet-header-text',
          textOnContent: '--meet-overlay-text',
          headerBg: '--meet-header-bg',
          headerText: '--meet-header-text',
          borderColor: '--meet-border-color',
          badgeBg: '--meet-badge-bg',
          overlayBg: '--meet-overlay-bg',
          overlayText: '--meet-overlay-text'
        };
        for (var cKey in colorMap) {
          if (colors[cKey]) skeletonElement.style.setProperty(colorMap[cKey], colors[cKey]);
        }

        var logos = theme.logos || {};
        if (logos.meetLogo) {
          skeletonElement.style.setProperty('--meet-logo-url', 'url(' + logos.meetLogo + ')');
        }

        var images = theme.images || {};
        var imageMap = {
          headerBgImage: '--meet-header-bg-image',
          headerBgImageFit: '--meet-header-bg-image-fit',
          headerBgImagePosition: '--meet-header-bg-image-position',
          headerBgImageOpacity: '--meet-header-bg-image-opacity',
          bodyBgImage: '--meet-body-bg-image',
          bodyTexture: '--meet-body-texture',
          bodyTextureOpacity: '--meet-body-texture-opacity',
          bodyTextureBlend: '--meet-body-texture-blend'
        };
        for (var mKey in imageMap) {
          if (images[mKey]) {
            var mVal = images[mKey];
            if (mKey.endsWith('Image') || mKey === 'bodyTexture') {
              skeletonElement.style.setProperty(imageMap[mKey], 'url(' + mVal + ')');
            } else {
              skeletonElement.style.setProperty(imageMap[mKey], mVal);
            }
          }
        }
      }
    }

    // --- Layout Engine ---
    function buildLayout(layoutSpec, blocksById) {
      // Build nested flex DOM structure from layout spec
      // Returns the root element to append to .skeleton-content
      if (!layoutSpec || !layoutSpec.type) return null;

      if (layoutSpec.type === 'rows') {
        const container = document.createDocumentFragment();
        for (const row of (layoutSpec.rows || [])) {
          const rowEl = buildLayoutRow(row, blocksById);
          if (rowEl) container.appendChild(rowEl);
        }
        return container;
      } else if (layoutSpec.type === 'columns') {
        return buildColumnsLayout(layoutSpec, blocksById);
      }
      return null;
    }

    function buildLayoutRow(row, blocksById) {
      if (row.type === 'columns') {
        return buildColumnsLayout(row, blocksById);
      }
      // Single row with blocks
      const rowEl = document.createElement('div');
      rowEl.className = 'layout-row';
      if (row.blocks) {
        for (const blockId of row.blocks) {
          const entry = blocksById[blockId];
          if (entry) rowEl.appendChild(entry.wrapper);
        }
      }
      return rowEl;
    }

    function buildColumnsLayout(spec, blocksById) {
      const rowEl = document.createElement('div');
      rowEl.className = 'layout-row layout-columns';

      const columns = spec.columns || [];
      const defaultWidth = (100 / columns.length) + '%';

      for (const col of columns) {
        const colEl = document.createElement('div');
        colEl.className = 'layout-column';
        colEl.style.width = col.width || defaultWidth;

        if (col.blocks) {
          // Column contains blocks directly
          for (const blockId of col.blocks) {
            const entry = blocksById[blockId];
            if (entry) colEl.appendChild(entry.wrapper);
          }
        } else if (col.rows) {
          // Column contains nested rows
          for (const row of col.rows) {
            const rowEl = buildLayoutRow(row, blocksById);
            if (rowEl) colEl.appendChild(rowEl);
          }
        }
        rowEl.appendChild(colEl);
      }
      return rowEl;
    }

    // --- Animation Engine ---
    let animationCounter = 0;

    function generateKeyframes(type) {
      // Returns { from, to } CSS transform+opacity for each animation type
      const animations = {
        // Enter animations
        'slide-up': { from: { opacity: 0, transform: 'translateY(60px)' }, to: { opacity: 1, transform: 'translateY(0)' } },
        'slide-down': { from: { opacity: 0, transform: 'translateY(-60px)' }, to: { opacity: 1, transform: 'translateY(0)' } },
        'slide-left': { from: { opacity: 0, transform: 'translateX(60px)' }, to: { opacity: 1, transform: 'translateX(0)' } },
        'slide-right': { from: { opacity: 0, transform: 'translateX(-60px)' }, to: { opacity: 1, transform: 'translateX(0)' } },
        'fade-in': { from: { opacity: 0, transform: 'none' }, to: { opacity: 1, transform: 'none' } },
        'scale-in': { from: { opacity: 0, transform: 'scale(0.9)' }, to: { opacity: 1, transform: 'scale(1)' } },
        // Exit animations
        'fade-out': { from: { opacity: 1, transform: 'none' }, to: { opacity: 0, transform: 'none' } },
        'scale-out': { from: { opacity: 1, transform: 'scale(1)' }, to: { opacity: 0, transform: 'scale(0.9)' } },
        'slide-out-up': { from: { opacity: 1, transform: 'translateY(0)' }, to: { opacity: 0, transform: 'translateY(-60px)' } },
        'slide-out-down': { from: { opacity: 1, transform: 'translateY(0)' }, to: { opacity: 0, transform: 'translateY(60px)' } },
        'slide-out-left': { from: { opacity: 1, transform: 'translateX(0)' }, to: { opacity: 0, transform: 'translateX(-60px)' } },
        'slide-out-right': { from: { opacity: 1, transform: 'translateX(0)' }, to: { opacity: 0, transform: 'translateX(60px)' } }
      };
      return animations[type] || animations['fade-in'];
    }

    function playEnterAnimation(blockEl, config) {
      const opts = Object.assign({ type: 'fade-in', duration: 300, delay: 0, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' }, config);
      const keyframes = generateKeyframes(opts.type);
      const animName = 'stage-anim-' + (++animationCounter);

      // Inject keyframes
      const styleEl = document.createElement('style');
      styleEl.setAttribute('data-animation', animName);
      styleEl.textContent = '@keyframes ' + animName + ' { from { opacity: ' + keyframes.from.opacity + '; transform: ' + keyframes.from.transform + '; } to { opacity: ' + keyframes.to.opacity + '; transform: ' + keyframes.to.transform + '; } }';
      document.head.appendChild(styleEl);

      // Apply animation
      blockEl.style.animation = animName + ' ' + opts.duration + 'ms ' + opts.easing + ' ' + opts.delay + 'ms forwards';
      blockEl.style.opacity = '';
      blockEl.style.pointerEvents = 'auto';

      // Cleanup keyframes after animation completes
      setTimeout(function() {
        styleEl.remove();
      }, opts.duration + opts.delay + 100);
    }

    function playExitAnimation(blockEl, config) {
      return new Promise(function(resolve) {
        const opts = Object.assign({ type: 'fade-out', duration: 200, delay: 0, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' }, config);
        const keyframes = generateKeyframes(opts.type);
        const animName = 'stage-anim-' + (++animationCounter);

        // Inject keyframes
        const styleEl = document.createElement('style');
        styleEl.setAttribute('data-animation', animName);
        styleEl.textContent = '@keyframes ' + animName + ' { from { opacity: ' + keyframes.from.opacity + '; transform: ' + keyframes.from.transform + '; } to { opacity: ' + keyframes.to.opacity + '; transform: ' + keyframes.to.transform + '; } }';
        document.head.appendChild(styleEl);

        // Apply animation
        blockEl.style.animation = animName + ' ' + opts.duration + 'ms ' + opts.easing + ' ' + opts.delay + 'ms forwards';

        // Resolve on animationend
        function onEnd() {
          blockEl.removeEventListener('animationend', onEnd);
          blockEl.style.opacity = '0';
          blockEl.style.pointerEvents = 'none';
          styleEl.remove();
          resolve();
        }
        blockEl.addEventListener('animationend', onEnd);

        // Fallback timeout in case animationend doesn't fire
        setTimeout(function() {
          blockEl.removeEventListener('animationend', onEnd);
          blockEl.style.opacity = '0';
          blockEl.style.pointerEvents = 'none';
          styleEl.remove();
          resolve();
        }, opts.duration + opts.delay + 100);
      });
    }

    function playEnterAnimations(blocks, config) {
      for (let i = 0; i < blocks.length; i++) {
        const entry = blocks[i];
        const opts = Object.assign({}, config, { delay: (config && config.delay) || (i * 50) });
        playEnterAnimation(entry.wrapper, opts);
      }
    }

    function playExitAnimations(blocks, config) {
      const promises = blocks.map(function(entry) {
        return playExitAnimation(entry.wrapper, config);
      });
      return Promise.all(promises);
    }

    // --- Live Mode State ---
    let currentGraphicData = null;
    let isRendering = false;

    // --- renderGraphic orchestration ---
    async function renderGraphic(graphic, data) {
      if (isRendering) return;
      isRendering = true;

      try {
        // 1. Load skeleton
        const skeletonName = data && data.skeleton ? data.skeleton : 'full-screen-card';
        const skeletonEl = await loadSkeleton(skeletonName);
        if (!skeletonEl) {
          isRendering = false;
          return;
        }
        const contentEl = skeletonEl.querySelector('.skeleton-content');
        if (!contentEl) {
          console.error('[stage] Skeleton missing .skeleton-content');
          isRendering = false;
          return;
        }

        // 2. Apply theme
        if (data && data.theme) {
          applyTheme(skeletonEl, data.theme);
        }

        // 3. Load blocks
        const blockSpecs = data && data.blocks ? data.blocks : [];
        if (blockSpecs.length === 0) {
          console.error('[stage] No blocks specified for graphic:', graphic);
          isRendering = false;
          return;
        }

        // Normalize block specs (strings become objects with type)
        const normalizedSpecs = blockSpecs.map((spec, idx) => {
          if (typeof spec === 'string') {
            return { type: spec, id: spec + '-' + idx };
          }
          return { type: spec.type, id: spec.id || (spec.type + '-' + idx), data: spec.data };
        });

        const blocks = await loadBlocks(normalizedSpecs, {
          comp: paramComp,
          theme: data && data.theme,
          db: db,
          compConfig: null
        });

        if (blocks.length === 0) {
          console.error('[stage] Failed to load any blocks for graphic:', graphic);
          isRendering = false;
          return;
        }

        // 4. Build layout or default append
        const blocksById = {};
        for (const entry of blocks) {
          blocksById[entry.id] = entry;
        }

        // Prepare block data map
        const dataMap = {};
        for (const spec of normalizedSpecs) {
          if (spec.data) {
            dataMap[spec.id] = spec.data;
          }
        }

        if (data && data.layout) {
          const layoutEl = buildLayout(data.layout, blocksById);
          if (layoutEl) {
            contentEl.appendChild(layoutEl);
          }
        } else {
          // Default: append blocks directly to content
          for (const entry of blocks) {
            contentEl.appendChild(entry.wrapper);
          }
        }

        // 5. Render each block
        for (const entry of blocks) {
          const blockData = dataMap[entry.id] || entry.block.sampleData || {};
          entry.block.render(entry.wrapper, blockData, {
            comp: paramComp,
            theme: data && data.theme,
            db: db,
            compConfig: null
          });
        }

        // 6. Wait for ready
        await waitForReady(blocks, 1000);

        // 7. Play enter animations
        playEnterAnimations(blocks, { type: 'fade-in', duration: 300 });

        // Store current state
        currentGraphicData = { graphic, data, blocks, skeletonEl };
      } finally {
        isRendering = false;
      }
    }

    // --- dismissCurrentGraphic ---
    async function dismissCurrentGraphic() {
      if (!currentGraphicData) return;

      const { blocks } = currentGraphicData;

      // 1. Play exit animations
      if (blocks && blocks.length > 0) {
        await playExitAnimations(blocks, { type: 'fade-out', duration: 200 });
      }

      // 2. Destroy blocks
      destroyBlocks();

      // 3. Clear skeleton
      clearSkeleton();

      currentGraphicData = null;
    }

    // --- Firebase Listener (live mode) ---
    function startFirebaseListener() {
      if (!paramComp || paramPreview) return;

      console.log('[stage] Starting Firebase listener for comp:', paramComp);

      db.ref('competitions/' + paramComp + '/currentGraphic').on('value', async function(snapshot) {
        const val = snapshot.val();

        // Clear if null or not targeting stage renderer
        if (!val || val.renderer !== 'stage') {
          await dismissCurrentGraphic();
          return;
        }

        // Dismiss current graphic before rendering new one
        await dismissCurrentGraphic();

        // Render the new graphic
        // Pass the full val object (contains blocks, skeleton, theme at top level)
        await renderGraphic(val.graphic, val);
      });
    }

    // --- Standalone Mode (one-shot render from URL params) ---
    async function runStandaloneMode() {
      if (paramPreview || !paramGraphic) return;

      console.log('[stage] Running standalone mode for graphic:', paramGraphic);

      // Fetch theme from competition config or ?theme= param
      let theme = null;
      const themeId = paramTheme || null;
      if (paramComp) {
        try {
          const configSnap = await db.ref('competitions/' + paramComp + '/config').once('value');
          const config = configSnap.val();
          const resolvedThemeId = themeId || (config && config.meetTheme);
          if (resolvedThemeId) {
            const themeSnap = await db.ref('themes/' + resolvedThemeId).once('value');
            theme = themeSnap.val();
          }
        } catch (err) {
          console.error('[stage] Failed to fetch competition theme:', err);
        }
      } else if (themeId) {
        try {
          const themeSnap = await db.ref('themes/' + themeId).once('value');
          theme = themeSnap.val();
        } catch (err) {
          console.error('[stage] Failed to fetch theme:', err);
        }
      }

      // Try to load the graphic's manifest for defaultData.blocks
      let skeleton = paramSkeleton || 'full-screen-card';
      let blocks = null;
      try {
        const manifestRes = await fetch('graphics/' + paramGraphic + '.json');
        if (manifestRes.ok) {
          const manifest = await manifestRes.json();
          skeleton = manifest.skeleton || skeleton;
          if (manifest.defaultData && manifest.defaultData.blocks) {
            blocks = manifest.defaultData.blocks;
          }
        }
      } catch (err) {
        console.warn('[stage] Could not load manifest for:', paramGraphic, err);
      }

      // Fallback: treat graphic name as a single block
      if (!blocks) {
        blocks = [{ type: paramGraphic, id: paramGraphic + '-0' }];
      }

      await renderGraphic(paramGraphic, {
        skeleton: skeleton,
        theme: theme,
        blocks: blocks
      });
    }

    // --- Preview Mode ---
    let previewBlocks = [];
    let previewSkeletonEl = null;
    let previewToolbar = null;

    function createPreviewToolbar() {
      const toolbar = document.createElement('div');
      toolbar.id = 'preview-toolbar';
      toolbar.style.cssText = 'position: fixed; bottom: 20px; right: 20px; display: flex; gap: 8px; z-index: 9999;';

      const playBtn = document.createElement('button');
      playBtn.textContent = 'Play';
      playBtn.style.cssText = 'padding: 8px 16px; font-size: 14px; font-weight: 600; background: rgba(59, 130, 246, 0.9); color: white; border: none; border-radius: 6px; cursor: pointer;';
      playBtn.onclick = function() { replayEnterAnimations(); };

      const dismissBtn = document.createElement('button');
      dismissBtn.textContent = 'Dismiss';
      dismissBtn.style.cssText = 'padding: 8px 16px; font-size: 14px; font-weight: 600; background: rgba(239, 68, 68, 0.9); color: white; border: none; border-radius: 6px; cursor: pointer;';
      dismissBtn.onclick = function() { dismissPreview(); };

      toolbar.appendChild(playBtn);
      toolbar.appendChild(dismissBtn);
      document.body.appendChild(toolbar);
      return toolbar;
    }

    function replayEnterAnimations() {
      // Hide all blocks first
      for (const entry of previewBlocks) {
        entry.wrapper.style.opacity = '0';
        entry.wrapper.style.pointerEvents = 'none';
        entry.wrapper.style.animation = '';
      }
      // Re-trigger enter animations after a brief delay
      setTimeout(function() {
        playEnterAnimations(previewBlocks, { type: 'fade-in', duration: 300 });
      }, 50);
    }

    function dismissPreview() {
      playExitAnimations(previewBlocks, { type: 'fade-out', duration: 200 });
    }

    // --- Preview Mode Runner ---
    (async function() {
      if (!paramPreview) return;

      if (paramPreview === 'skeleton' && paramSkeleton) {
        // Skeleton-only preview with placeholder content
        const el = await loadSkeleton(paramSkeleton);
        if (el) {
          const content = el.querySelector('.skeleton-content');
          if (content) {
            content.innerHTML = '<div style="background: #d4d4d8; padding: 18px 40px; display: flex; align-items: center;"><span style="font-size: 42px; font-weight: 800;">HEADER PLACEHOLDER</span></div><div style="flex: 1; background: #18181b; display: flex; align-items: center; justify-content: center;"><span style="color: #71717a; font-size: 24px;">Content area — blocks render here</span></div>';
          }
          previewSkeletonEl = el;
        }

      } else if (paramPreview === 'block' && paramBlock) {
        // Block-only preview (no skeleton)
        const blockTypes = paramBlock.split(',').map(b => b.trim()).filter(Boolean);
        const blockSpecs = blockTypes.map(type => ({ type, id: type }));
        const blocks = await loadBlocks(blockSpecs, {});
        if (blocks.length > 0) {
          const mount = document.getElementById('skeleton-mount');
          const dataMap = {};
          for (const entry of blocks) {
            dataMap[entry.type] = entry.block.sampleData || {};
          }
          // Render to mount
          for (const entry of blocks) {
            const data = dataMap[entry.type] || entry.block.sampleData || {};
            mount.appendChild(entry.wrapper);
            entry.block.render(entry.wrapper, data, { comp: paramComp, theme: null, db: db, compConfig: null });
          }
          previewBlocks = blocks;
          // Play enter animations
          playEnterAnimations(blocks, { type: 'fade-in', duration: 300 });
          // Create toolbar
          previewToolbar = createPreviewToolbar();
        }

      } else if (paramPreview === 'full' && paramSkeleton && paramBlock) {
        // Full preview: skeleton + blocks
        const el = await loadSkeleton(paramSkeleton);
        if (!el) return;
        const content = el.querySelector('.skeleton-content');
        if (!content) return;
        previewSkeletonEl = el;

        // Fetch theme if specified
        if (paramTheme) {
          try {
            const snap = await db.ref('themes/' + paramTheme).once('value');
            const themeData = snap.val();
            if (themeData) applyTheme(el, themeData);
          } catch (err) {
            console.error('[stage] Theme fetch error:', err);
          }
        }

        const blockTypes = paramBlock.split(',').map(b => b.trim()).filter(Boolean);
        // Assign unique ids for layout (type-0, type-1, etc.)
        const typeCount = {};
        const blockSpecs = blockTypes.map(type => {
          typeCount[type] = (typeCount[type] || 0);
          const id = type + '-' + typeCount[type]++;
          return { type, id };
        });
        const blocks = await loadBlocks(blockSpecs, {});
        if (blocks.length === 0) return;

        const dataMap = {};
        for (const entry of blocks) {
          dataMap[entry.id] = entry.block.sampleData || {};
        }

        // Check for layout param
        if (paramLayout === 'columns' && blocks.length > 1) {
          // Build columns layout with equal widths
          const blocksById = {};
          for (const entry of blocks) blocksById[entry.id] = entry;
          const layoutSpec = {
            type: 'columns',
            columns: blocks.map(entry => ({ blocks: [entry.id] }))
          };
          const layoutEl = buildLayout(layoutSpec, blocksById);
          if (layoutEl) {
            content.appendChild(layoutEl);
            // Render each block's content
            for (const entry of blocks) {
              const data = dataMap[entry.id] || entry.block.sampleData || {};
              entry.block.render(entry.wrapper, data, { comp: paramComp, theme: null, db: db, compConfig: null });
            }
          }
        } else {
          // Default: render blocks directly to content
          for (const entry of blocks) {
            const data = dataMap[entry.id] || entry.block.sampleData || {};
            content.appendChild(entry.wrapper);
            entry.block.render(entry.wrapper, data, { comp: paramComp, theme: null, db: db, compConfig: null });
          }
        }

        previewBlocks = blocks;
        // Play enter animations
        playEnterAnimations(blocks, { type: 'fade-in', duration: 300 });
        // Create toolbar
        previewToolbar = createPreviewToolbar();
      }
    })();

    // --- Initialize Live Mode or Standalone Mode ---
    // (runs after preview mode check - preview mode returns early if active)
    (async function() {
      // Skip if preview mode is active
      if (paramPreview) return;

      // Standalone mode: render a specific graphic from URL param
      if (paramGraphic) {
        await runStandaloneMode();
        return;
      }

      // Live mode: start Firebase listener
      if (paramComp) {
        startFirebaseListener();
      }
    })();
  </script>
</body>
</html>
