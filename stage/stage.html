<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Stage Renderer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', sans-serif;
      transform-origin: top left;
    }
    #canvas {
      width: 1920px;
      height: 1080px;
      position: relative;
    }
    /* Layout system */
    .layout-row { display: flex; flex-direction: column; }
    .layout-columns { display: flex; flex-direction: row; flex: 1; min-height: 0; }
    .layout-column { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div id="canvas">
    <div id="skeleton-mount"></div>
  </div>

  <script>
    // --- Firebase Init ---
    const firebaseConfig = {
      apiKey: "AIzaSyCh0aZUvKl6Qvqsva3hvOgJJlleP1OwcTY",
      authDomain: "gymnastics-graphics.firebaseapp.com",
      databaseURL: "https://gymnastics-graphics-default-rtdb.firebaseio.com",
      projectId: "gymnastics-graphics",
      storageBucket: "gymnastics-graphics.firebasestorage.app",
      messagingSenderId: "702072609550",
      appId: "1:702072609550:web:ac74a811186d3ff45b955f"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- URL Param Parsing ---
    const urlParams = new URLSearchParams(window.location.search);
    const paramComp = urlParams.get('comp');
    const paramPreview = urlParams.get('preview');
    const paramSkeleton = urlParams.get('skeleton');
    const paramBlock = urlParams.get('block');
    const paramTheme = urlParams.get('theme');
    const paramGraphic = urlParams.get('graphic');
    const paramLayout = urlParams.get('layout');

    // --- Skeleton Loader ---
    let currentSkeletonName = null;

    async function loadSkeleton(name) {
      clearSkeleton();
      try {
        const [htmlRes, cssRes] = await Promise.all([
          fetch('skeletons/' + name + '.html'),
          fetch('skeletons/' + name + '.css')
        ]);
        if (!htmlRes.ok || !cssRes.ok) {
          console.error('[stage] Skeleton not found:', name);
          return null;
        }
        const [html, css] = await Promise.all([htmlRes.text(), cssRes.text()]);

        // Inject CSS
        const styleEl = document.createElement('style');
        styleEl.setAttribute('data-skeleton', name);
        styleEl.textContent = css;
        document.head.appendChild(styleEl);

        // Inject HTML
        const mount = document.getElementById('skeleton-mount');
        mount.innerHTML = html;

        // Validate
        const content = mount.querySelector('.skeleton-content');
        if (!content) {
          console.error('[stage] Skeleton missing .skeleton-content:', name);
          clearSkeleton();
          return null;
        }

        currentSkeletonName = name;
        return mount.firstElementChild;
      } catch (err) {
        console.error('[stage] Skeleton load error:', name, err);
        return null;
      }
    }

    function clearSkeleton() {
      if (currentSkeletonName) {
        const styleEl = document.querySelector('style[data-skeleton="' + currentSkeletonName + '"]');
        if (styleEl) styleEl.remove();
      }
      document.getElementById('skeleton-mount').innerHTML = '';
      currentSkeletonName = null;
    }

    // --- Block Loader ---
    let activeBlocks = [];

    function pascalCase(type) {
      // Strip leading underscore, split on hyphens, capitalize each part
      const stripped = type.replace(/^_/, '');
      return stripped.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
    }

    async function loadBlocks(blockSpecs, context) {
      const results = [];

      // Fetch CSS and JS for each block in parallel
      const loadPromises = blockSpecs.map(spec => {
        const type = typeof spec === 'string' ? spec : spec.type;
        const id = typeof spec === 'string' ? spec : (spec.id || spec.type);
        return loadSingleBlock(type, id, context);
      });

      const loaded = await Promise.all(loadPromises);
      for (const entry of loaded) {
        if (entry) results.push(entry);
      }

      // Wait for ready (max 1 second)
      if (results.length > 0) {
        await waitForReady(results, 1000);
      }

      activeBlocks = results;
      return results;
    }

    async function loadSingleBlock(type, id, context) {
      try {
        // Load CSS via <link> tag
        const linkEl = document.createElement('link');
        linkEl.rel = 'stylesheet';
        linkEl.href = 'blocks/' + type + '.css';
        linkEl.setAttribute('data-block', type);
        document.head.appendChild(linkEl);

        // Load JS via <script> tag
        await new Promise((resolve, reject) => {
          const scriptEl = document.createElement('script');
          scriptEl.src = 'blocks/' + type + '.js';
          scriptEl.onload = resolve;
          scriptEl.onerror = () => reject(new Error('Failed to load block JS: ' + type));
          document.body.appendChild(scriptEl);
        });

        // Look up block constructor
        const globalName = 'Block' + pascalCase(type);
        const block = window[globalName];
        if (!block) {
          throw new Error('Block global not found: window.' + globalName);
        }

        // Create wrapper element
        const wrapper = document.createElement('div');
        wrapper.className = 'block-' + type;
        wrapper.style.opacity = '0';
        wrapper.style.pointerEvents = 'none';

        return { type, id, block, wrapper };
      } catch (err) {
        console.error('[stage] Block load error:', type, err);
        // Report error to Firebase if comp exists
        if (paramComp) {
          try {
            const errorRef = db.ref('competitions/' + paramComp + '/production/stageErrors/' + Date.now());
            errorRef.set({
              type: 'block_load_error',
              graphic: paramGraphic || 'preview',
              block: type,
              message: err.message,
              url: window.location.href,
              timestamp: new Date().toISOString()
            });
          } catch (fbErr) {
            console.error('[stage] Failed to report error to Firebase:', fbErr);
          }
        }
        return null;
      }
    }

    function renderBlocks(blocks, container, dataMap) {
      for (const entry of blocks) {
        const data = dataMap[entry.id] || dataMap[entry.type] || entry.block.sampleData || {};
        container.appendChild(entry.wrapper);
        entry.block.render(entry.wrapper, data, {
          comp: paramComp,
          theme: null,
          db: db,
          compConfig: null
        });
        // Make visible immediately in preview (animations come in Task 4)
        entry.wrapper.style.opacity = '1';
        entry.wrapper.style.pointerEvents = 'auto';
      }
    }

    async function waitForReady(blocks, timeout) {
      const readyPromises = blocks.map(entry => {
        if (entry.block.ready) return entry.block.ready();
        return Promise.resolve();
      });
      await Promise.race([
        Promise.all(readyPromises),
        new Promise(resolve => setTimeout(resolve, timeout))
      ]);
    }

    function destroyBlocks() {
      for (const entry of activeBlocks) {
        if (entry.block.destroy) entry.block.destroy();
        if (entry.wrapper.parentNode) entry.wrapper.parentNode.removeChild(entry.wrapper);
        // Remove CSS
        const linkEl = document.querySelector('link[data-block="' + entry.type + '"]');
        if (linkEl) linkEl.remove();
      }
      activeBlocks = [];
    }

    // --- Theme Application ---
    function applyTheme(skeletonElement, theme) {
      if (!theme || !skeletonElement) return;

      const colorMap = {
        headerBg: '--meet-header-bg',
        contentBg: '--meet-content-bg',
        headerText: '--meet-header-text',
        overlayBg: '--meet-overlay-bg',
        overlayText: '--meet-overlay-text',
        borderColor: '--meet-border-color',
        badgeBg: '--meet-badge-bg',
        badgeText: '--meet-badge-text'
      };

      const imageMap = {
        headerBgImage: '--meet-header-bg-image',
        headerBgImageFit: '--meet-header-bg-image-fit',
        headerBgImagePosition: '--meet-header-bg-image-position',
        headerBgImageOpacity: '--meet-header-bg-image-opacity',
        bodyBgImage: '--meet-body-bg-image',
        bodyTexture: '--meet-body-texture',
        bodyTextureOpacity: '--meet-body-texture-opacity',
        bodyTextureBlend: '--meet-body-texture-blend',
        logo: '--meet-logo-url',
        logoSize: '--meet-logo-size'
      };

      for (const [key, cssVar] of Object.entries(colorMap)) {
        if (theme[key]) skeletonElement.style.setProperty(cssVar, theme[key]);
      }
      for (const [key, cssVar] of Object.entries(imageMap)) {
        if (theme[key]) skeletonElement.style.setProperty(cssVar, theme[key]);
      }
    }

    // --- Layout Engine ---
    function buildLayout(layoutSpec, blocksById) {
      // Build nested flex DOM structure from layout spec
      // Returns the root element to append to .skeleton-content
      if (!layoutSpec || !layoutSpec.type) return null;

      if (layoutSpec.type === 'rows') {
        const container = document.createDocumentFragment();
        for (const row of (layoutSpec.rows || [])) {
          const rowEl = buildLayoutRow(row, blocksById);
          if (rowEl) container.appendChild(rowEl);
        }
        return container;
      } else if (layoutSpec.type === 'columns') {
        return buildColumnsLayout(layoutSpec, blocksById);
      }
      return null;
    }

    function buildLayoutRow(row, blocksById) {
      if (row.type === 'columns') {
        return buildColumnsLayout(row, blocksById);
      }
      // Single row with blocks
      const rowEl = document.createElement('div');
      rowEl.className = 'layout-row';
      if (row.blocks) {
        for (const blockId of row.blocks) {
          const entry = blocksById[blockId];
          if (entry) rowEl.appendChild(entry.wrapper);
        }
      }
      return rowEl;
    }

    function buildColumnsLayout(spec, blocksById) {
      const rowEl = document.createElement('div');
      rowEl.className = 'layout-row layout-columns';

      const columns = spec.columns || [];
      const defaultWidth = (100 / columns.length) + '%';

      for (const col of columns) {
        const colEl = document.createElement('div');
        colEl.className = 'layout-column';
        colEl.style.width = col.width || defaultWidth;

        if (col.blocks) {
          // Column contains blocks directly
          for (const blockId of col.blocks) {
            const entry = blocksById[blockId];
            if (entry) colEl.appendChild(entry.wrapper);
          }
        } else if (col.rows) {
          // Column contains nested rows
          for (const row of col.rows) {
            const rowEl = buildLayoutRow(row, blocksById);
            if (rowEl) colEl.appendChild(rowEl);
          }
        }
        rowEl.appendChild(colEl);
      }
      return rowEl;
    }

    // --- Temporary Preview Hook (Task 2) ---
    (async function() {
      if (paramPreview === 'skeleton' && paramSkeleton) {
        // Skeleton-only preview
        const el = await loadSkeleton(paramSkeleton);
        if (el) {
          const content = el.querySelector('.skeleton-content');
          if (content) {
            content.innerHTML = '<div style="background: #3f3f46; flex: 1; display: flex; align-items: center; justify-content: center;"><span style="color: #71717a; font-size: 24px;">skeleton-content placeholder</span></div>';
          }
        }
      } else if (paramPreview === 'block' && paramBlock) {
        // Block-only preview (no skeleton)
        const blockTypes = paramBlock.split(',').map(b => b.trim()).filter(Boolean);
        const blockSpecs = blockTypes.map(type => ({ type, id: type }));
        const blocks = await loadBlocks(blockSpecs, {});
        if (blocks.length > 0) {
          const mount = document.getElementById('skeleton-mount');
          const dataMap = {};
          for (const entry of blocks) {
            dataMap[entry.type] = entry.block.sampleData || {};
          }
          renderBlocks(blocks, mount, dataMap);
        }
      } else if (paramPreview === 'full' && paramSkeleton && paramBlock) {
        // Full preview: skeleton + blocks
        const el = await loadSkeleton(paramSkeleton);
        if (!el) return;
        const content = el.querySelector('.skeleton-content');
        if (!content) return;

        // Fetch theme if specified
        if (paramTheme) {
          try {
            const snap = await db.ref('themes/' + paramTheme).once('value');
            const themeData = snap.val();
            if (themeData) applyTheme(el, themeData);
          } catch (err) {
            console.error('[stage] Theme fetch error:', err);
          }
        }

        const blockTypes = paramBlock.split(',').map(b => b.trim()).filter(Boolean);
        // Assign unique ids for layout (type-0, type-1, etc.)
        const typeCount = {};
        const blockSpecs = blockTypes.map(type => {
          typeCount[type] = (typeCount[type] || 0);
          const id = type + '-' + typeCount[type]++;
          return { type, id };
        });
        const blocks = await loadBlocks(blockSpecs, {});
        if (blocks.length > 0) {
          const dataMap = {};
          for (const entry of blocks) {
            dataMap[entry.id] = entry.block.sampleData || {};
          }

          // Check for layout param
          if (paramLayout === 'columns' && blocks.length > 1) {
            // Build columns layout with equal widths
            const blocksById = {};
            for (const entry of blocks) blocksById[entry.id] = entry;
            const layoutSpec = {
              type: 'columns',
              columns: blocks.map(entry => ({ blocks: [entry.id] }))
            };
            const layoutEl = buildLayout(layoutSpec, blocksById);
            if (layoutEl) {
              content.appendChild(layoutEl);
              // Render each block's content
              for (const entry of blocks) {
                const data = dataMap[entry.id] || entry.block.sampleData || {};
                entry.block.render(entry.wrapper, data, { comp: paramComp, theme: null, db: db, compConfig: null });
                entry.wrapper.style.opacity = '1';
                entry.wrapper.style.pointerEvents = 'auto';
              }
            }
          } else {
            // Default: render blocks directly to content
            renderBlocks(blocks, content, dataMap);
          }
        }
      }
    })();
  </script>
</body>
</html>
